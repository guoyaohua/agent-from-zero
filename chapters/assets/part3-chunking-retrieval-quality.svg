<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">切块与检索质量</title>
  <desc id="desc">展示 chunk size、overlap、结构化切块、父子块和邻接扩展如何影响召回、精度和证据完整性。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.arrow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.good{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}.mid{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.ctx{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="660"/><text class="title" x="56" y="58">切块: 检索单元决定 RAG 上限</text><text class="sub" x="56" y="86">块要足够小以便命中,又要足够完整以支撑回答。结构、元数据和回源能力比固定数字更重要。</text>
  <rect class="panel" x="64" y="132" width="310" height="174" rx="8"/><text class="head" x="96" y="170">切得太小</text><rect class="bad" x="102" y="204" width="70" height="34"/><rect class="bad" x="184" y="204" width="70" height="34"/><rect class="bad" x="266" y="204" width="70" height="34"/><text class="text" x="96" y="270">召回精准,但语义和条件不完整</text>
  <rect class="panel" x="406" y="132" width="310" height="174" rx="8"/><text class="head" x="438" y="170">切得太大</text><rect class="mid" x="456" y="204" width="212" height="40"/><text class="text" x="438" y="270">上下文完整,但主题混杂、召回不准</text>
  <rect class="panel" x="748" y="132" width="310" height="174" rx="8"/><text class="head" x="780" y="170">结构化切块</text><rect class="good" x="788" y="204" width="86" height="38"/><rect class="good" x="890" y="204" width="126" height="38"/><text class="text" x="780" y="270">按标题、条款、函数、表格行组切</text>
  <rect class="panel" x="64" y="366" width="994" height="170" rx="8"/><text class="head" x="96" y="404">提升证据完整性的组合</text><rect class="ctx" x="112" y="438" width="170" height="48" rx="8"/><text class="text" x="152" y="467">父子块检索</text><rect class="ctx" x="332" y="438" width="170" height="48" rx="8"/><text class="text" x="372" y="467">邻接块扩展</text><rect class="ctx" x="552" y="438" width="170" height="48" rx="8"/><text class="text" x="584" y="467">元数据过滤</text><rect class="ctx" x="772" y="438" width="170" height="48" rx="8"/><text class="text" x="812" y="467">Hard negatives</text><path class="arrow" d="M282 462 H332"/><path class="arrow" d="M502 462 H552"/><path class="arrow" d="M722 462 H772"/>
  <text class="mono" x="112" y="580">诊断: 找不到? 排不前? 找到了但没用好? 三类问题要分开看。</text>
</svg>
