<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">工具结果进入短期记忆的三层结构</title>
  <desc id="desc">展示工具结果应同时保存原始 artifact、结构化提取和工作摘要,避免只存摘要或把完整日志塞进上下文。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.raw{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.struct{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}.summary{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.8}.ctx{fill:#ece7f3;stroke:#7c5aa6;stroke-width:1.8}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}.back{fill:none;stroke:#2d7d80;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#green)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2d7d80"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">工具结果不要只追加到聊天历史,要分层进入短期状态</text>
  <text class="sub" x="56" y="82">原始结果用于回源,结构化字段用于决策,工作摘要用于下一轮上下文。</text>
  <rect class="raw" x="80" y="156" width="230" height="150" rx="8"/><text class="head" x="136" y="190">原始 artifact</text><text class="text" x="120" y="226">完整 stdout / 文件 / 网页</text><text class="text" x="120" y="254">artifact://test-17</text><text class="small" x="120" y="286">不直接全部塞进 prompt</text>
  <path class="arrow" d="M310 232 H390"/>
  <rect class="struct" x="390" y="136" width="260" height="190" rx="8"/><text class="head" x="462" y="170">结构化提取</text><text class="text" x="430" y="208">status: failed</text><text class="text" x="430" y="236">failed_file: UserService.test.ts</text><text class="text" x="430" y="264">assertion: active undefined</text><text class="text" x="430" y="292">stack: src/user-service.ts:18</text>
  <path class="arrow" d="M650 232 H730"/>
  <rect class="summary" x="730" y="156" width="300" height="150" rx="8"/><text class="head" x="824" y="190">工作摘要</text><text class="text" x="772" y="226">相关测试显示 active 默认值缺失</text><text class="text" x="772" y="254">当前假设: createUser 未设置默认值</text><text class="small" x="772" y="286">进入下一轮 context pack</text>
  <rect class="ctx" x="312" y="384" width="496" height="58" rx="8"/><text class="head" x="354" y="418">回源规则</text><text class="text" x="470" y="418">摘要必须带 artifact 引用;需要细节时再读取原始结果。</text>
  <path class="back" d="M560 384 C456 342 284 330 202 306"/>
</svg>
