<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">长期记忆治理台</title>
  <desc id="desc">展示长期记忆应记录使用日志、结果反馈、冲突队列、衰减机制和用户控制,让记忆能被更新、降权、删除和解释。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">长期记忆需要治理台,否则会慢慢变成旧噪声</text>
  <text class="sub" x="48" y="78">每条记忆都要能解释来源、使用效果、冲突、过期和用户控制。</text>

  <rect class="panel" x="48" y="112" width="1024" height="388" rx="8" />
  <rect class="blue" x="82" y="174" width="180" height="86" rx="8" />
  <text class="label" x="128" y="206">记忆记录</text>
  <text class="small" x="112" y="230">scope/source/confidence/ttl</text>
  <path class="arrow" d="M262 217 H322" />

  <rect class="green" x="322" y="148" width="180" height="70" rx="8" />
  <text class="label" x="368" y="180">使用日志</text>
  <text class="small" x="354" y="202">哪次任务用了它</text>
  <rect class="orange" x="322" y="252" width="180" height="70" rx="8" />
  <text class="label" x="368" y="284">结果反馈</text>
  <text class="small" x="354" y="306">帮助/误导/无影响</text>
  <path class="arrow" d="M502 183 H562" />
  <path class="arrow" d="M502 287 H562" />

  <rect class="red" x="562" y="148" width="190" height="174" rx="8" />
  <text class="label" x="616" y="180">治理决策</text>
  <text class="small" x="594" y="210">冲突队列</text>
  <text class="small" x="594" y="234">过期衰减</text>
  <text class="small" x="594" y="258">提高/降低置信度</text>
  <text class="small" x="594" y="282">更新或删除</text>
  <path class="arrow" d="M752 235 H822" />

  <rect class="gray" x="822" y="174" width="180" height="86" rx="8" />
  <text class="label" x="868" y="206">用户控制</text>
  <text class="small" x="854" y="230">查看/修正/删除</text>

  <rect class="gray" x="128" y="374" width="854" height="58" rx="8" />
  <text class="label" x="160" y="408">治理目标</text>
  <text class="text" x="260" y="408">让长期记忆能被解释、被纠正、被降权、被删除,而不是永久影响未来上下文。</text>

  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式: 长期记忆写入只是开始,真正可靠来自使用后的反馈、冲突处理和用户可控。</text>
</svg>
