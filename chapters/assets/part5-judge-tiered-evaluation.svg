<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">分级 LLM Judge 评估策略</title>
  <desc id="desc">展示先用规则过滤,再用小 Judge、强 Judge 和人工抽检处理不同风险和争议样本,降低评估成本和漂移风险。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.rule{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}.small{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.8}.strong{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.human{fill:#f7d9df;stroke:#b13c52;stroke-width:1.8}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">Judge 不是越强越全量越好,而是按风险分级使用</text>
  <text class="sub" x="56" y="82">确定性问题先用规则,语义问题再用 Judge,高风险和争议样本交给强 Judge 或人工。</text>
  <rect class="rule" x="70" y="182" width="190" height="112" rx="8"/><text class="head" x="124" y="216">规则检查</text><text class="text" x="108" y="250">schema / 权限 / 引用 ID</text><text class="text" x="108" y="274">明显失败或通过</text>
  <path class="arrow" d="M260 238 H336"/>
  <rect class="small" x="336" y="152" width="190" height="172" rx="8"/><text class="head" x="390" y="186">小 Judge</text><text class="text" x="374" y="220">低风险语义维度</text><text class="text" x="374" y="248">批量样本</text><text class="text" x="374" y="276">成本低,需抽检</text>
  <path class="arrow" d="M526 238 H602"/>
  <rect class="strong" x="602" y="152" width="190" height="172" rx="8"/><text class="head" x="656" y="186">强 Judge</text><text class="text" x="640" y="220">关键样本</text><text class="text" x="640" y="248">争议样本</text><text class="text" x="640" y="276">高价值任务</text>
  <path class="arrow" d="M792 238 H868"/>
  <rect class="human" x="868" y="182" width="190" height="112" rx="8"/><text class="head" x="930" y="216">人工抽检</text><text class="text" x="906" y="250">高风险 / 低一致性</text><text class="text" x="906" y="274">校准 gold set</text>
  <rect x="162" y="420" width="796" height="38" rx="8" fill="#172033"/><text x="242" y="444" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">Judge 是评估系统的一层,不是替代规则、程序验证和人工校准。</text>
</svg>
