<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">四层责任与不可替代能力</title><desc id="desc">用矩阵解释 Prompt、Context、Harness、Loop 各自拥有的责任、不可替代能力、失败信号和测试方法。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12.5px system-ui;fill:#fff}.c{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.tag{fill:#172033}</style></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">四层不是术语堆叠,而是四种责任所有权</text><text class="s" x="56" y="86">判断一层是否真实存在,看它是否拥有输入、输出、失败信号和可测试边界。</text><rect class="c" x="60" y="120" width="1000" height="420" rx="10"/><rect class="tag" x="80" y="144" width="142" height="36" rx="7"/><text class="m" x="119" y="167">责任层</text><rect class="tag" x="228" y="144" width="250" height="36" rx="7"/><text class="m" x="303" y="167">拥有的权力</text><rect class="tag" x="484" y="144" width="250" height="36" rx="7"/><text class="m" x="548" y="167">不可替代能力</text><rect class="tag" x="740" y="144" width="300" height="36" rx="7"/><text class="m" x="832" y="167">失败信号与测试</text><rect class="p" x="80" y="196" width="142" height="70" rx="8"/><text class="h" x="119" y="226">Prompt</text><text class="x" x="102" y="248">任务表达权</text><text class="x" x="248" y="218">把目标、角色、约束、格式</text><text class="x" x="248" y="240">压成本轮模型可遵守指令</text><text class="x" x="504" y="218">澄清“应该怎样回答”</text><text class="x" x="504" y="240">不能提供事实或执行权限</text><text class="x" x="762" y="212">格式漂移、字段含糊、口吻不稳</text><text class="x" x="762" y="238">测: schema 通过率、样例一致性</text><rect class="g" x="80" y="282" width="142" height="70" rx="8"/><text class="h" x="116" y="312">Context</text><text class="x" x="102" y="334">事实可见权</text><text class="x" x="248" y="304">选择证据、状态、记忆、</text><text class="x" x="248" y="326">工具结果和预算视图</text><text class="x" x="504" y="304">让模型看见正确材料</text><text class="x" x="504" y="326">不能替系统验证动作</text><text class="x" x="762" y="298">漏证据、旧证据、噪声、注入</text><text class="x" x="762" y="324">测: 召回、引用覆盖、污染率</text><rect class="o" x="80" y="368" width="142" height="70" rx="8"/><text class="h" x="112" y="398">Harness</text><text class="x" x="102" y="420">动作执行权</text><text class="x" x="248" y="390">校验 action、权限、预算、</text><text class="x" x="248" y="412">sandbox、trace、错误协议</text><text class="x" x="504" y="390">保证越权动作不会发生</text><text class="x" x="504" y="412">不能替模型规划任务</text><text class="x" x="762" y="384">未知工具执行、重复副作用</text><text class="x" x="762" y="410">测: 拦截率、幂等、审计完整率</text><rect class="v" x="80" y="454" width="142" height="70" rx="8"/><text class="h" x="126" y="484">Loop</text><text class="x" x="102" y="506">时间控制权</text><text class="x" x="248" y="476">状态机、停止条件、</text><text class="x" x="248" y="498">重规划、检查点、恢复</text><text class="x" x="504" y="476">让任务随反馈收敛</text><text class="x" x="504" y="498">不能替单步安全校验</text><text class="x" x="762" y="470">重复动作、目标漂移、无限尝试</text><text class="x" x="762" y="496">测: 无进展轮、停止正确率</text><rect class="c" x="90" y="558" width="940" height="38" rx="8"/><text class="x" x="120" y="582">快速判断: 事实错看 Context,动作越权看 Harness,多轮空转看 Loop,表达混乱再看 Prompt。</text></svg>
