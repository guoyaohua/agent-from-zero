<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">护栏组合故障模式</title>
  <desc id="desc">展示多个护栏串联时可能出现的重复拦截、标签丢失、阶段过晚和动作冲突。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 26px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.sub{font:400 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.stage{fill:#dbeafe;stroke:#2563eb}.bad{fill:#fee2e2;stroke:#dc2626}.warn{fill:#fef3c7;stroke:#d97706}.ok{fill:#dcfce7;stroke:#16a34a}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="48" y="48">多个护栏叠在一起,也会产生新的系统故障</text>
  <text class="sub" x="48" y="74">组合护栏要定义顺序、共享标签和统一动作,否则会漏拦、误拦或太晚拦。</text>
  <rect class="stage" x="58" y="118" width="180" height="82" rx="8"/><text class="h" x="104" y="151">Input rule</text><text class="t" x="86" y="175">便宜确定,先执行</text>
  <rect class="stage" x="292" y="118" width="180" height="82" rx="8"/><text class="h" x="332" y="151">Classifier</text><text class="t" x="318" y="175">语义风险打标签</text>
  <rect class="stage" x="526" y="118" width="180" height="82" rx="8"/><text class="h" x="570" y="151">Tool policy</text><text class="t" x="552" y="175">执行前强约束</text>
  <rect class="stage" x="760" y="118" width="180" height="82" rx="8"/><text class="h" x="806" y="151">Output check</text><text class="t" x="792" y="175">交付前校验</text>
  <path class="arrow" d="M238 159 H292 M472 159 H526 M706 159 H760"/>
  <rect class="box" x="58" y="254" width="1004" height="210" rx="10"/>
  <text class="h" x="88" y="288">常见组合故障与修复</text>
  <rect class="bad" x="88" y="316" width="220" height="96" rx="8"/>
  <text class="h" x="118" y="344">重复拦截</text>
  <text class="t" x="118" y="370">多个护栏各自弹确认</text>
  <text class="t" x="118" y="394">修复: 汇总成一个决策</text>
  <rect class="warn" x="332" y="316" width="220" height="96" rx="8"/>
  <text class="h" x="362" y="344">标签丢失</text>
  <text class="t" x="362" y="370">summary 丢掉 trust/data_class</text>
  <text class="t" x="362" y="394">修复: 标签随 artifact 传播</text>
  <rect class="bad" x="576" y="316" width="220" height="96" rx="8"/>
  <text class="h" x="606" y="344">阶段过晚</text>
  <text class="t" x="606" y="370">输出阶段才发现已执行</text>
  <text class="t" x="606" y="394">修复: 写工具必须 tool_pre</text>
  <rect class="ok" x="820" y="316" width="210" height="96" rx="8"/>
  <text class="h" x="850" y="344">动作冲突</text>
  <text class="t" x="850" y="370">一个要求降级,一个要求拒绝</text>
  <text class="t" x="850" y="394">修复: 定义优先级和仲裁</text>
</svg>
