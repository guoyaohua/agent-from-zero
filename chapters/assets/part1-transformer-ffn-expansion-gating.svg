<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Transformer FFN 的扩维、门控与回写</title>
  <desc id="desc">展示 Transformer 中 FFN 如何把每个 token 向量从 d_model 扩展到更宽的 d_ff,通过激活或 SwiGLU 门控加工,再投影回 residual stream。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2; marker-end: url(#arrow); }
      .main { fill: none; stroke: #172033; stroke-width: 4.5; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="560" />
  <text class="title" x="48" y="48">FFN 像每个 token 的“局部工作台”: 先扩维,再筛选,再写回</text>
  <text class="sub" x="48" y="74">Attention 搬来上下文信息后,FFN 在当前位置内部做大规模非线性加工。</text>
  <rect class="panel" x="48" y="104" width="1024" height="340" rx="8" />
  <path class="main" d="M100 340 H1020" />
  <text class="small" x="100" y="324">residual stream</text>

  <rect class="blue" x="118" y="190" width="130" height="80" rx="8" />
  <text class="label" x="150" y="222">token x</text>
  <text class="small" x="144" y="248">d_model</text>
  <path class="arrow" d="M248 230 H326" />

  <rect class="orange" x="326" y="166" width="170" height="128" rx="8" />
  <text class="label" x="364" y="198">W_up / W_gate</text>
  <text class="small" x="358" y="226">扩到 d_ff</text>
  <text class="small" x="358" y="250">常比 d_model 宽很多</text>
  <path class="arrow" d="M496 230 H574" />

  <rect class="green" x="574" y="150" width="184" height="160" rx="8" />
  <text class="label" x="628" y="182">激活/门控</text>
  <rect class="blue" x="612" y="214" width="48" height="42" rx="6" />
  <rect class="red" x="676" y="214" width="48" height="42" rx="6" />
  <text class="small" x="606" y="284">SwiGLU: gate 控制 value 通过多少</text>
  <path class="arrow" d="M758 230 H836" />

  <rect class="red" x="836" y="190" width="130" height="80" rx="8" />
  <text class="label" x="870" y="222">W_down</text>
  <text class="small" x="866" y="248">回到 d_model</text>
  <path class="arrow" d="M901 270 V340" />

  <rect class="panel" x="178" y="382" width="764" height="46" rx="8" />
  <text class="text" x="206" y="406">这就是 FFN 参数多的原因: 两次大矩阵投影加上更宽的中间空间,</text>
  <text class="text" x="206" y="424">为每个 token 提供高容量的特征加工能力。</text>
  <rect class="panel" x="72" y="470" width="976" height="42" rx="8" />
  <text class="text" x="98" y="496">读图方式: FFN 不直接看别的位置,但它加工的是 Attention 已经写入当前 token 的上下文信息。</text>
</svg>
