<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">模型选型 Scorecard</title>
  <desc id="desc">展示模型选型应同时比较质量、成本、延迟、合规、上下文、工具能力、可控性和失败可发现性。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.pass{fill:#e7f1ee}.warn{fill:#fff0e6}.fail{fill:#f7d9df}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">模型选型不是榜单排名,而是约束下的 Scorecard</text>
  <text class="sub" x="56" y="82">同一个 Agent 产品里,不同任务可能需要不同模型角色。</text>
  <text class="head" x="98" y="134">维度</text><text class="head" x="278" y="134">强 API</text><text class="head" x="454" y="134">私有开源</text><text class="head" x="650" y="134">小模型</text><text class="head" x="842" y="134">决策提示</text>
  <g transform="translate(72 156)">
    <rect class="cell" x="0" y="0" width="150" height="46"/><text class="text" x="24" y="29">复杂质量</text><rect class="cell pass" x="180" y="0" width="140" height="46"/><text class="text" x="226" y="29">高</text><rect class="cell warn" x="350" y="0" width="140" height="46"/><text class="text" x="392" y="29">中高</text><rect class="cell fail" x="520" y="0" width="140" height="46"/><text class="text" x="570" y="29">低</text><rect class="cell" x="690" y="0" width="280" height="46"/><text class="text" x="714" y="29">复杂推理优先强模型</text>
    <rect class="cell" x="0" y="62" width="150" height="46"/><text class="text" x="24" y="91">数据合规</text><rect class="cell warn" x="180" y="62" width="140" height="46"/><text class="text" x="216" y="91">看合同</text><rect class="cell pass" x="350" y="62" width="140" height="46"/><text class="text" x="392" y="91">强</text><rect class="cell pass" x="520" y="62" width="140" height="46"/><text class="text" x="568" y="91">强</text><rect class="cell" x="690" y="62" width="280" height="46"/><text class="text" x="714" y="91">敏感数据先看出域边界</text>
    <rect class="cell" x="0" y="124" width="150" height="46"/><text class="text" x="24" y="153">延迟成本</text><rect class="cell warn" x="180" y="124" width="140" height="46"/><text class="text" x="222" y="153">较高</text><rect class="cell warn" x="350" y="124" width="140" height="46"/><text class="text" x="392" y="153">可控</text><rect class="cell pass" x="520" y="124" width="140" height="46"/><text class="text" x="568" y="153">低</text><rect class="cell" x="690" y="124" width="280" height="46"/><text class="text" x="714" y="153">高频低风险走小模型</text>
    <rect class="cell" x="0" y="186" width="150" height="46"/><text class="text" x="24" y="215">工具/多模态</text><rect class="cell pass" x="180" y="186" width="140" height="46"/><text class="text" x="226" y="215">成熟</text><rect class="cell warn" x="350" y="186" width="140" height="46"/><text class="text" x="386" y="215">依模型</text><rect class="cell fail" x="520" y="186" width="140" height="46"/><text class="text" x="568" y="215">有限</text><rect class="cell" x="690" y="186" width="280" height="46"/><text class="text" x="714" y="215">看目标模态和工具协议</text>
  </g>
  <rect x="168" y="434" width="784" height="38" rx="8" fill="#172033"/><text x="250" y="458" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">最适合的模型是能在你的约束下稳定完成任务,且失败能被发现。</text>
</svg>
