<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">RMSNorm 与 SwiGLU 在 Transformer 块中的位置</title>
  <desc id="desc">展示 Pre-Norm Transformer 中 RMSNorm 控制残差输入尺度,以及 SwiGLU 在 FFN 中用内容分支和门控分支做逐元素乘法。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .mono { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2d7d80; stroke-width: 2; marker-end: url(#greenArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d7d80" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">RMSNorm 控制尺度,SwiGLU 控制特征通行</text>
  <text class="sub" x="48" y="78">这些组件不直接“产生知识”,但让深层残差网络在大规模训练中更稳、更高效。</text>
  <rect class="panel" x="48" y="112" width="1024" height="394" rx="8" />
  <text class="label" x="76" y="146">Pre-Norm Transformer Block</text>
  <rect class="gray" x="74" y="224" width="78" height="52" rx="8" /><text class="label" x="102" y="256">x</text>
  <path class="arrow" d="M152 250 H214" />
  <rect class="blue" x="214" y="212" width="118" height="76" rx="8" />
  <text class="label" x="242" y="240">RMSNorm</text><text class="text" x="238" y="264">只控尺度</text>
  <path class="arrow" d="M332 250 H386" />
  <rect class="green" x="386" y="212" width="118" height="76" rx="8" />
  <text class="label" x="418" y="240">Attention</text><text class="text" x="410" y="264">信息路由</text>
  <path class="arrow" d="M504 250 H560" />
  <circle cx="586" cy="250" r="24" fill="#ffffff" stroke="#2d7d80" stroke-width="2" />
  <text class="label" x="579" y="256">+</text>
  <path class="loop" d="M112 224 C168 160 500 160 586 226" />
  <text class="small" x="250" y="174">残差主干保留原信息,子层只写入增量</text>
  <path class="arrow" d="M610 250 H666" />
  <rect class="blue" x="666" y="212" width="118" height="76" rx="8" />
  <text class="label" x="694" y="240">RMSNorm</text><text class="text" x="690" y="264">再稳一次</text>
  <path class="arrow" d="M784 250 H838" />
  <rect class="orange" x="838" y="184" width="194" height="132" rx="8" />
  <text class="label" x="890" y="212">SwiGLU FFN</text>
  <text class="mono" x="866" y="242">content = xWa</text>
  <text class="mono" x="866" y="266">gate = SiLU(xWb)</text>
  <text class="mono" x="866" y="290">out = Wo(content * gate)</text>
  <path class="arrow" d="M1032 250 H1042" />
  <rect class="gray" x="74" y="350" width="284" height="94" rx="8" />
  <text class="label" x="100" y="380">LayerNorm vs RMSNorm</text>
  <text class="mono" x="100" y="408">LN:  (x - mean) / std</text>
  <text class="mono" x="100" y="432">RMS: x / sqrt(mean(x^2))</text>
  <rect class="gray" x="400" y="350" width="284" height="94" rx="8" />
  <text class="label" x="426" y="380">为什么门控有用</text>
  <text class="text" x="426" y="408">内容分支给候选特征</text>
  <text class="text" x="426" y="432">门控分支决定通过多少</text>
  <rect class="gray" x="726" y="350" width="280" height="94" rx="8" />
  <text class="label" x="752" y="380">工程影响</text>
  <text class="text" x="752" y="408">更稳的激活尺度</text>
  <text class="text" x="752" y="432">更好的参数利用率与推理效率</text>
  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式:现代 LLM 的能力来自整套配方;Norm、激活、残差、位置编码和注意力变体会互相影响。</text>
</svg>
