<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">为什么需要 AI Agent</title>
  <desc id="desc">普通模型回答与真实任务完成之间存在执行缺口,Agent 用工具、状态、反馈和评估把语言能力接入行动链路。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .card { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; rx: 8; }
      .soft { fill: #eef3f8; stroke: #d8e0eb; stroke-width: 1.1; rx: 8; }
      .head { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .text { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .tag { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .bridge { fill: none; stroke: #9aa7ba; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 12 10; }
      .arrow { fill: none; stroke: #9aa7ba; stroke-width: 2.2; marker-end: url(#arrow); }
      .step1 { animation: glow 4s ease-in-out infinite; }
      .step2 { animation: glow 4s ease-in-out .6s infinite; }
      .step3 { animation: glow 4s ease-in-out 1.2s infinite; }
      .step4 { animation: glow 4s ease-in-out 1.8s infinite; }
      .step5 { animation: glow 4s ease-in-out 2.4s infinite; }
      @keyframes glow { 0%, 100% { opacity: .55; } 35% { opacity: 1; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa7ba" />
    </marker>
  </defs>

  <rect class="bg" width="1120" height="620" />
  <text class="title" x="56" y="58">为什么需要 Agent:真实任务中间隔着一条“执行缺口”</text>
  <text class="subtitle" x="56" y="86">LLM 会说、会总结、会生成计划;Agent 的价值是把这些能力接到工具、状态和反馈上。</text>

  <rect class="card" x="66" y="154" width="260" height="304" rx="8" />
  <rect x="90" y="182" width="86" height="26" rx="5" fill="#355c9a" />
  <text class="tag" x="104" y="200">用户目标</text>
  <text class="head" x="90" y="242">想要的是结果</text>
  <text class="text" x="90" y="278">分析这个项目为什么测试失败</text>
  <text class="text" x="90" y="310">整理竞品资料并给出表格</text>
  <text class="text" x="90" y="342">检查合同里的风险条款</text>
  <text class="text" x="90" y="374">把客服工单处理到可提交</text>
  <rect class="soft" x="90" y="404" width="212" height="34" rx="8" />
  <text class="label" x="110" y="426">不是只要一句建议</text>

  <path class="bridge" d="M326 306 C410 226 478 226 560 306 C642 386 710 386 794 306" />
  <path class="arrow" d="M326 306 C410 226 478 226 560 306 C642 386 710 386 794 306" />
  <rect class="soft step1" x="388" y="160" width="120" height="42" rx="8" />
  <text class="label" x="420" y="186">找资料</text>
  <rect class="soft step2" x="486" y="220" width="120" height="42" rx="8" />
  <text class="label" x="518" y="246">用工具</text>
  <rect class="soft step3" x="522" y="316" width="120" height="42" rx="8" />
  <text class="label" x="554" y="342">看反馈</text>
  <rect class="soft step4" x="604" y="244" width="120" height="42" rx="8" />
  <text class="label" x="636" y="270">修正</text>
  <rect class="soft step5" x="646" y="384" width="120" height="42" rx="8" />
  <text class="label" x="678" y="410">交付</text>
  <text class="text" x="462" y="494">执行缺口 = 计划、外部信息、工具动作、错误恢复、结果校验</text>

  <rect class="card" x="794" y="154" width="260" height="304" rx="8" />
  <rect x="818" y="182" width="86" height="26" rx="5" fill="#2d7d80" />
  <text class="tag" x="832" y="200">Agent 系统</text>
  <text class="head" x="818" y="242">把能力接成链路</text>
  <text class="text" x="818" y="278">模型:理解目标并选择下一步</text>
  <text class="text" x="818" y="310">工具:访问真实外部世界</text>
  <text class="text" x="818" y="342">状态:记录任务进度和约束</text>
  <text class="text" x="818" y="374">评估:判断结果是否足够好</text>
  <rect class="soft" x="818" y="404" width="212" height="34" rx="8" />
  <text class="label" x="838" y="426">从会回答到会推进</text>

  <rect class="soft" x="76" y="540" width="968" height="38" rx="8" />
  <text class="text" x="100" y="564">关键判断:只需要内容生成时,普通 LLM 就够;需要跨步骤观察、行动和修正时,才值得引入 Agent。</text>
</svg>
