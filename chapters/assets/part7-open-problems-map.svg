<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">开放问题与局限</title><desc id="desc">展示 Agent 在可靠性、评估、长期记忆、安全、成本、可解释性和人机协作方面的开放问题。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12.5px system-ui;fill:#435066}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#f7d9df;stroke:#b13c52;stroke-width:2}</style></defs><rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">开放问题: Agent 还远没有被完全解决</text><text class="sub" x="56" y="86">前沿不是只看更强模型,也要看可靠性、评估、安全、记忆、成本和组织协作。</text><rect class="panel" x="182" y="150" width="756" height="380" rx="8"/><rect class="n" x="238" y="206" width="180" height="70" rx="8"/><text class="head" x="286" y="234">Reliability</text><text class="text" x="270" y="256">长链路稳定性</text><rect class="n2" x="470" y="206" width="180" height="70" rx="8"/><text class="head" x="520" y="234">Evaluation</text><text class="text" x="506" y="256">真实任务度量</text><rect class="n3" x="702" y="206" width="180" height="70" rx="8"/><text class="head" x="754" y="234">Memory</text><text class="text" x="734" y="256">长期治理</text><rect class="n4" x="238" y="348" width="180" height="70" rx="8"/><text class="head" x="292" y="376">Safety</text><text class="text" x="270" y="398">工具与数据边界</text><rect class="n" x="470" y="348" width="180" height="70" rx="8"/><text class="head" x="528" y="376">Cost</text><text class="text" x="500" y="398">规模化经济性</text><rect class="n2" x="702" y="348" width="180" height="70" rx="8"/><text class="head" x="746" y="376">Interpretability</text><text class="text" x="734" y="398">理解内部机制</text></svg>

