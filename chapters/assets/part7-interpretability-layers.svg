<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">大模型可解释性层次</title><desc id="desc">展示大模型可解释性从行为、表示、注意力、线路、特征和机制理解的层次。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12.5px system-ui;fill:#435066}.l1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.l2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.l3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.l4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.l5{fill:#f7d9df;stroke:#b13c52;stroke-width:2}</style></defs><rect class="bg" width="1120" height="700"/><text class="title" x="56" y="58">可解释性: 从行为解释走向机制理解</text><text class="sub" x="56" y="86">理解模型不只是看输出理由,还包括表示、特征、线路和因果机制。</text><rect class="l1" x="230" y="170" width="660" height="64" rx="8"/><text class="head" x="486" y="208">Behavior</text><rect class="l2" x="270" y="252" width="580" height="64" rx="8"/><text class="head" x="492" y="290">Representations</text><rect class="l3" x="310" y="334" width="500" height="64" rx="8"/><text class="head" x="494" y="372">Features</text><rect class="l4" x="350" y="416" width="420" height="64" rx="8"/><text class="head" x="506" y="454">Circuits</text><rect class="l5" x="390" y="498" width="340" height="64" rx="8"/><text class="head" x="500" y="536">Mechanisms</text><text class="text" x="310" y="624">对 Agent 工程来说,可解释性短期更常体现在 trace、证据链和工具决策;长期才是模型内部机制。</text></svg>

