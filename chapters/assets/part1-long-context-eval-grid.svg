<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">长上下文能力评估网格</title>
  <desc id="desc">展示长上下文评估应同时覆盖容量、成本、利用率和抗干扰,不能只做 needle-in-a-haystack。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.ok{fill:#e7f1ee}.warn{fill:#fff0e6}.risk{fill:#f7d9df}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">长上下文不是看能放多长,而是看能不能稳定用对</text>
  <text class="sub" x="56" y="82">容量、成本、利用率和鲁棒性要分开评估。</text>
  <text class="head" x="106" y="136">评估维度</text><text class="head" x="326" y="136">样本设计</text><text class="head" x="590" y="136">常见误判</text><text class="head" x="836" y="136">上线门禁</text>
  <g transform="translate(78 158)">
    <rect class="cell ok" x="0" y="0" width="190" height="54"/><text class="text" x="24" y="24">容量</text><text class="text" x="24" y="44">128K 是否能跑完</text>
    <rect class="cell" x="220" y="0" width="230" height="54"/><text class="text" x="244" y="24">不同长度 prompt</text><text class="text" x="244" y="44">TTFT / OOM / 截断</text>
    <rect class="cell warn" x="480" y="0" width="220" height="54"/><text class="text" x="504" y="34">能放下不等于会使用</text>
    <rect class="cell" x="730" y="0" width="260" height="54"/><text class="text" x="754" y="34">不超预算,不丢关键区块</text>
    <rect class="cell ok" x="0" y="70" width="190" height="54"/><text class="text" x="24" y="94">利用</text><text class="text" x="24" y="114">多证据合成</text>
    <rect class="cell" x="220" y="70" width="230" height="54"/><text class="text" x="244" y="94">跨章节 / 多文档</text><text class="text" x="244" y="114">证据必须编号</text>
    <rect class="cell warn" x="480" y="70" width="220" height="54"/><text class="text" x="504" y="104">只找针会高估能力</text>
    <rect class="cell" x="730" y="70" width="260" height="54"/><text class="text" x="754" y="104">关键 claim 有远近证据</text>
    <rect class="cell ok" x="0" y="140" width="190" height="54"/><text class="text" x="24" y="164">鲁棒</text><text class="text" x="24" y="184">干扰和冲突</text>
    <rect class="cell" x="220" y="140" width="230" height="54"/><text class="text" x="244" y="164">hard negative</text><text class="text" x="244" y="184">lost-in-the-middle</text>
    <rect class="cell risk" x="480" y="140" width="220" height="54"/><text class="text" x="504" y="174">中间信息被忽略</text>
    <rect class="cell" x="730" y="140" width="260" height="54"/><text class="text" x="754" y="174">说明冲突,不强行合并</text>
    <rect class="cell ok" x="0" y="210" width="190" height="54"/><text class="text" x="24" y="234">Agent</text><text class="text" x="24" y="254">长轨迹状态</text>
    <rect class="cell" x="220" y="210" width="230" height="54"/><text class="text" x="244" y="234">工具日志 / state diff</text><text class="text" x="244" y="254">预算和停止条件</text>
    <rect class="cell risk" x="480" y="210" width="220" height="54"/><text class="text" x="504" y="244">历史越长越容易污染</text>
    <rect class="cell" x="730" y="210" width="260" height="54"/><text class="text" x="754" y="244">能恢复目标和当前状态</text>
  </g>
  <rect x="166" y="458" width="788" height="34" rx="8" fill="#172033"/><text x="256" y="480" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">长上下文评估要问:看见了吗,用了吗,用对了吗,在噪声中还稳吗。</text>
</svg>
