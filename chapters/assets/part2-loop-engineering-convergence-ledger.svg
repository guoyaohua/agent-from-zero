<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Loop 收敛账本</title><desc id="desc">展示 Agent Loop 每轮如何通过事实、问题、假设、产物、风险和预算账本判断是否真正收敛。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.good{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.mid{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.tag{fill:#172033}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="610"/><text class="t" x="56" y="58">收敛可以被观察: 看每轮是否更新任务账本</text><text class="s" x="56" y="86">健康 Loop 不是多跑几轮,而是让事实增加、问题缩小、假设排序、产物可验证、风险受控。</text><rect class="box" x="70" y="128" width="980" height="346" rx="12"/><rect class="tag" x="96" y="154" width="150" height="30" rx="6"/><text class="m" x="130" y="174">账本字段</text><rect class="tag" x="276" y="154" width="312" height="30" rx="6"/><text class="m" x="384" y="174">健康变化</text><rect class="tag" x="618" y="154" width="392" height="30" rx="6"/><text class="m" x="756" y="174">无变化的信号</text><rect class="good" x="96" y="204" width="150" height="44" rx="7"/><text class="h" x="124" y="232">known facts</text><text class="x" x="286" y="232">新增可回源事实,旧事实被纠正</text><text class="x" x="642" y="232">重复阅读旧材料,没有新证据</text><rect class="good" x="96" y="260" width="150" height="44" rx="7"/><text class="h" x="112" y="288">open questions</text><text class="x" x="286" y="288">减少、拆分或明确阻塞原因</text><text class="x" x="642" y="288">问题空间仍然一样大</text><rect class="mid" x="96" y="316" width="150" height="44" rx="7"/><text class="h" x="124" y="344">hypotheses</text><text class="x" x="286" y="344">被验证、推翻或重新排序</text><text class="x" x="642" y="344">还在凭直觉重复尝试</text><rect class="mid" x="96" y="372" width="150" height="44" rx="7"/><text class="h" x="132" y="400">artifacts</text><text class="x" x="286" y="400">产生草稿、patch、证据包或报告</text><text class="x" x="642" y="400">没有可检查产物</text><rect class="bad" x="96" y="428" width="150" height="44" rx="7"/><text class="h" x="128" y="456">risk/budget</text><text class="x" x="286" y="456">风险被确认或降级,预算有策略地消耗</text><text class="x" x="642" y="456">风险和成本被动累积</text><path class="a" d="M246 226H276M246 282H276M246 338H276M246 394H276M246 450H276"/><rect class="box" x="148" y="514" width="824" height="42" rx="8"/><text class="x" x="178" y="540">Loop 决策: 如果账本连续两轮没有实质变化,就触发 replan、ask_user、degrade 或 stop。</text></svg>
