<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">长时程 Loop 的工程机制</title><desc id="desc">展示长时程 Agent Loop 中检查点、预算、无进展检测、回滚和人类确认如何共同控制任务推进。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.track{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.cp{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.gate{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.risk{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.a{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="520"/><text class="t" x="56" y="58">长时程 Agent 的 Loop 必须能中断、恢复和纠偏</text><text class="s" x="56" y="86">任务越长,越不能只靠上下文窗口记住一切;需要持久状态和明确控制点。</text>
  <g transform="translate(0,-103)"><rect class="track" x="90" y="190" width="940" height="140" rx="12"/><rect class="cp" x="130" y="232" width="126" height="58" rx="8"/><text class="x" x="166" y="266">Plan</text><rect class="cp" x="310" y="232" width="126" height="58" rx="8"/><text class="x" x="344" y="266">Step 1</text><rect class="gate" x="490" y="232" width="126" height="58" rx="8"/><text class="x" x="520" y="266">Checkpoint</text><rect class="cp" x="670" y="232" width="126" height="58" rx="8"/><text class="x" x="704" y="266">Step 2</text><rect class="ok" x="850" y="232" width="126" height="58" rx="8"/><text class="x" x="888" y="266">Deliver</text><path class="a" d="M256 261H310M436 261H490M616 261H670M796 261H850"/><rect class="risk" x="130" y="420" width="230" height="80" rx="10"/><text class="h" x="188" y="452">No Progress</text><text class="x" x="160" y="476">重复动作、无新增证据</text><rect class="gate" x="445" y="420" width="230" height="80" rx="10"/><text class="h" x="520" y="452">Rollback</text><text class="x" x="475" y="476">回到最近可验证检查点</text><rect class="gate" x="760" y="420" width="230" height="80" rx="10"/><text class="h" x="822" y="452">Human Gate</text><text class="x" x="790" y="476">高风险或目标变化时确认</text><path class="a" d="M245 420C300 370 426 330 536 290M560 420V290M875 420C830 366 770 326 733 290"/><text class="x" x="126" y="572">长任务的核心不是让模型“一次想完整”,而是把任务切成可验证阶段,每阶段留下检查点和回滚路径。</text>
  </g>
</svg>
