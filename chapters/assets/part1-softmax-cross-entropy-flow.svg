<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Softmax 与交叉熵流程图</title>
  <desc id="desc">展示模型 logits 经过 Softmax 变成概率分布,交叉熵只关注正确类别概率并把它转成损失。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; rx: 8; }
      .soft { fill: #eef3f8; stroke: #d8e0eb; stroke-width: 1.1; rx: 8; }
      .head { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .text { font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #435066; }
      .formula { font: 600 17px Cambria, Georgia, serif; fill: #172033; }
      .tag { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #9aa7ba; stroke-width: 2.2; marker-end: url(#arrow); }
      .bar { fill: #7c5aa6; rx: 4; }
      .bar2 { fill: #2d7d80; rx: 4; }
      .bar3 { fill: #b05c37; rx: 4; }
      .focus { fill: none; stroke: #b13c52; stroke-width: 3; stroke-dasharray: 8 6; animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa7ba" />
    </marker>
  </defs>

  <rect class="bg" width="1120" height="680" />
  <text class="title" x="56" y="58">Softmax 与交叉熵:把“分数”变成可优化的错误</text>
  <text class="subtitle" x="56" y="86">Softmax 负责归一化概率,交叉熵负责惩罚正确答案概率太低。</text>

  <rect class="panel" x="56" y="132" width="284" height="404" rx="8" />
  <rect x="82" y="160" width="74" height="26" rx="5" fill="#355c9a" />
  <text class="tag" x="96" y="178">Logits</text>
  <text class="head" x="82" y="218">模型原始分数</text>
  <line x1="112" y1="384" x2="284" y2="384" stroke="#c8d2df" stroke-width="1" />
  <rect class="bar" x="126" y="310" width="34" height="74" rx="4" />
  <rect class="bar3" x="180" y="246" width="34" height="138" rx="4" />
  <rect class="bar2" x="234" y="340" width="34" height="44" rx="4" />
  <text class="label" x="121" y="414">猫</text>
  <text class="label" x="175" y="414">狗</text>
  <text class="label" x="229" y="414">车</text>
  <text class="mono" x="100" y="466">z = [1.2, 2.4, 0.5]</text>
  <text class="text" x="100" y="494">分数可正可负,不要求相加为 1。</text>

  <path class="arrow" d="M340 334 H418" />
  <rect class="soft" x="362" y="248" width="142" height="64" rx="8" />
  <text class="formula" x="383" y="286">softmax(z)</text>

  <rect class="panel" x="418" y="132" width="284" height="404" rx="8" />
  <rect x="444" y="160" width="74" height="26" rx="5" fill="#7c5aa6" />
  <text class="tag" x="458" y="178">概率</text>
  <text class="head" x="444" y="218">归一化后的分布</text>
  <line x1="474" y1="384" x2="646" y2="384" stroke="#c8d2df" stroke-width="1" />
  <rect class="bar" x="488" y="330" width="34" height="54" rx="4" />
  <rect class="bar3" x="542" y="260" width="34" height="124" rx="4" />
  <rect class="bar2" x="596" y="354" width="34" height="30" rx="4" />
  <text class="label" x="483" y="414">猫</text>
  <text class="label" x="537" y="414">狗</text>
  <text class="label" x="591" y="414">车</text>
  <text class="mono" x="462" y="466">p = [0.21, 0.70, 0.09]</text>
  <text class="text" x="462" y="494">每一项在 0 到 1 之间。</text>
  <text class="text" x="462" y="516">所有概率总和为 1。</text>

  <path class="arrow" d="M702 334 H780" />
  <rect class="soft" x="724" y="248" width="142" height="64" rx="8" />
  <text class="formula" x="744" y="286">-log p(y)</text>

  <rect class="panel" x="780" y="132" width="284" height="404" rx="8" />
  <rect x="806" y="160" width="74" height="26" rx="5" fill="#b13c52" />
  <text class="tag" x="820" y="178">Loss</text>
  <text class="head" x="806" y="218">正确概率低,损失高</text>
  <rect class="focus" x="916" y="252" width="52" height="140" rx="8" />
  <line x1="836" y1="428" x2="1016" y2="428" stroke="#c8d2df" stroke-width="1" />
  <path d="M846 396 C890 382 918 330 940 284 C962 240 982 220 1008 210" fill="none" stroke="#b13c52" stroke-width="4" stroke-linecap="round" />
  <circle cx="940" cy="284" r="8" fill="#b13c52" stroke="#ffffff" stroke-width="3" />
  <text class="label" x="834" y="466">p(狗)=0.70</text>
  <text class="mono" x="834" y="494">loss = -log(0.70)</text>

  <rect class="soft" x="76" y="590" width="968" height="42" rx="8" />
  <text class="text" x="100" y="616">读图方式:训练会推动正确类别的概率上升,因为这样交叉熵损失会下降。</text>
</svg>
