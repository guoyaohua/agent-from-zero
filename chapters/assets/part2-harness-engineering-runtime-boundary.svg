<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Harness Engineering 运行时边界</title><desc id="desc">展示模型、Harness、工具和外部世界之间的边界:模型提出动作,Harness 校验并执行。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.m{font:400 11.8px system-ui;fill:#667085}.model{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.har{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.tool{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.world{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.gate{fill:#fff;stroke:#b05c37;stroke-width:1.5}.a{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#a)}.r{fill:none;stroke:#2d7d80;stroke-width:2.2;marker-end:url(#g)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2d7d80"/></marker></defs><rect class="bg" width="1120" height="660"/><text class="t" x="56" y="58">Harness 是模型和真实世界之间的运行时外骨架</text><text class="s" x="56" y="86">模型只产生意图;Harness 把意图变成可验证、可授权、可审计、可恢复的动作。</text><rect class="model" x="70" y="240" width="210" height="122" rx="10"/><text class="h" x="140" y="274">Model</text><text class="x" x="100" y="306">读取工作上下文</text><text class="x" x="100" y="330">生成 action proposal</text><text class="m" x="100" y="352">不直接接触真实系统</text><rect class="har" x="360" y="140" width="390" height="314" rx="12"/><text class="h" x="504" y="174">Agent Harness</text><rect class="gate" x="410" y="206" width="290" height="42" rx="7"/><text class="x" x="442" y="233">Action schema validation</text><rect class="gate" x="410" y="264" width="290" height="42" rx="7"/><text class="x" x="442" y="291">Policy and permission gate</text><rect class="gate" x="410" y="322" width="290" height="42" rx="7"/><text class="x" x="442" y="349">Executor, sandbox, timeout</text><rect class="gate" x="410" y="380" width="290" height="42" rx="7"/><text class="x" x="442" y="407">Observation normalization</text><rect class="tool" x="840" y="170" width="214" height="112" rx="10"/><text class="h" x="914" y="204">Tools</text><text class="x" x="872" y="234">API、文件、搜索</text><text class="x" x="872" y="258">数据库、浏览器</text><rect class="world" x="840" y="356" width="214" height="112" rx="10"/><text class="h" x="884" y="390">External World</text><text class="x" x="872" y="420">状态变化、副作用</text><text class="x" x="872" y="444">用户和环境反馈</text><path class="a" d="M280 300H360M750 226H840M947 282V356"/><path class="r" d="M840 424C744 500 492 520 280 346"/><rect class="gate" x="185" y="535" width="750" height="64" rx="8"/><text class="h" x="216" y="570">关键边界</text><text class="x" x="326" y="570">不要让模型“自证安全”。权限、预算、审计和回滚必须由 runtime 执行。</text></svg>
