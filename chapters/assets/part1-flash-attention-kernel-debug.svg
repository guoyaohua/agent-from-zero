<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Flash Attention Kernel 回退排查</title>
  <desc id="desc">展示 Flash Attention 性能不符合预期时,应检查硬件、dtype、head dimension、mask、dropout、框架版本和实际 backend 是否命中高效 kernel。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.warn{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.risk{fill:#f7d9df;stroke:#b13c52;stroke-width:1.7}.info{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.bar{fill:#172033}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">Flash Attention 开关打开,不代表实际命中最快 kernel</text>
  <text class="sub" x="56" y="82">性能异常时要查 backend 选择,而不是只看配置项。</text>
  <g transform="translate(82 130)">
    <rect class="box info" x="0" y="0" width="170" height="74" rx="8"/><text class="head" x="34" y="30">Request shape</text><text class="small" x="28" y="54">T / batch / heads</text>
    <path class="arrow" d="M170 37 H212"/>
    <rect class="box warn" x="212" y="0" width="170" height="74" rx="8"/><text class="head" x="254" y="30">Kernel gates</text><text class="small" x="240" y="54">dtype / dim / mask</text>
    <path class="arrow" d="M382 37 H424"/>
    <rect class="box risk" x="424" y="0" width="190" height="74" rx="8"/><text class="head" x="470" y="30">Fallback?</text><text class="small" x="452" y="54">普通 / memory efficient</text>
    <path class="arrow" d="M614 37 H656"/>
    <rect class="box ok" x="656" y="0" width="210" height="74" rx="8"/><text class="head" x="704" y="30">Trace backend</text><text class="small" x="684" y="54">记录实际 kernel 和版本</text>
  </g>
  <g transform="translate(110 260)">
    <text class="head" x="0" y="0">常见回退原因</text>
    <rect class="box" x="0" y="24" width="190" height="58" rx="8"/><text class="text" x="22" y="48">dtype 不匹配</text><text class="small" x="22" y="68">FP32 或混合路径</text>
    <rect class="box" x="216" y="24" width="190" height="58" rx="8"/><text class="text" x="238" y="48">head dim 不支持</text><text class="small" x="238" y="68">维度超出 kernel 条件</text>
    <rect class="box" x="432" y="24" width="190" height="58" rx="8"/><text class="text" x="454" y="48">mask 类型复杂</text><text class="small" x="454" y="68">非标准 causal/padding</text>
    <rect class="box" x="648" y="24" width="190" height="58" rx="8"/><text class="text" x="670" y="48">dropout / 训练态</text><text class="small" x="670" y="68">路径和推理不同</text>
    <rect class="box" x="864" y="24" width="150" height="58" rx="8"/><text class="text" x="886" y="48">版本变化</text><text class="small" x="886" y="68">框架升级回退</text>
  </g>
  <rect class="bar" x="166" y="444" width="788" height="36" rx="8"/>
  <text x="298" y="467" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">Flash Attention 的工程验收标准是实际 backend、显存曲线和延迟曲线都符合预期。</text>
</svg>
