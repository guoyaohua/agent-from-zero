<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">个人研究助手架构</title>
  <desc id="desc">展示个人研究助手由 UI、Orchestrator、Context Builder、LLM、Tools、RAG、Memory、Trace 和 Eval 组成的架构。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="700"/><text class="title" x="56" y="58">架构: 用 runtime 管状态,用模型做判断</text><text class="sub" x="56" y="86">个人研究助手的关键是把状态、工具、RAG、记忆和观测分层,避免把所有东西写进一个 prompt。</text>
  <rect class="blue" x="92" y="134" width="170" height="70" rx="8"/><text class="head" x="152" y="164">UI</text><text class="text" x="126" y="188">问题 / 答案 / 引用</text>
  <rect class="orange" x="420" y="124" width="230" height="90" rx="8"/><text class="head" x="482" y="160">Orchestrator</text><text class="text" x="458" y="186">状态、预算、路由、停止</text>
  <rect class="green" x="812" y="134" width="170" height="70" rx="8"/><text class="head" x="868" y="164">LLM</text><text class="text" x="848" y="188">规划 / 生成 / 判断</text>
  <path class="arrow" d="M262 169 H420"/><path class="arrow" d="M650 169 H812"/>
  <rect class="panel" x="104" y="300" width="190" height="90" rx="8"/><text class="head" x="154" y="334">Tools</text><text class="text" x="132" y="360">search/read/summarize</text>
  <rect class="panel" x="354" y="300" width="190" height="90" rx="8"/><text class="head" x="408" y="334">RAG</text><text class="text" x="386" y="360">chunks/vector/rerank</text>
  <rect class="panel" x="604" y="300" width="190" height="90" rx="8"/><text class="head" x="652" y="334">Memory</text><text class="text" x="638" y="360">偏好/项目/笔记</text>
  <rect class="panel" x="854" y="300" width="190" height="90" rx="8"/><text class="head" x="906" y="334">Trace</text><text class="text" x="884" y="360">span/artifact/eval</text>
  <path class="arrow" d="M535 214 V300"/><path class="arrow" d="M420 345 H294"/><path class="arrow" d="M535 345 H544"/><path class="arrow" d="M650 345 H604"/><path class="arrow" d="M650 345 H854"/>
  <rect class="red" x="356" y="504" width="408" height="72" rx="8"/><text class="head" x="492" y="536">Guardrails</text><text class="text" x="420" y="560">来源隔离、权限、引用校验、预算停止</text>
</svg>

