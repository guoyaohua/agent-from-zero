<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent 事故解释链</title>
  <desc id="desc">展示一次 Agent 事故复盘应从上下文、动作提议、策略决策、工具执行、状态更新和评估审查逐层解释。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="600" />
  <text class="title" x="48" y="52">可解释性要能支撑事故复盘,不只是生成一段理由</text>
  <text class="sub" x="48" y="78">解释应来自 trace、证据、策略和状态事实,再补充模型自述。</text>

  <rect class="panel" x="48" y="112" width="1024" height="362" rx="8" />
  <rect class="blue" x="78" y="184" width="132" height="78" rx="8" />
  <text class="label" x="112" y="214">Context</text>
  <text class="small" x="102" y="238">证据/记忆/目标</text>
  <path class="arrow" d="M210 223 H252" />

  <rect class="green" x="252" y="184" width="132" height="78" rx="8" />
  <text class="label" x="292" y="214">Proposal</text>
  <text class="small" x="280" y="238">动作和参数来源</text>
  <path class="arrow" d="M384 223 H426" />

  <rect class="orange" x="426" y="184" width="132" height="78" rx="8" />
  <text class="label" x="466" y="214">Policy</text>
  <text class="small" x="452" y="238">权限/确认/风险</text>
  <path class="arrow" d="M558 223 H600" />

  <rect class="red" x="600" y="184" width="132" height="78" rx="8" />
  <text class="label" x="636" y="214">Execution</text>
  <text class="small" x="630" y="238">工具结果/artifact</text>
  <path class="arrow" d="M732 223 H774" />

  <rect class="gray" x="774" y="184" width="132" height="78" rx="8" />
  <text class="label" x="812" y="214">State</text>
  <text class="small" x="802" y="238">diff/plan/stop</text>
  <path class="arrow" d="M906 223 H948" />

  <rect class="gray" x="948" y="184" width="84" height="78" rx="8" />
  <text class="label" x="970" y="214">Review</text>
  <text class="small" x="966" y="238">eval/人审</text>

  <rect class="panel" x="116" y="336" width="868" height="64" rx="8" />
  <text class="label" x="148" y="368">解释标准</text>
  <text class="text" x="248" y="368">能指出该修证据、参数、策略门、工具协议、状态更新还是评估覆盖。</text>

  <rect class="gray" x="72" y="506" width="976" height="42" rx="8" />
  <text class="text" x="98" y="532">读图方式: 模型理由可以参考,但事故解释要先贴住可验证系统事实。</text>
</svg>
