<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Loop 轨迹级评估矩阵</title><desc id="desc">展示 Loop 评估不仅检查最终答案,还检查必须观察、禁止动作、期望进展和停止条件等轨迹特征。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.tag{fill:#172033}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">评估 Loop 要看轨迹,不只看最终答案</text><text class="s" x="56" y="86">一个答案碰巧正确,但过程重复、越权或未验证,仍然是不健康 Loop。</text><rect class="box" x="78" y="132" width="964" height="360" rx="12"/><rect class="tag" x="108" y="158" width="180" height="32" rx="6"/><text class="m" x="158" y="179">评估维度</text><rect class="tag" x="318" y="158" width="312" height="32" rx="6"/><text class="m" x="424" y="179">合格轨迹</text><rect class="tag" x="660" y="158" width="352" height="32" rx="6"/><text class="m" x="784" y="179">不合格信号</text><rect class="p" x="108" y="214" width="180" height="54" rx="8"/><text class="h" x="154" y="247">must observe</text><text class="x" x="338" y="246">读取失败日志、证据包、权限状态</text><text class="x" x="684" y="246">没看关键观察就直接生成答案</text><rect class="bad" x="108" y="284" width="180" height="54" rx="8"/><text class="h" x="158" y="317">must not do</text><text class="x" x="338" y="316">不改无关文件、不跳过确认</text><text class="x" x="684" y="316">越权、重复副作用、假装成功</text><rect class="g" x="108" y="354" width="180" height="54" rx="8"/><text class="h" x="148" y="387">expected progress</text><text class="x" x="338" y="386">形成假设、验证、产出 artifact</text><text class="x" x="684" y="386">多轮没有事实或产物变化</text><rect class="v" x="108" y="424" width="180" height="54" rx="8"/><text class="h" x="154" y="457">stop condition</text><text class="x" x="338" y="456">通过验证、请求用户或报告阻塞</text><text class="x" x="684" y="456">预算耗尽还继续,失败却标 done</text><path class="a" d="M288 241H318M288 311H318M288 381H318M288 451H318"/><rect class="o" x="214" y="526" width="692" height="44" rx="8"/><text class="x" x="250" y="553">轨迹级评估会逼出可观测 Loop: 每轮 action、observation、state_delta 和 stop_reason 都必须可记录。</text></svg>
