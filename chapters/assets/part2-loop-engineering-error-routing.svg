<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Loop 错误路由</title><desc id="desc">展示 Agent Loop 根据错误类型选择修参数、换证据、换策略、请求用户、降级交付或停止失败,避免盲目重试。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.err{fill:#ffe8e2;stroke:#c5533f;stroke-width:2}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.6}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.6}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.6}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="610"/><text class="t" x="56" y="58">失败后不要先重试: 先把错误路由到正确恢复路径</text><text class="s" x="56" y="86">原样重试只适合暂时性错误;权限、证据、目标和策略问题必须改变路径。</text><rect class="err" x="432" y="130" width="256" height="76" rx="10"/><text class="h" x="504" y="160">Observation</text><text class="x" x="476" y="184">ok=false + error_type</text><rect class="p" x="86" y="282" width="150" height="74" rx="9"/><text class="h" x="120" y="310">修参数</text><text class="x" x="110" y="334">schema/枚举错</text><rect class="g" x="256" y="282" width="150" height="74" rx="9"/><text class="h" x="290" y="310">换证据</text><text class="x" x="280" y="334">无结果/冲突</text><rect class="o" x="426" y="282" width="150" height="74" rx="9"/><text class="h" x="460" y="310">换策略</text><text class="x" x="452" y="334">连续无进展</text><rect class="v" x="596" y="282" width="150" height="74" rx="9"/><text class="h" x="630" y="310">问用户</text><text class="x" x="618" y="334">权限/确认缺失</text><rect class="g" x="766" y="282" width="150" height="74" rx="9"/><text class="h" x="800" y="310">降级交付</text><text class="x" x="790" y="334">预算不足</text><rect class="err" x="936" y="282" width="150" height="74" rx="9"/><text class="h" x="970" y="310">停止失败</text><text class="x" x="960" y="334">策略拒绝</text><path class="a" d="M560 206C510 242 220 254 160 282M560 206C522 244 378 252 330 282M560 206C548 244 516 252 500 282M560 206C604 244 656 252 670 282M560 206C646 242 792 252 840 282M560 206C704 240 960 252 1010 282"/><rect class="node" x="142" y="430" width="836" height="62" rx="10"/><text class="h" x="186" y="458">Loop 更新</text><text class="x" x="284" y="458">把恢复路径写入 state: retry_count、new_query、plan_version、needs_user、degraded_scope 或 blocked_reason。</text><text class="x" x="284" y="480">下一轮 Context 必须包含这个路由结果,防止模型忘记失败原因。</text></svg>
