<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent 互操作与 A2A</title>
  <desc id="desc">展示 MCP 连接工具和资源,A2A 连接远程 Agent,二者分别处在不同互操作边界。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.head{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.host{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.mcp{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.a2a{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.risk{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#b05c37;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="56" y="58">Agent 互操作: MCP 接能力,A2A 接协作对象</text>
  <text class="sub" x="56" y="86">协议能降低集成成本,但不能替代本地权限、策略、审计和责任边界。</text>

  <rect class="panel" x="58" y="126" width="1004" height="408" rx="10"/>
  <rect class="host" x="98" y="238" width="210" height="96" rx="8"/>
  <text class="head" x="146" y="274">Host / Agent</text>
  <text class="text" x="132" y="300">目标、状态、策略、trace</text>

  <rect class="mcp" x="424" y="156" width="180" height="78" rx="8"/>
  <text class="head" x="484" y="188">MCP</text>
  <text class="text" x="458" y="212">tools / resources</text>

  <rect class="mcp" x="700" y="140" width="170" height="62" rx="8"/>
  <text class="head" x="750" y="166">Tool</text>
  <text class="text" x="734" y="187">schema + policy</text>
  <rect class="mcp" x="700" y="226" width="170" height="62" rx="8"/>
  <text class="head" x="740" y="252">Resource</text>
  <text class="text" x="732" y="273">URI + metadata</text>

  <rect class="a2a" x="424" y="372" width="180" height="78" rx="8"/>
  <text class="head" x="486" y="404">A2A</text>
  <text class="text" x="458" y="428">agent card + task</text>

  <rect class="a2a" x="700" y="350" width="170" height="68" rx="8"/>
  <text class="head" x="742" y="378">Remote Agent</text>
  <text class="text" x="734" y="400">opaque runtime</text>
  <rect class="a2a" x="700" y="442" width="170" height="68" rx="8"/>
  <text class="head" x="748" y="470">Task State</text>
  <text class="text" x="728" y="492">stream / push / artifact</text>

  <rect class="risk" x="914" y="270" width="116" height="100" rx="8"/>
  <text class="head" x="948" y="304">Local</text>
  <text class="text" x="938" y="330">auth</text>
  <text class="text" x="938" y="352">audit</text>

  <path class="line" d="M308 270C360 220 380 198 424 195"/>
  <path class="line" d="M604 195H700"/>
  <path class="line" d="M604 210C644 230 660 254 700 257"/>
  <path class="dash" d="M308 306C360 364 382 408 424 411"/>
  <path class="dash" d="M604 411H700"/>
  <path class="dash" d="M604 424C646 454 660 474 700 476"/>
  <path class="line" d="M870 320H914"/>

  <rect class="panel" x="96" y="560" width="928" height="48" rx="8"/>
  <text class="head" x="122" y="590">判断</text>
  <text class="text" x="188" y="590">MCP 适合把数据和工具暴露给模型应用; A2A 适合让不同 Agent 协作,但远程 Agent 的内部状态不应被默认信任。</text>
</svg>
