<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent 成本延迟预算账本</title>
  <desc id="desc">展示任务总预算如何拆到 planning、retrieval、synthesis、verification 和 memory 阶段,并为每阶段定义超限策略。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.warn{fill:#fff0e6}.pass{fill:#e7f1ee}.bad{fill:#f7d9df}.bar{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.5}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">预算不是只设总上限,还要知道哪一阶段花偏了</text>
  <text class="sub" x="56" y="82">阶段预算能触发降级、停止、异步化或请求用户缩小范围。</text>
  <text class="head" x="106" y="136">阶段</text><text class="head" x="276" y="136">预算重点</text><text class="head" x="522" y="136">当前消耗</text><text class="head" x="760" y="136">超限策略</text>
  <g transform="translate(80 158)">
    <rect class="cell" x="0" y="0" width="150" height="46"/><text class="text" x="32" y="29">planning</text><rect class="cell" x="180" y="0" width="230" height="46"/><text class="text" x="212" y="29">model calls &lt;= 2</text><rect class="cell pass" x="440" y="0" width="190" height="46"/><rect class="bar" x="464" y="16" width="70" height="14"/><text class="text" x="548" y="29">1 / 2</text><rect class="cell" x="660" y="0" width="280" height="46"/><text class="text" x="692" y="29">缺信息则澄清</text>
    <rect class="cell" x="0" y="60" width="150" height="46"/><text class="text" x="32" y="89">retrieval</text><rect class="cell" x="180" y="60" width="230" height="46"/><text class="text" x="212" y="89">top-k / rerank 成本</text><rect class="cell warn" x="440" y="60" width="190" height="46"/><rect class="bar" x="464" y="76" width="132" height="14"/><text class="text" x="608" y="89">高</text><rect class="cell" x="660" y="60" width="280" height="46"/><text class="text" x="692" y="89">降 top-k / 换数据源</text>
    <rect class="cell" x="0" y="120" width="150" height="46"/><text class="text" x="32" y="149">synthesis</text><rect class="cell" x="180" y="120" width="230" height="46"/><text class="text" x="212" y="149">output tokens</text><rect class="cell pass" x="440" y="120" width="190" height="46"/><rect class="bar" x="464" y="136" width="90" height="14"/><text class="text" x="568" y="149">可控</text><rect class="cell" x="660" y="120" width="280" height="46"/><text class="text" x="692" y="149">先短答,按需展开</text>
    <rect class="cell" x="0" y="180" width="150" height="46"/><text class="text" x="32" y="209">verification</text><rect class="cell" x="180" y="180" width="230" height="46"/><text class="text" x="212" y="209">Judge / tests</text><rect class="cell bad" x="440" y="180" width="190" height="46"/><rect class="bar" x="464" y="196" width="156" height="14"/><text class="text" x="580" y="209">超限</text><rect class="cell" x="660" y="180" width="280" height="46"/><text class="text" x="692" y="209">只校验关键 claim</text>
    <rect class="cell" x="0" y="240" width="150" height="46"/><text class="text" x="32" y="269">memory</text><rect class="cell" x="180" y="240" width="230" height="46"/><text class="text" x="212" y="269">写入和索引</text><rect class="cell pass" x="440" y="240" width="190" height="46"/><rect class="bar" x="464" y="256" width="40" height="14"/><text class="text" x="520" y="269">低</text><rect class="cell" x="660" y="240" width="280" height="46"/><text class="text" x="692" y="269">异步处理</text>
  </g>
  <rect x="162" y="466" width="796" height="34" rx="8" fill="#172033"/><text x="254" y="488" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">优化要看 success per dollar,不是只看 token 更少。</text>
</svg>
