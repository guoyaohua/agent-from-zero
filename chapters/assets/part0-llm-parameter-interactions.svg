<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">LLM 参数联动关系</title><desc id="desc">展示 messages、max_tokens、temperature、tools、response_format、stream 和 model 等参数如何互相影响稳定性、成本和延迟。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15px system-ui;fill:#172033}.x{font:400 12.2px system-ui;fill:#435066}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">参数不是独立旋钮,它们共同决定一次调用的行为</text><text class="s" x="56" y="86">调试时一次只改一个变量,并记录稳定性、成本、延迟和解析结果。</text><rect class="node" x="420" y="250" width="280" height="110" rx="14"/><text class="h" x="514" y="286">LLM Call</text><text class="x" x="462" y="318">输出质量、工具选择、成本、延迟</text><rect class="p" x="90" y="150" width="210" height="70" rx="9"/><text class="h" x="158" y="178">messages</text><text class="x" x="122" y="202">输入长度和上下文噪声</text><rect class="p" x="90" y="394" width="210" height="70" rx="9"/><text class="h" x="150" y="422">max_tokens</text><text class="x" x="122" y="446">输出预算和截断风险</text><rect class="o" x="454" y="112" width="210" height="70" rx="9"/><text class="h" x="510" y="140">temperature</text><text class="x" x="486" y="164">多样性和格式稳定性</text><rect class="v" x="820" y="150" width="210" height="70" rx="9"/><text class="h" x="902" y="178">tools</text><text class="x" x="850" y="202">动作空间和选择歧义</text><rect class="v" x="820" y="394" width="210" height="70" rx="9"/><text class="h" x="858" y="422">response_format</text><text class="x" x="850" y="446">解析可靠性和重试</text><rect class="g" x="454" y="490" width="210" height="70" rx="9"/><text class="h" x="528" y="518">model</text><text class="x" x="486" y="542">能力、价格、速度、窗口</text><path class="a" d="M300 185C356 206 392 242 420 276M300 429C356 408 392 372 420 334M559 182V250M820 185C764 206 728 242 700 276M820 429C764 408 728 372 700 334M559 490V360"/><rect class="bad" x="222" y="590" width="676" height="32" rx="8"/><text class="x" x="250" y="611">典型坑: 长上下文加小输出预算会截断;高随机性加严格 JSON 会漂移;多工具加模糊描述会乱选。</text></svg>
