<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">研究助手生产化就绪看板</title>
  <desc id="desc">展示个人研究助手从 v1 到生产版前需要补齐身份权限、资料治理、RAG 质量、记忆治理、安全、可观测、评估和部署能力。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.todo{fill:#fff0e6}.done{fill:#e7f1ee}.risk{fill:#f7d9df}.bar{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.5}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">生产化不是部署 demo,而是补齐可靠性看板</text>
  <text class="sub" x="56" y="82">每个扩展能力都要同时看权限、数据、评估、安全、成本和回滚。</text>
  <g transform="translate(82 124)">
    <rect class="cell done" x="0" y="0" width="220" height="58"/><text class="head" x="20" y="24">Trace</text><text class="text" x="20" y="44">任务 span + state diff</text>
    <rect class="cell done" x="244" y="0" width="220" height="58"/><text class="head" x="264" y="24">Eval</text><text class="text" x="264" y="44">smoke / golden / safety</text>
    <rect class="cell todo" x="488" y="0" width="220" height="58"/><text class="head" x="508" y="24">Identity</text><text class="text" x="508" y="44">用户、组织、资料权限</text>
    <rect class="cell todo" x="732" y="0" width="220" height="58"/><text class="head" x="752" y="24">Ingestion</text><text class="text" x="752" y="44">增量同步和重建索引</text>
    <rect class="cell todo" x="0" y="82" width="220" height="58"/><text class="head" x="20" y="106">RAG Quality</text><text class="text" x="20" y="126">hybrid + rerank + monitor</text>
    <rect class="cell todo" x="244" y="82" width="220" height="58"/><text class="head" x="264" y="106">Memory</text><text class="text" x="264" y="126">编辑、删除、冲突、过期</text>
    <rect class="cell risk" x="488" y="82" width="220" height="58"/><text class="head" x="508" y="106">Safety</text><text class="text" x="508" y="126">注入红队和数据流策略</text>
    <rect class="cell todo" x="732" y="82" width="220" height="58"/><text class="head" x="752" y="106">Deployment</text><text class="text" x="752" y="126">限流、密钥、SLO、回滚</text>
    <rect class="bar" x="0" y="188" width="952" height="24" rx="6"/><text class="text" x="330" y="205">扩展门禁: 新工具 / 新资料源 / 新写入能力都必须先补 eval 与 trace</text>
  </g>
  <rect x="168" y="432" width="784" height="38" rx="8" fill="#172033"/><text x="254" y="456" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">只要有一格是红色,扩展就应该先降级、灰度或补控制面。</text>
</svg>
