<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">自我修正状态机</title>
  <desc id="desc">展示自我修正从尝试、验证、诊断、修正到成功、停止、人工介入和经验回流的状态机,强调进展检测和停止条件。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2d7d80; stroke-width: 2; marker-end: url(#greenArrow); }
      .stop { fill: none; stroke: #b13c52; stroke-width: 2; marker-end: url(#redArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d7d80" /></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b13c52" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">自我修正要像状态机,不能像无限自言自语</text>
  <text class="sub" x="48" y="78">每轮修正都必须有外部验证、错误分类、进展检测和明确停止条件。</text>

  <rect class="panel" x="48" y="112" width="1024" height="392" rx="8" />
  <rect class="blue" x="96" y="206" width="142" height="66" rx="8" />
  <text class="label" x="134" y="234">Attempt</text>
  <text class="small" x="126" y="256">生成答案/动作</text>
  <path class="arrow" d="M238 239 H304" />

  <rect class="green" x="304" y="206" width="142" height="66" rx="8" />
  <text class="label" x="344" y="234">Verify</text>
  <text class="small" x="330" y="256">测试/规则/证据</text>
  <path class="arrow" d="M446 239 H512" />

  <rect class="orange" x="512" y="206" width="142" height="66" rx="8" />
  <text class="label" x="548" y="234">Diagnose</text>
  <text class="small" x="540" y="256">错误类型和根因</text>
  <path class="arrow" d="M654 239 H720" />

  <rect class="blue" x="720" y="206" width="142" height="66" rx="8" />
  <text class="label" x="758" y="234">Revise</text>
  <text class="small" x="748" y="256">改输出/计划/工具</text>
  <path class="loop" d="M791 272 C790 354 167 354 167 272" />
  <text class="small" x="386" y="350">验证信号改善才算有进展</text>

  <rect class="green" x="902" y="150" width="116" height="58" rx="8" />
  <text class="label" x="938" y="184">Success</text>
  <path class="arrow" d="M446 206 C540 150 784 150 902 178" />

  <rect class="red" x="902" y="300" width="116" height="58" rx="8" />
  <text class="label" x="934" y="334">Stop</text>
  <path class="stop" d="M654 272 C730 322 828 326 902 326" />
  <text class="small" x="726" y="316">无进展/预算尽/风险高</text>

  <rect class="gray" x="96" y="404" width="284" height="64" rx="8" />
  <text class="label" x="124" y="432">修正对象</text>
  <text class="small" x="218" y="432">答案、query、参数、计划、代码、记忆</text>
  <rect class="gray" x="424" y="404" width="284" height="64" rx="8" />
  <text class="label" x="452" y="432">停止条件</text>
  <text class="small" x="544" y="432">同错重复、预算、权限、证据不足</text>
  <rect class="gray" x="752" y="404" width="240" height="64" rx="8" />
  <text class="label" x="780" y="432">经验回流</text>
  <text class="small" x="870" y="432">eval、schema、workflow</text>

  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式:有效反思不是让模型再想一遍,而是用可验证失败信号驱动有限次、可停止、可回流的修正。</text>
</svg>
