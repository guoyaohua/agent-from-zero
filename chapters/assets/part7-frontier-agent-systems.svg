<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" role="img" aria-labelledby="title desc">
  <title id="title">前沿 Agent 系统的共同运行时</title>
  <desc id="desc">对比深度研究、编码和实时多模态 Agent 的环境、Artifact 与验证信号,并展示它们共享的任务契约、工作树、运行时、验证器和停止门。</desc>
  <defs>
    <style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#64748b}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1220" height="720"/>
  <text class="title" x="54" y="56">前沿 Agent: 不同环境,同一套可靠性骨架</text>
  <text class="sub" x="54" y="84">能力来自环境反馈闭环;模型输出必须经过 Artifact、验证器与停止门,才能成为可交付结果。</text>

  <rect class="panel" x="50" y="116" width="1120" height="118" rx="10"/>
  <text class="h" x="76" y="146">任务控制面</text>
  <rect class="blue" x="76" y="166" width="230" height="44" rx="8"/><text class="h" x="146" y="193">任务契约</text>
  <rect class="purple" x="354" y="166" width="230" height="44" rx="8"/><text class="h" x="426" y="193">工作树</text>
  <rect class="orange" x="632" y="166" width="230" height="44" rx="8"/><text class="h" x="698" y="193">预算与权限</text>
  <rect class="red" x="910" y="166" width="230" height="44" rx="8"/><text class="h" x="978" y="193">停止条件</text>
  <path class="line" d="M306 188H354M584 188H632M862 188H910"/>

  <rect class="blue" x="50" y="270" width="344" height="250" rx="10"/>
  <text class="h" x="76" y="302">深度研究 Agent</text><text class="s" x="76" y="324">证据弱结构 · 来源需分级</text>
  <rect class="panel" x="76" y="350" width="292" height="48" rx="7"/><text class="t" x="96" y="379">环境: Web / 论文 / 企业知识库</text>
  <rect class="panel" x="76" y="416" width="292" height="48" rx="7"/><text class="t" x="96" y="445">Artifact: 主张—证据账本</text>
  <text class="t" x="76" y="492">验证: 引用回源 · 独立来源 · 反证</text>

  <rect class="green" x="438" y="270" width="344" height="250" rx="10"/>
  <text class="h" x="464" y="302">编码 Agent</text><text class="s" x="464" y="324">环境可重置 · 验证器较强</text>
  <rect class="panel" x="464" y="350" width="292" height="48" rx="7"/><text class="t" x="484" y="379">环境: 仓库 / 终端 / 测试沙箱</text>
  <rect class="panel" x="464" y="416" width="292" height="48" rx="7"/><text class="t" x="484" y="445">Artifact: 最小 diff / 测试报告</text>
  <text class="t" x="464" y="492">验证: 复现 · 编译 · 测试 · 审查</text>

  <rect class="orange" x="826" y="270" width="344" height="250" rx="10"/>
  <text class="h" x="852" y="302">实时多模态 Agent</text><text class="s" x="852" y="324">事件连续 · 快慢双环</text>
  <rect class="panel" x="852" y="350" width="292" height="48" rx="7"/><text class="t" x="872" y="379">环境: 语音 / 画面 / 屏幕 / 设备</text>
  <rect class="panel" x="852" y="416" width="292" height="48" rx="7"/><text class="t" x="872" y="445">Artifact: 事件流 / 动作回执</text>
  <text class="t" x="852" y="492">验证: 指代 · 确认 · 状态变化</text>

  <path class="dash" d="M222 234V270M610 234V270M998 234V270"/>
  <rect class="panel" x="50" y="558" width="1120" height="112" rx="10"/>
  <rect class="purple" x="76" y="590" width="224" height="50" rx="8"/><text class="h" x="128" y="620">结构化 Observation</text>
  <rect class="blue" x="348" y="590" width="224" height="50" rx="8"/><text class="h" x="410" y="620">Artifact Store</text>
  <rect class="green" x="620" y="590" width="224" height="50" rx="8"/><text class="h" x="684" y="620">独立验证器</text>
  <rect class="red" x="892" y="590" width="224" height="50" rx="8"/><text class="h" x="954" y="620">交付 / 停止门</text>
  <path class="line" d="M300 615H348M572 615H620M844 615H892"/>
  <path class="dash" d="M222 520V558M610 520V558M998 520V558"/>
  <text class="s" x="76" y="690">成熟度证据: 精选演示 → 静态基准 → 内部可重放任务 → 有边界的生产试点</text>
</svg>
