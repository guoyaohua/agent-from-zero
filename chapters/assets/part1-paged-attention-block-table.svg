<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="title desc">
  <title id="title">PagedAttention block table</title>
  <desc id="desc">展示请求的逻辑 KV block 通过 block table 映射到非连续物理显存 block。</desc>
  <rect width="860" height="370" fill="#f8fafc"/>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">逻辑连续,物理可以分页存放</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#1e293b">
    <text x="60" y="84" font-weight="700">Request logical blocks</text>
    <rect x="60" y="104" width="80" height="46" fill="#dbeafe" stroke="#2563eb"/><text x="84" y="132">L0</text>
    <rect x="140" y="104" width="80" height="46" fill="#dbeafe" stroke="#2563eb"/><text x="164" y="132">L1</text>
    <rect x="220" y="104" width="80" height="46" fill="#dbeafe" stroke="#2563eb"/><text x="244" y="132">L2</text>
    <text x="370" y="84" font-weight="700">Block table</text>
    <rect x="360" y="104" width="150" height="132" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="388" y="132">L0 -> P7</text><text x="388" y="166">L1 -> P2</text><text x="388" y="200">L2 -> P9</text>
    <text x="600" y="84" font-weight="700">Physical KV blocks</text>
    <rect x="570" y="104" width="58" height="42" fill="#fef3c7" stroke="#d97706"/><text x="586" y="130">P2</text>
    <rect x="636" y="104" width="58" height="42" fill="#e5e7eb" stroke="#94a3b8"/><text x="652" y="130">free</text>
    <rect x="702" y="104" width="58" height="42" fill="#fef3c7" stroke="#d97706"/><text x="718" y="130">P7</text>
    <rect x="570" y="166" width="58" height="42" fill="#e5e7eb" stroke="#94a3b8"/><text x="586" y="192">free</text>
    <rect x="636" y="166" width="58" height="42" fill="#fef3c7" stroke="#d97706"/><text x="652" y="192">P9</text>
    <rect x="702" y="166" width="58" height="42" fill="#e5e7eb" stroke="#94a3b8"/><text x="718" y="192">free</text>
    <path d="M300 127 H360 M510 132 C535 132 542 125 570 125 M510 166 H570 M510 200 C550 212 600 206 636 187" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="92" y="314" fill="#64748b">请求看到的是连续历史; 推理框架通过 block table 找到分散的 KV block</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
</svg>
