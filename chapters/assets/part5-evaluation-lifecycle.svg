<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent 评估生命周期</title>
  <desc id="desc">展示 Agent 评估从样本银行、基线候选运行、评分器组合、按标签报告、上线门禁到线上失败回流的完整生命周期。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .dark { fill: #172033; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .white { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .muted { fill: #e5e7eb; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #b13c52; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#redArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b13c52" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">评估不是跑一次分数,而是持续维护的质量系统</text>
  <text class="sub" x="48" y="78">每次 Prompt、模型、工具、检索或策略变化,都应该和 baseline 做可重复比较。</text>

  <rect class="panel" x="48" y="112" width="1024" height="392" rx="8" />
  <rect class="blue" x="78" y="170" width="150" height="160" rx="8" />
  <text class="label" x="116" y="202">样本银行</text>
  <text class="small" x="108" y="232">Smoke</text>
  <text class="small" x="108" y="256">Golden</text>
  <text class="small" x="108" y="280">Regression</text>
  <text class="small" x="108" y="304">Safety / Cost</text>
  <path class="arrow" d="M228 250 H292" />

  <rect class="green" x="292" y="154" width="176" height="192" rx="8" />
  <text class="label" x="338" y="186">固定运行器</text>
  <rect class="gray" x="318" y="216" width="124" height="38" rx="6" /><text class="small" x="342" y="240">baseline</text>
  <rect class="gray" x="318" y="266" width="124" height="38" rx="6" /><text class="small" x="342" y="290">candidate</text>
  <text class="small" x="322" y="326">同样输入、工具和版本锁</text>
  <path class="arrow" d="M468 250 H532" />

  <rect class="orange" x="532" y="154" width="198" height="192" rx="8" />
  <text class="label" x="590" y="186">评分器组合</text>
  <text class="small" x="566" y="220">规则: schema / 引用 / 成本</text>
  <text class="small" x="566" y="250">程序: test / SQL / policy</text>
  <text class="small" x="566" y="280">Judge: 语义 / 完整性</text>
  <text class="small" x="566" y="310">人工: 校准 / 高风险</text>
  <path class="arrow" d="M730 250 H794" />

  <rect class="dark" x="794" y="154" width="206" height="192" rx="8" />
  <text class="white" x="858" y="186">回归门禁</text>
  <text class="small muted" x="824" y="220">按 tag 比较质量</text>
  <text class="small muted" x="824" y="248">安全样本零退化</text>
  <text class="small muted" x="824" y="276">成本/延迟预算</text>
  <text class="small muted" x="824" y="304">关键路径必须通过</text>

  <rect class="gray" x="78" y="386" width="922" height="58" rx="8" />
  <text class="label" x="108" y="418">报告必须能行动</text>
  <text class="text" x="230" y="418">不仅输出平均分,还要输出失败层、失败原因、trace、影响 tag、是否阻塞上线。</text>
  <path class="loop" d="M900 346 C930 468 256 492 160 330" />
  <text class="small" x="382" y="480">线上失败 trace 回流到样本银行,评估集随产品和攻击方式一起演进</text>
  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式:评估系统的核心资产不是一次分数,而是能稳定复现失败、比较版本、阻止回归的样本和门禁。</text>
</svg>
