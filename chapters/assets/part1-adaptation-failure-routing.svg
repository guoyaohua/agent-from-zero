<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="title desc">
  <title id="title">失败归因到技术路线</title>
  <desc id="desc">展示模型失败按表达层、信息层、行为层、执行层、能力层和安全层归因后选择 Prompt、RAG、微调、工具或换模型。</desc>
  <rect width="860" height="370" fill="#f8fafc"/>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">先归因,再决定 Prompt / RAG / 微调</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#1e293b">
    <rect x="40" y="76" width="150" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="72" y="103" font-weight="700">表达层</text><text x="62" y="124">Prompt / schema</text>
    <rect x="230" y="76" width="150" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="262" y="103" font-weight="700">信息层</text><text x="270" y="124">RAG / tools</text>
    <rect x="420" y="76" width="150" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="452" y="103" font-weight="700">行为层</text><text x="456" y="124">SFT / LoRA</text>
    <rect x="610" y="76" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="642" y="103" font-weight="700">执行层</text><text x="642" y="124">Harness / workflow</text>
    <rect x="138" y="210" width="190" height="62" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="196" y="237" font-weight="700">能力层</text><text x="174" y="258">换模型 / 路由</text>
    <rect x="532" y="210" width="190" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="590" y="237" font-weight="700">安全层</text><text x="566" y="258">权限 / 护栏 / 策略</text>
    <text x="94" y="326" fill="#64748b">例: 工具参数错可能是 schema 模糊、缺参数来源、模型没学会格式,也可能是 Harness 没拦住越权参数</text>
  </g>
</svg>
