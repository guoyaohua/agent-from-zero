<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Loop 进展不变量动画</title><desc id="desc">动画对比健康 Loop 和坏 Loop:健康循环会改变状态并收敛,坏循环重复同一动作。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.good{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.bad{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.line{fill:none;stroke:#7a8aa0;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#c54a4a;stroke-width:3;stroke-linecap:round}.dot{fill:#2d7d80}.dot2{fill:#c54a4a}</style></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">健康 Loop 和坏 Loop 的差别在于是否产生进展</text><text class="s" x="56" y="86">绿色动画改变查询和状态;红色动画回到同一个动作,说明应该重规划或停止。</text><rect class="good" x="70" y="140" width="470" height="350" rx="12"/><text class="h" x="250" y="178">健康 Loop</text><rect class="node" x="120" y="230" width="150" height="50" rx="8"/><text class="x" x="150" y="262">查询 A</text><rect class="node" x="340" y="230" width="150" height="50" rx="8"/><text class="x" x="370" y="262">无结果</text><rect class="node" x="120" y="350" width="150" height="50" rx="8"/><text class="x" x="146" y="382">改写查询 B</text><rect class="node" x="340" y="350" width="150" height="50" rx="8"/><text class="x" x="370" y="382">找到证据</text><path class="line" d="M270 255H340M415 280C390 325 320 338 270 360M270 375H340"/><circle class="dot" r="8"><animateMotion dur="4.8s" repeatCount="indefinite" path="M195 255H415C390 325 320 338 195 375H415"/></circle><rect class="bad" x="580" y="140" width="470" height="350" rx="12"/><text class="h" x="760" y="178">坏 Loop</text><rect class="node" x="650" y="250" width="150" height="50" rx="8"/><text class="x" x="680" y="282">查询 A</text><rect class="node" x="830" y="250" width="150" height="50" rx="8"/><text class="x" x="860" y="282">无结果</text><rect class="node" x="740" y="380" width="150" height="50" rx="8"/><text class="x" x="770" y="412">再查 A</text><path class="red" d="M800 275H830M905 300C890 350 860 370 815 380M740 405C680 380 670 330 725 300"/><circle class="dot2" r="8"><animateMotion dur="3.2s" repeatCount="indefinite" path="M725 275H905C890 350 860 370 815 405C680 380 670 330 725 275"/></circle><rect class="node" x="140" y="540" width="840" height="50" rx="8"/><text class="h" x="166" y="572">判断句</text><text class="x" x="254" y="572">两轮后 State Summary 没有新增事实、删去假设、改变计划或交付产物,Loop 就有问题。</text></svg>
