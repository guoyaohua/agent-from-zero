<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">角色责任矩阵和边界</title>
  <desc id="desc">展示多 Agent 角色用 RACI 矩阵分清负责者、最终责任者、咨询者和知情者,避免职责重叠。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.r{fill:#dfe8f5}.a{fill:#fff0e6}.c{fill:#e7f1ee}.i{fill:#ece7f3}.warn{fill:#f7d9df;stroke:#b13c52;stroke-width:1.7}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">角色重叠不是协作,而是责任稀释</text>
  <text class="sub" x="56" y="82">RACI 矩阵让每项工作只有清晰产出者和最终责任者。</text>
  <text class="head" x="196" y="132">Planner</text><text class="head" x="330" y="132">Researcher</text><text class="head" x="482" y="132">Executor</text><text class="head" x="628" y="132">Critic</text><text class="head" x="762" y="132">Coordinator</text>
  <text class="head" x="82" y="178">制定步骤</text><text class="head" x="82" y="226">检索政策</text><text class="head" x="82" y="274">查询订单</text><text class="head" x="82" y="322">判断资格</text><text class="head" x="82" y="370">提交退款</text>
  <g transform="translate(188 150)">
    <rect class="cell r" x="0" y="0" width="110" height="36"/><text class="head" x="48" y="24">R</text><rect class="cell c" x="140" y="0" width="110" height="36"/><text class="head" x="188" y="24">C</text><rect class="cell c" x="280" y="0" width="110" height="36"/><text class="head" x="328" y="24">C</text><rect class="cell c" x="420" y="0" width="110" height="36"/><text class="head" x="468" y="24">C</text><rect class="cell a" x="560" y="0" width="110" height="36"/><text class="head" x="608" y="24">A</text>
    <rect class="cell i" x="0" y="48" width="110" height="36"/><text class="head" x="50" y="72">I</text><rect class="cell r" x="140" y="48" width="110" height="36"/><text class="head" x="188" y="72">R</text><rect class="cell i" x="280" y="48" width="110" height="36"/><text class="head" x="330" y="72">I</text><rect class="cell c" x="420" y="48" width="110" height="36"/><text class="head" x="468" y="72">C</text><rect class="cell a" x="560" y="48" width="110" height="36"/><text class="head" x="608" y="72">A</text>
    <rect class="cell i" x="0" y="96" width="110" height="36"/><text class="head" x="50" y="120">I</text><rect class="cell i" x="140" y="96" width="110" height="36"/><text class="head" x="190" y="120">I</text><rect class="cell r" x="280" y="96" width="110" height="36"/><text class="head" x="328" y="120">R</text><rect class="cell c" x="420" y="96" width="110" height="36"/><text class="head" x="468" y="120">C</text><rect class="cell a" x="560" y="96" width="110" height="36"/><text class="head" x="608" y="120">A</text>
    <rect class="cell c" x="0" y="144" width="110" height="36"/><text class="head" x="48" y="168">C</text><rect class="cell c" x="140" y="144" width="110" height="36"/><text class="head" x="188" y="168">C</text><rect class="cell c" x="280" y="144" width="110" height="36"/><text class="head" x="328" y="168">C</text><rect class="cell r" x="420" y="144" width="110" height="36"/><text class="head" x="468" y="168">R</text><rect class="cell a" x="560" y="144" width="110" height="36"/><text class="head" x="608" y="168">A</text>
    <rect class="cell i" x="0" y="192" width="110" height="36"/><text class="head" x="50" y="216">I</text><rect class="cell i" x="140" y="192" width="110" height="36"/><text class="head" x="190" y="216">I</text><rect class="cell r" x="280" y="192" width="110" height="36"/><text class="head" x="328" y="216">R</text><rect class="cell c" x="420" y="192" width="110" height="36"/><text class="head" x="468" y="216">C</text><rect class="cell a" x="560" y="192" width="110" height="36"/><text class="head" x="608" y="216">A</text>
  </g>
  <rect class="warn" x="890" y="172" width="172" height="170" rx="8"/><text class="head" x="930" y="206">检查异常</text><text class="text" x="922" y="240">无人 R: 没人产出</text><text class="text" x="922" y="270">多个 A: 责任冲突</text><text class="text" x="922" y="300">全员 R: 边界混乱</text>
  <rect x="166" y="442" width="788" height="36" rx="8" fill="#172033"/><text x="248" y="465" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">R 负责产出,A 对结果负责,C 提供输入,I 只接收结果。</text>
</svg>
