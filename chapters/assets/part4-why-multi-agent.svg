<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">为什么需要多 Agent</title>
  <desc id="desc">展示单 Agent 在长任务中面临的上下文、工具、职责和评估压力,以及多 Agent 如何通过职责拆分降低复杂度。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">多 Agent: 不是堆模型,而是拆复杂度</text><text class="sub" x="56" y="86">当单 Agent 同时承担规划、检索、执行、评审和沟通时,上下文和责任会互相污染。</text>
  <rect class="panel" x="72" y="132" width="422" height="424" rx="8"/><text class="head" x="112" y="174">单 Agent 压力</text><rect class="red" x="150" y="218" width="260" height="86" rx="8"/><text class="head" x="235" y="252">One Agent</text><text class="small" x="176" y="278">规划 + 检索 + 写工具 + 评审 + 汇报</text><path class="arrow" d="M280 304 V354"/><rect class="panel" x="120" y="354" width="320" height="128" rx="8"/><text class="text" x="154" y="390">上下文膨胀</text><text class="text" x="154" y="416">工具选择噪声</text><text class="text" x="154" y="442">失败归因困难</text><text class="text" x="154" y="468">评估粒度过粗</text>
  <rect class="panel" x="626" y="132" width="422" height="424" rx="8"/><text class="head" x="666" y="174">多 Agent 拆分</text><rect class="blue" x="684" y="218" width="128" height="58" rx="8"/><text class="text" x="717" y="252">Planner</text><rect class="green" x="862" y="218" width="128" height="58" rx="8"/><text class="text" x="887" y="252">Researcher</text><rect class="orange" x="684" y="328" width="128" height="58" rx="8"/><text class="text" x="722" y="362">Executor</text><rect class="purple" x="862" y="328" width="128" height="58" rx="8"/><text class="text" x="899" y="362">Critic</text><rect class="panel" x="746" y="444" width="178" height="62" rx="8"/><text class="head" x="792" y="480">Orchestrator</text><path class="arrow" d="M748 276 V328"/><path class="arrow" d="M926 276 V328"/><path class="arrow" d="M748 386 L796 444"/><path class="arrow" d="M926 386 L874 444"/>
  <text class="small" x="92" y="610">判断原则: 只有当职责拆分能改善上下文、权限、评估或并行度时,多 Agent 才值得。</text>
</svg>

