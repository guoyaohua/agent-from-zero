<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="660" viewBox="0 0 1220 660" role="img" aria-labelledby="title desc"><title id="title">结构化输出与约束解码</title><desc id="desc">展示结构化输出从 schema、约束解码、解析校验、语义校验、策略门到执行和修复的完整链路。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.e{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#arrow)}.dark{fill:#172033}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1220" height="660"/><text class="title" x="54" y="58">结构化输出让模型结果进入系统契约</text><text class="sub" x="54" y="86">JSON mode、schema、function calling 和 grammar decoding 解决格式;权限、证据和副作用仍由 Harness 负责。</text><g transform="translate(58,130)"><rect class="a" x="0" y="0" width="180" height="96" rx="8"/><text class="h" x="44" y="30">Schema</text><text class="t" x="22" y="56">字段、enum、required</text><text class="s" x="22" y="76">表达系统契约</text><path class="line" d="M180 48H226"/><rect class="b" x="226" y="0" width="190" height="96" rx="8"/><text class="h" x="266" y="30">Constrained</text><text class="h" x="278" y="52">Decoding</text><text class="s" x="250" y="76">mask 非法 token</text><path class="line" d="M416 48H462"/><rect class="c" x="462" y="0" width="180" height="96" rx="8"/><text class="h" x="514" y="30">Parse</text><text class="t" x="488" y="56">JSON / grammar</text><text class="s" x="488" y="76">语法合法性</text><path class="line" d="M642 48H688"/><rect class="d" x="688" y="0" width="190" height="96" rx="8"/><text class="h" x="734" y="30">Validate</text><text class="t" x="712" y="56">schema + semantic</text><text class="s" x="712" y="76">字段和业务约束</text><path class="line" d="M878 48H924"/><rect class="e" x="924" y="0" width="180" height="96" rx="8"/><text class="h" x="970" y="30">Policy</text><text class="t" x="950" y="56">权限 / 风险 / 确认</text><text class="s" x="950" y="76">进入 Harness</text></g><g transform="translate(74,284)"><rect class="box" x="0" y="0" width="262" height="154" rx="8"/><text class="h" x="24" y="30">约束强度阶梯</text><text class="t" x="24" y="58">1. 请输出 JSON</text><text class="t" x="24" y="82">2. JSON mode</text><text class="t" x="24" y="106">3. Schema validation</text><text class="t" x="24" y="130">4. Grammar decoding</text><rect class="box" x="302" y="0" width="262" height="154" rx="8"/><text class="h" x="326" y="30">失败契约</text><text class="t" x="326" y="58">ready / blocked</text><text class="t" x="326" y="82">needs_more_evidence</text><text class="t" x="326" y="106">needs_clarification</text><text class="t" x="326" y="130">tool_error / refuse</text><rect class="box" x="604" y="0" width="262" height="154" rx="8"/><text class="h" x="628" y="30">修复路由</text><text class="t" x="628" y="58">语法错: 修格式</text><text class="t" x="628" y="82">schema 错: 补字段</text><text class="t" x="628" y="106">证据不足: 回检索</text><text class="t" x="628" y="130">越权: 拒绝/确认</text><rect class="box" x="906" y="0" width="238" height="154" rx="8"/><text class="h" x="930" y="30">评估指标</text><text class="t" x="930" y="58">JSON 合法率</text><text class="t" x="930" y="82">schema 通过率</text><text class="t" x="930" y="106">参数正确率</text><text class="t" x="930" y="130">policy 一致性</text></g><g transform="translate(120,492)"><rect class="a" x="0" y="0" width="210" height="76" rx="8"/><text class="h" x="24" y="30">格式正确</text><text class="t" x="24" y="54">括号、字段、枚举</text><rect class="c" x="262" y="0" width="210" height="76" rx="8"/><text class="h" x="286" y="30">语义正确</text><text class="t" x="286" y="54">参数是否符合任务</text><rect class="e" x="524" y="0" width="210" height="76" rx="8"/><text class="h" x="548" y="30">动作允许</text><text class="t" x="548" y="54">权限、风险、副作用</text><rect class="b" x="786" y="0" width="210" height="76" rx="8"/><text class="h" x="810" y="30">可追溯执行</text><text class="t" x="810" y="54">trace、回滚、审计</text></g><rect class="dark" x="214" y="598" width="792" height="38" rx="8"/><text x="260" y="622" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">结构化输出减少格式风险;真正的系统安全来自 validate + policy + Harness + trace。</text></svg>
