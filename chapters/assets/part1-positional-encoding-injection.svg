<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">位置编码的三种注入位置</title>
  <desc id="desc">展示位置编码可以加到输入 embedding,作为注意力分数偏置,或通过 RoPE 旋转 Query 和 Key,帮助模型理解顺序和距离。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .mono { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">位置编码是在给 Attention 加坐标系</text>
  <text class="sub" x="48" y="78">同一个 token 在不同位置必须有不同计算身份;不同方法只是把坐标注入到不同环节。</text>
  <rect class="panel" x="48" y="112" width="320" height="348" rx="8" />
  <text class="label" x="82" y="150">1. 输入相加</text>
  <rect class="blue" x="82" y="188" width="92" height="50" rx="8" /><text class="label" x="108" y="219">token</text>
  <rect class="green" x="82" y="272" width="92" height="50" rx="8" /><text class="label" x="104" y="303">position</text>
  <path class="arrow" d="M128 238 V272" />
  <circle cx="222" cy="255" r="24" fill="#ffffff" stroke="#355c9a" stroke-width="2" /><text class="label" x="215" y="261">+</text>
  <path class="arrow" d="M174 212 C206 216 220 230 222 232" />
  <path class="arrow" d="M174 298 C206 294 220 278 222 278" />
  <rect class="orange" x="258" y="230" width="74" height="50" rx="8" /><text class="label" x="276" y="261">x_i</text>
  <path class="arrow" d="M246 255 H258" />
  <text class="text" x="82" y="378">简单直接,但可学习绝对位置</text>
  <text class="text" x="82" y="402">在长度外推上通常更吃力。</text>
  <rect class="panel" x="400" y="112" width="320" height="348" rx="8" />
  <text class="label" x="434" y="150">2. 注意力分数偏置</text>
  <rect class="gray" x="456" y="188" width="168" height="168" rx="8" />
  <line class="grid" x1="498" y1="188" x2="498" y2="356" /><line class="grid" x1="540" y1="188" x2="540" y2="356" /><line class="grid" x1="582" y1="188" x2="582" y2="356" />
  <line class="grid" x1="456" y1="230" x2="624" y2="230" /><line class="grid" x1="456" y1="272" x2="624" y2="272" /><line class="grid" x1="456" y1="314" x2="624" y2="314" />
  <rect class="red" x="498" y="230" width="84" height="84" rx="6" opacity="0.72" />
  <text class="mono" x="452" y="388">score(i,j) += bias(i-j)</text>
  <text class="text" x="434" y="416">直接影响谁看谁,适合表达距离偏好。</text>
  <rect class="panel" x="752" y="112" width="320" height="348" rx="8" />
  <text class="label" x="786" y="150">3. RoPE 旋转 Q/K</text>
  <rect class="blue" x="792" y="204" width="82" height="50" rx="8" /><text class="label" x="825" y="235">Q</text>
  <rect class="green" x="792" y="286" width="82" height="50" rx="8" /><text class="label" x="825" y="317">K</text>
  <path class="arrow" d="M874 229 H930" /><path class="arrow" d="M874 311 H930" />
  <circle cx="958" cy="229" r="25" fill="#fff0e6" stroke="#b05c37" stroke-width="2" /><text class="label" x="948" y="235">R_i</text>
  <circle cx="958" cy="311" r="25" fill="#fff0e6" stroke="#b05c37" stroke-width="2" /><text class="label" x="948" y="317">R_j</text>
  <path class="arrow" d="M983 229 H1030" /><path class="arrow" d="M983 311 H1030" />
  <text class="mono" x="784" y="388">dot(R_i Q, R_j K)</text>
  <text class="text" x="786" y="416">点积天然带相对位移信息。</text>
  <rect class="gray" x="72" y="500" width="976" height="46" rx="8" />
  <text class="text" x="98" y="528">读图方式:位置机制不是装饰性编号;它决定模型如何区分顺序、距离、括号匹配、引用位置和长上下文中的远近关系。</text>
</svg>
