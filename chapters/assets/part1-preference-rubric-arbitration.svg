<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">偏好标注仲裁 Rubric</title>
  <desc id="desc">展示偏好对齐中事实性、安全性、有用性、格式和简洁度发生冲突时,需要用标注 Rubric 和仲裁规则决定 chosen 与 rejected。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.safe{fill:#e7f1ee}.warn{fill:#fff0e6}.risk{fill:#f7d9df}.info{fill:#dfe8f5}.bar{fill:#172033}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">偏好数据最怕“都挺好”,必须定义冲突时谁优先</text>
  <text class="sub" x="56" y="82">RLHF/DPO 学到的是标注偏好;Rubric 混乱会直接变成模型行为混乱。</text>
  <g transform="translate(78 126)">
    <rect class="cell info" x="0" y="0" width="170" height="70" rx="8"/><text class="head" x="32" y="28">Candidate A</text><text class="small" x="24" y="52">完整但有风险</text>
    <rect class="cell info" x="0" y="92" width="170" height="70" rx="8"/><text class="head" x="32" y="120">Candidate B</text><text class="small" x="24" y="144">安全但不完整</text>
    <path class="arrow" d="M170 82 H232"/>
    <rect class="cell warn" x="232" y="28" width="220" height="106" rx="8"/><text class="head" x="274" y="62">Rubric arbitration</text><text class="small" x="260" y="90">事实性 > 安全性 > 有用性?</text><text class="small" x="260" y="112">还是安全性优先?</text>
    <path class="arrow" d="M452 82 H514"/>
    <rect class="cell safe" x="514" y="28" width="190" height="106" rx="8"/><text class="head" x="560" y="62">Chosen</text><text class="small" x="542" y="90">有明确优先级</text><text class="small" x="542" y="112">附标注理由</text>
    <path class="arrow" d="M704 82 H766"/>
    <rect class="cell risk" x="766" y="28" width="250" height="106" rx="8"/><text class="head" x="806" y="62">Training signal</text><text class="small" x="794" y="90">chosen / rejected + reason</text><text class="small" x="794" y="112">进入 RLHF 或 DPO</text>
  </g>
  <g transform="translate(118 292)">
    <text class="head" x="0" y="0">常见冲突</text>
    <rect class="cell" x="0" y="24" width="190" height="58" rx="8"/><text class="text" x="22" y="48">事实 vs 流畅</text><text class="small" x="22" y="68">漂亮错答案要拒绝</text>
    <rect class="cell" x="216" y="24" width="190" height="58" rx="8"/><text class="text" x="238" y="48">安全 vs 完成率</text><text class="small" x="238" y="68">高风险先确认</text>
    <rect class="cell" x="432" y="24" width="190" height="58" rx="8"/><text class="text" x="454" y="48">简洁 vs 完整</text><text class="small" x="454" y="68">按任务验收标准</text>
    <rect class="cell" x="648" y="24" width="190" height="58" rx="8"/><text class="text" x="670" y="48">格式 vs 自然</text><text class="small" x="670" y="68">系统输出优先 schema</text>
  </g>
  <rect class="bar" x="166" y="444" width="788" height="36" rx="8"/>
  <text x="278" y="467" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">没有 Rubric 的偏好数据,会让模型学会标注者之间的不一致。</text>
</svg>
