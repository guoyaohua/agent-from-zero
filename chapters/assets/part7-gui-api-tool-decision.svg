<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">GUI、API 与语义工具选择</title>
  <desc id="desc">展示面对一个自动化任务时,应优先选择正式 API、语义工具、DOM 自动化、视觉 GUI Agent 或人类接管的判断路径。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="600" />
  <text class="title" x="48" y="52">GUI Agent 不是第一选择,它是缺少稳定接口时的补位能力</text>
  <text class="sub" x="48" y="78">先找更可测、更安全的接口;只有没有稳定接口时,才逐步降到 GUI 操作。</text>

  <rect class="panel" x="48" y="112" width="1024" height="362" rx="8" />
  <rect class="green" x="86" y="176" width="150" height="72" rx="8" />
  <text class="label" x="126" y="205">正式 API</text>
  <text class="small" x="116" y="228">稳定 schema/error</text>
  <path class="arrow" d="M236 212 H296" />

  <rect class="green" x="296" y="176" width="150" height="72" rx="8" />
  <text class="label" x="346" y="205">语义工具</text>
  <text class="small" x="322" y="228">封装业务动作</text>
  <path class="arrow" d="M446 212 H506" />

  <rect class="blue" x="506" y="176" width="150" height="72" rx="8" />
  <text class="label" x="542" y="205">DOM 自动化</text>
  <text class="small" x="538" y="228">selector + state</text>
  <path class="arrow" d="M656 212 H716" />

  <rect class="orange" x="716" y="176" width="150" height="72" rx="8" />
  <text class="label" x="754" y="205">视觉 GUI</text>
  <text class="small" x="748" y="228">截图/OCR/点击</text>
  <path class="arrow" d="M866 212 H926" />

  <rect class="red" x="926" y="176" width="108" height="72" rx="8" />
  <text class="label" x="952" y="205">人工</text>
  <text class="small" x="950" y="228">高风险接管</text>

  <rect class="gray" x="86" y="322" width="222" height="82" rx="8" />
  <text class="label" x="118" y="354">选择原则</text>
  <text class="small" x="118" y="380">越靠左越稳定、可评估、可审计</text>
  <rect class="gray" x="344" y="322" width="300" height="82" rx="8" />
  <text class="label" x="376" y="354">迁移方向</text>
  <text class="small" x="376" y="380">高频 GUI 流程应沉淀成语义工具</text>
  <rect class="gray" x="680" y="322" width="314" height="82" rx="8" />
  <text class="label" x="712" y="354">风险门禁</text>
  <text class="small" x="712" y="380">提交、删除、支付、发布必须 preview/confirm</text>

  <rect class="gray" x="72" y="506" width="976" height="42" rx="8" />
  <text class="text" x="98" y="532">读图方式: GUI 能覆盖长尾软件,但稳定流程要向左沉淀,高风险流程要向人工确认收敛。</text>
</svg>
