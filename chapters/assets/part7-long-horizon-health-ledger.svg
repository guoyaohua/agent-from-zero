<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">长时程 Agent 健康账本</title>
  <desc id="desc">展示长时程 Agent 需要持续监控目标一致性、状态新鲜度、证据质量、进展速度、预算消耗和风险状态。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.ok{fill:#e7f1ee}.warn{fill:#fff0e6}.risk{fill:#f7d9df}.info{fill:#dfe8f5}.bar{fill:#172033}
    </style>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">长任务要看健康账本,不是只等最终答案</text>
  <text class="sub" x="56" y="82">状态越持久,越要监控目标、证据、进展、预算和风险是否仍然健康。</text>
  <g transform="translate(76 128)">
    <text class="head" x="24" y="0">维度</text><text class="head" x="252" y="0">健康信号</text><text class="head" x="604" y="0">危险信号</text>
    <rect class="cell info" x="0" y="24" width="190" height="52"/><text class="text" x="24" y="56">目标一致性</text><rect class="cell ok" x="214" y="24" width="330" height="52"/><text class="small" x="238" y="56">每个 checkpoint 对照完成标准</text><rect class="cell risk" x="568" y="24" width="430" height="52"/><text class="small" x="592" y="56">计划越来越忙,但目标解释变了</text>
    <rect class="cell info" x="0" y="92" width="190" height="52"/><text class="text" x="24" y="124">状态新鲜度</text><rect class="cell ok" x="214" y="92" width="330" height="52"/><text class="small" x="238" y="124">事实有来源、时间和 scope</text><rect class="cell warn" x="568" y="92" width="430" height="52"/><text class="small" x="592" y="124">旧证据继续驱动新计划</text>
    <rect class="cell info" x="0" y="160" width="190" height="52"/><text class="text" x="24" y="192">进展速度</text><rect class="cell ok" x="214" y="160" width="330" height="52"/><text class="small" x="238" y="192">新证据、新产物、新决策持续增加</text><rect class="cell risk" x="568" y="160" width="430" height="52"/><text class="small" x="592" y="192">重复搜索、重复失败、无新增信息</text>
    <rect class="cell info" x="0" y="228" width="190" height="52"/><text class="text" x="24" y="260">预算消耗</text><rect class="cell ok" x="214" y="228" width="330" height="52"/><text class="small" x="238" y="260">阶段预算和剩余预算清楚</text><rect class="cell warn" x="568" y="228" width="430" height="52"/><text class="small" x="592" y="260">成本上升但任务分数不变</text>
    <rect class="cell info" x="0" y="296" width="190" height="52"/><text class="text" x="24" y="328">风险状态</text><rect class="cell ok" x="214" y="296" width="330" height="52"/><text class="small" x="238" y="328">权限、确认、回滚路径明确</text><rect class="cell risk" x="568" y="296" width="430" height="52"/><text class="small" x="592" y="328">权限逐渐扩大但无人复审</text>
  </g>
  <rect class="bar" x="166" y="462" width="788" height="32" rx="8"/>
  <text x="306" y="483" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">长时程自治的核心能力,是持续证明自己还在正确轨道上。</text>
</svg>
