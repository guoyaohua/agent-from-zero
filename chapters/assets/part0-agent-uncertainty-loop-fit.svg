<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">闭环不确定性与 Agent 适配度</title><desc id="desc">用任务路径是否固定和下一步是否依赖观察两个维度解释何时使用 Workflow、RAG、Agent 或人类主导。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.axis{stroke:#526071;stroke-width:2;marker-end:url(#a)}.q1{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.8}.q2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}.q3{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.q4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.8}.note{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#526071"/></marker></defs><rect class="bg" width="1120" height="600"/><text class="t" x="56" y="58">Agent 擅长路径不固定、且下一步依赖观察的任务</text><text class="s" x="56" y="86">复杂不等于需要 Agent;关键是闭环不确定性。</text><line class="axis" x1="160" y1="492" x2="950" y2="492"/><line class="axis" x1="160" y1="492" x2="160" y2="130"/><text class="x" x="470" y="532">下一步对中间观察的依赖: 低 -> 高</text><text class="x" x="56" y="326" transform="rotate(-90 56 326)">路径不确定性: 低 -> 高</text><rect class="q1" x="210" y="310" width="280" height="132" rx="10"/><text class="h" x="300" y="344">Workflow</text><text class="x" x="244" y="374">步骤多但路径固定</text><text class="x" x="244" y="400">例: 发票录入、审批流</text><rect class="q2" x="560" y="310" width="280" height="132" rx="10"/><text class="h" x="662" y="344">RAG/搜索问答</text><text class="x" x="594" y="374">需要外部资料但动作少</text><text class="x" x="594" y="400">例: 查政策、问文档</text><rect class="q3" x="560" y="150" width="280" height="132" rx="10"/><text class="h" x="678" y="184">Agent</text><text class="x" x="594" y="214">路径随观察变化</text><text class="x" x="594" y="240">例: 排障、调研、代码修复</text><rect class="q4" x="210" y="150" width="280" height="132" rx="10"/><text class="h" x="292" y="184">人类主导 + 辅助</text><text class="x" x="244" y="214">开放、高风险、难验证</text><text class="x" x="244" y="240">例: 战略决策、敏感处置</text><rect class="note" x="220" y="548" width="680" height="30" rx="6"/><text class="x" x="250" y="568">判断口诀: 能画完整确定流程先用 Workflow;只能画闭环,再考虑 Agent。</text></svg>
