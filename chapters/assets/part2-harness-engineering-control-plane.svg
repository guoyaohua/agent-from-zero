<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Harness 控制面和数据面</title><desc id="desc">展示 Agent Harness 中控制面负责策略、权限、预算和风险门,数据面负责上下文、动作、观察和 Trace。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.control{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.data{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.guard{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">Harness 不是薄包装,而是控制面 + 数据面</text><text class="s" x="56" y="86">数据面搬运信息,控制面决定什么可以发生。二者混在 Prompt 里会让系统又脆又难审计。</text><rect class="control" x="84" y="142" width="952" height="166" rx="12"/><text class="h" x="124" y="176">Control Plane: 规则和边界</text><rect class="node" x="132" y="208" width="154" height="58" rx="8"/><text class="x" x="172" y="232">Policy</text><text class="x" x="158" y="254">允许/拒绝</text><rect class="node" x="330" y="208" width="154" height="58" rx="8"/><text class="x" x="360" y="232">Permission</text><text class="x" x="364" y="254">身份/范围</text><rect class="node" x="528" y="208" width="154" height="58" rx="8"/><text class="x" x="568" y="232">Budget</text><text class="x" x="558" y="254">轮数/成本</text><rect class="node" x="726" y="208" width="154" height="58" rx="8"/><text class="x" x="760" y="232">Risk Gate</text><text class="x" x="760" y="254">确认/回滚</text><rect class="data" x="84" y="366" width="952" height="166" rx="12"/><text class="h" x="124" y="400">Data Plane: 信息和产物流</text><rect class="node" x="132" y="432" width="154" height="58" rx="8"/><text class="x" x="170" y="456">Context</text><text class="x" x="158" y="478">状态/证据</text><rect class="node" x="330" y="432" width="154" height="58" rx="8"/><text class="x" x="370" y="456">Action</text><text class="x" x="358" y="478">工具参数</text><rect class="node" x="528" y="432" width="154" height="58" rx="8"/><text class="x" x="558" y="456">Observation</text><text class="x" x="560" y="478">返回结果</text><rect class="node" x="726" y="432" width="154" height="58" rx="8"/><text class="x" x="774" y="456">Trace</text><text class="x" x="758" y="478">事件记录</text><path class="a" d="M209 266V432M407 266V432M605 266V432M803 266V432"/><rect class="guard" x="360" y="560" width="400" height="44" rx="8"/><text class="h" x="458" y="588">控制面不能只靠模型自觉</text></svg>
