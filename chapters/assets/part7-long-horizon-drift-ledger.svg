<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">长时程 Agent 漂移账本</title>
  <desc id="desc">展示长周期任务需要持续记录目标、状态、证据、预算、权限、进展和漂移信号。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.warn{fill:#fff0e6;stroke:#b05c37;stroke-width:1.5}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:1.5}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.5}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="54" y="52">长时程任务最怕的不是一次错,而是慢慢漂移</text>
  <text class="sub" x="54" y="80">每个检查点都要问:目标变了吗、状态腐败了吗、权限还合适吗、是否仍有进展。</text>
  <g transform="translate(84 124)">
    <rect class="cell" x="0" y="0" width="952" height="276" rx="8"/>
    <g class="h"><text x="26" y="38">账本项</text><text x="210" y="38">正常信号</text><text x="486" y="38">漂移信号</text><text x="742" y="38">动作</text></g>
    <rect class="ok" x="0" y="58" width="952" height="48"/><text class="h" x="26" y="88">目标</text><text class="t" x="210" y="88">done_when 清晰</text><text class="t" x="486" y="88">不断扩大任务范围</text><text class="t" x="742" y="88">重新确认或拆分</text>
    <rect class="warn" x="0" y="112" width="952" height="48"/><text class="h" x="26" y="142">状态</text><text class="t" x="210" y="142">checkpoint 可回放</text><text class="t" x="486" y="142">旧观察当新事实</text><text class="t" x="742" y="142">回滚到可信快照</text>
    <rect class="warn" x="0" y="166" width="952" height="48"/><text class="h" x="26" y="196">预算</text><text class="t" x="210" y="196">消耗换来新证据</text><text class="t" x="486" y="196">连续无进展调用</text><text class="t" x="742" y="196">停止、降级或求助</text>
    <rect class="bad" x="0" y="220" width="952" height="48"/><text class="h" x="26" y="250">权限</text><text class="t" x="210" y="250">只开当前阶段工具</text><text class="t" x="486" y="250">旧授权覆盖新风险</text><text class="t" x="742" y="250">重新过 Harness 门</text>
  </g>
  <rect x="206" y="434" width="708" height="42" rx="8" fill="#172033"/><text x="282" y="460" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff">长时程 Agent 的自主性越高,检查点和漂移账本越应该机器可读。</text>
</svg>
