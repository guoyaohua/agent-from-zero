<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="820" viewBox="0 0 1220 820" role="img" aria-labelledby="title desc">
  <title id="title">主流大模型全景</title>
  <desc id="desc">从模型家族、交付方式、能力角色、企业控制面和部署约束展示大模型选型地图。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.gray{fill:#eef3f8;stroke:#cbd5e1;stroke-width:1.2}.dark{fill:#172033;stroke:#172033;stroke-width:2}.white{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.line{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#7a8aa0;stroke-width:1.7;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1220" height="820"/>
  <text class="title" x="52" y="56">主流模型选型:先看家族定位,再看内部控制面</text>
  <text class="sub" x="52" y="84">DeepSeek、Qwen、Llama、GPT、Claude、Gemini 等不是简单排名关系,而是能力、部署、合规和生态的组合。</text>

  <rect class="panel" x="48" y="116" width="1124" height="268" rx="10"/>
  <text class="h" x="78" y="148">模型家族与典型角色</text>
  <rect class="orange" x="78" y="172" width="162" height="78" rx="8"/><text class="h" x="112" y="198">DeepSeek</text><text class="t" x="100" y="220">MoE / 推理 / 代码</text><text class="s" x="100" y="240">V3 / R1 / distill</text>
  <rect class="green" x="264" y="172" width="162" height="78" rx="8"/><text class="h" x="314" y="198">Qwen</text><text class="t" x="286" y="220">中文 / 多语言 / Agent</text><text class="s" x="286" y="240">dense + MoE</text>
  <rect class="blue" x="450" y="172" width="162" height="78" rx="8"/><text class="h" x="500" y="198">Llama</text><text class="t" x="472" y="220">开放生态 / 私有化</text><text class="s" x="472" y="240">社区工具链丰富</text>
  <rect class="purple" x="636" y="172" width="162" height="78" rx="8"/><text class="h" x="684" y="198">GPT</text><text class="t" x="658" y="220">综合 API / 工具</text><text class="s" x="658" y="240">产品化能力强</text>
  <rect class="red" x="822" y="172" width="162" height="78" rx="8"/><text class="h" x="866" y="198">Claude</text><text class="t" x="844" y="220">长文档 / 代码</text><text class="s" x="844" y="240">安全策略成熟</text>
  <rect class="blue" x="1008" y="172" width="132" height="78" rx="8"/><text class="h" x="1040" y="198">Gemini</text><text class="t" x="1030" y="220">多模态</text><text class="s" x="1030" y="240">云生态</text>
  <rect class="gray" x="78" y="286" width="1062" height="58" rx="8"/>
  <text class="h" x="104" y="314">选型纪律</text><text class="t" x="198" y="314">不要问“谁最强”,而要问“这个任务、数据边界、延迟预算和失败代价下,谁最稳”。</text><text class="s" x="198" y="336">模型名会变,但任务评估集、输出契约和路由策略会留下来。</text>

  <rect class="panel" x="48" y="410" width="536" height="270" rx="10"/>
  <text class="h" x="78" y="442">能力角色</text>
  <rect class="green" x="78" y="466" width="140" height="58" rx="8"/><text class="h" x="104" y="490">小模型</text><text class="s" x="100" y="510">分类 / 路由 / 安全</text>
  <rect class="orange" x="244" y="466" width="140" height="58" rx="8"/><text class="h" x="276" y="490">强模型</text><text class="s" x="266" y="510">复杂生成 / 工具</text>
  <rect class="red" x="410" y="466" width="140" height="58" rx="8"/><text class="h" x="438" y="490">推理型</text><text class="s" x="432" y="510">代码 / 数学 / 规划</text>
  <rect class="blue" x="78" y="550" width="140" height="58" rx="8"/><text class="h" x="104" y="574">多模态</text><text class="s" x="98" y="594">截图 / PDF / 图表</text>
  <rect class="purple" x="244" y="550" width="140" height="58" rx="8"/><text class="h" x="270" y="574">Embedding</text><text class="s" x="266" y="594">召回 / 记忆</text>
  <rect class="green" x="410" y="550" width="140" height="58" rx="8"/><text class="h" x="440" y="574">Rerank</text><text class="s" x="436" y="594">精排 / hard neg</text>
  <rect class="gray" x="78" y="626" width="472" height="34" rx="7"/><text class="t" x="100" y="648">成熟系统通常是多模型组合,不是一个模型包打天下。</text>

  <rect class="panel" x="636" y="410" width="536" height="270" rx="10"/>
  <text class="h" x="666" y="442">企业内部控制面</text>
  <rect class="dark" x="666" y="470" width="178" height="52" rx="8"/><text class="white" x="706" y="502">Model Gateway</text>
  <rect class="gray" x="876" y="470" width="242" height="52" rx="8"/><text class="h" x="900" y="492">认证 / 配额 / 路由</text><text class="s" x="900" y="512">版本、成本、降级、审计</text>
  <path class="line" d="M844 496 H876"/>
  <rect class="blue" x="666" y="548" width="126" height="52" rx="8"/><text class="h" x="700" y="570">RAG</text><text class="s" x="690" y="590">权限 / 引用</text>
  <rect class="orange" x="814" y="548" width="126" height="52" rx="8"/><text class="h" x="844" y="570">Tools</text><text class="s" x="838" y="590">Harness</text>
  <rect class="red" x="962" y="548" width="126" height="52" rx="8"/><text class="h" x="996" y="570">Safety</text><text class="s" x="990" y="590">DLP / policy</text>
  <rect class="purple" x="740" y="622" width="274" height="38" rx="8"/><text class="h" x="804" y="646">Eval + Trace 回流</text>
  <path class="dash" d="M877 622 C856 596 820 590 792 574"/><path class="dash" d="M877 622 C880 596 880 588 877 574"/><path class="dash" d="M877 622 C922 596 942 590 962 574"/>

  <rect class="panel" x="48" y="704" width="1124" height="64" rx="10"/>
  <text class="h" x="78" y="732">内部落地优先级</text>
  <text class="t" x="206" y="732">先建评估集和网关,再做 RAG/工具接入,最后根据隐私、调用量和成本决定 API、私有模型或混合架构。</text>
  <text class="s" x="206" y="754">DeepSeek/Qwen/Llama 适合承担不同角色;闭源强模型适合高价值复杂任务,开放权重适合敏感数据和可控部署。</text>
</svg>
