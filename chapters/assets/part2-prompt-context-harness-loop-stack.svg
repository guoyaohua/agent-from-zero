<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Prompt、Context、Harness、Loop 四层关系</title><desc id="desc">用紧凑分层图解释 Prompt、Context、Harness、Loop 在 Agent 系统中的职责边界。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.m{font:400 12px system-ui;fill:#667085}.p{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}.b1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.b3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.b4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.tag{font:700 13px system-ui;fill:#fff}.tb{fill:#172033}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">从一句 Prompt 到一个可控 Agent: 四层不是一回事</text><text class="s" x="56" y="86">Prompt 规定任务表达,Context 供应事实,Harness 约束运行,Loop 让任务随反馈推进。</text><rect class="p" x="70" y="122" width="980" height="400" rx="10"/><rect class="b1" x="126" y="160" width="868" height="70" rx="9"/><rect class="tb" x="150" y="180" width="96" height="30" rx="6"/><text class="tag" x="173" y="200">Prompt</text><text class="h" x="282" y="188">任务、角色、约束、输出契约</text><text class="x" x="282" y="212">告诉模型“这一轮怎样工作”,但不执行工具、不持久化状态、不保证安全。</text><rect class="b2" x="126" y="254" width="868" height="70" rx="9"/><rect class="tb" x="150" y="274" width="96" height="30" rx="6"/><text class="tag" x="170" y="294">Context</text><text class="h" x="282" y="282">当前决策所需的事实、证据、记忆和状态视图</text><text class="x" x="282" y="306">回答“模型这一轮能看见什么”,关键是选择、压缩、排序、来源和信任级别。</text><rect class="b3" x="126" y="348" width="868" height="70" rx="9"/><rect class="tb" x="150" y="368" width="96" height="30" rx="6"/><text class="tag" x="168" y="388">Harness</text><text class="h" x="282" y="376">运行时外骨架: 工具、权限、校验、执行、Trace</text><text class="x" x="282" y="400">把模型输出变成受控动作,也把环境反馈变成结构化 Observation。</text><rect class="b4" x="126" y="442" width="868" height="70" rx="9"/><rect class="tb" x="150" y="462" width="96" height="30" rx="6"/><text class="tag" x="184" y="482">Loop</text><text class="h" x="282" y="470">时间维度上的控制: 继续、停止、重试、回滚、交付</text><text class="x" x="282" y="494">根据新观察更新状态并推进任务,防止重复、漂移和无限循环。</text><path class="a" d="M560 230v24M560 324v24M560 418v24"/><rect class="p" x="90" y="548" width="940" height="54" rx="8"/><text class="m" x="118" y="581">工程判断: 工具误执行先查 Harness;任务反复绕圈先查 Loop;答非所问再查 Prompt 与 Context。</text></svg>
