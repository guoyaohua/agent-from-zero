<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Judge 分歧复盘板</title>
  <desc id="desc">展示 LLM Judge 与人工标注分歧后如何定位 Rubric、证据、输入裁剪和偏见问题。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.warn{fill:#fff0e6;stroke:#b05c37;stroke-width:1.5}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:1.5}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.5}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="54" y="52">Judge 真正的改进来自分歧样本</text>
  <text class="sub" x="54" y="80">分歧不是噪声,而是 Rubric、证据和偏见暴露出来的地方。</text>
  <g transform="translate(78 130)">
    <rect class="cell" x="0" y="0" width="180" height="82" rx="8"/><text class="h" x="42" y="30">Gold Set</text><text class="t" x="24" y="56">人工高质量标签</text><path class="arrow" d="M180 41 H222"/>
    <rect class="cell" x="242" y="0" width="180" height="82" rx="8"/><text class="h" x="278" y="30">Judge Run</text><text class="t" x="266" y="56">rubric + trace</text><path class="arrow" d="M422 41 H464"/>
    <rect class="warn" x="484" y="0" width="180" height="82" rx="8"/><text class="h" x="528" y="30">Disagree</text><text class="t" x="514" y="56">假阳性/假阴性</text><path class="arrow" d="M664 41 H706"/>
    <rect class="ok" x="726" y="0" width="180" height="82" rx="8"/><text class="h" x="768" y="30">Repair</text><text class="t" x="748" y="56">改 rubric 或输入</text>
  </g>
  <g transform="translate(116 274)">
    <rect class="bad" x="0" y="0" width="208" height="78" rx="8"/><text class="h" x="58" y="30">假阴性</text><text class="t" x="28" y="56">Judge 放过真实风险</text>
    <rect class="warn" x="246" y="0" width="208" height="78" rx="8"/><text class="h" x="304" y="30">假阳性</text><text class="t" x="276" y="56">Judge 误杀可接受答案</text>
    <rect class="cell" x="492" y="0" width="208" height="78" rx="8"/><text class="h" x="548" y="30">偏见</text><text class="t" x="522" y="56">长度/格式/位置/同源</text>
    <rect class="ok" x="738" y="0" width="208" height="78" rx="8"/><text class="h" x="794" y="30">修复</text><text class="t" x="770" y="56">锚点/反例/裁剪策略</text>
  </g>
  <rect x="192" y="430" width="736" height="42" rx="8" fill="#172033"/><text x="254" y="456" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff">Judge 校准不是追求 100% 一致,而是稳定抓住业务真正关心的错误。</text>
</svg>
