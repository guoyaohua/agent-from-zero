<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc"><title id="title">Prompt 模板使用流程</title><desc id="desc">展示 Prompt 模板从任务、上下文、输出契约、校验到评估的使用流程。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12px system-ui;fill:#435066}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1120" height="280"/><text class="title" x="56" y="58">Prompt 模板只是上下文工程的一层</text><text class="sub" x="56" y="86">模板要和状态、证据、工具 schema、输出契约和校验一起使用。</text>
  <g transform="translate(0,-99)"><rect class="n" x="118" y="240" width="150" height="64" rx="8"/><text class="head" x="160" y="266">Task</text><text class="text" x="148" y="288">目标和约束</text><rect class="n2" x="336" y="240" width="150" height="64" rx="8"/><text class="head" x="374" y="266">Context</text><text class="text" x="362" y="288">状态和证据</text><rect class="n3" x="554" y="240" width="150" height="64" rx="8"/><text class="head" x="590" y="266">Contract</text><text class="text" x="584" y="288">格式和标准</text><rect class="n4" x="772" y="240" width="150" height="64" rx="8"/><text class="head" x="810" y="266">Check</text><text class="text" x="802" y="288">校验和评估</text><path class="arrow" d="M268 272 H336"/><path class="arrow" d="M486 272 H554"/><path class="arrow" d="M704 272 H772"/>
  </g>
</svg>

