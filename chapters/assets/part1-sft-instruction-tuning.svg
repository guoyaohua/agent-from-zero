<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">监督微调 SFT</title>
  <desc id="desc">展示预训练模型通过指令-回答样本进行监督微调,学习助手格式、任务遵守和工具调用模式。</desc>
  <defs><style>
    .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.subtitle{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2;rx:8}.soft{fill:#eef3f8;stroke:#d8e0eb;stroke-width:1.1;rx:8}.box1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.box2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.box3{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.box4{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}.head{font:700 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.label{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#435066}.tag{font:700 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.arrow{fill:none;stroke:#9aa7ba;stroke-width:2.2;marker-end:url(#arrow)}
  </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7ba"/></marker></defs>
  <rect class="bg" width="1120" height="680"/>
  <text class="title" x="56" y="58">监督微调 SFT:把会续写的模型训练成会听指令的助手</text>
  <text class="subtitle" x="56" y="86">SFT 仍然是下一个 token 预测,但训练样本变成了“指令 -> 理想回答”的助手格式。</text>
  <rect class="panel" x="56" y="128" width="1008" height="430" rx="8"/>
  <rect x="82" y="156" width="94" height="26" rx="5" fill="#355c9a"/><text class="tag" x="96" y="174">SFT Flow</text>
  <text class="head" x="82" y="216">从基础模型到助手模型</text>
  <rect class="box1" x="104" y="286" width="160" height="78" rx="8"/><text class="label" x="136" y="316">预训练模型</text><text class="text" x="126" y="340">擅长续写文本</text>
  <path class="arrow" d="M264 325 H342"/>
  <rect class="box2" x="342" y="250" width="210" height="150" rx="8"/><text class="label" x="396" y="282">SFT 数据</text><text class="mono" x="370" y="314">用户: 总结这段</text><text class="mono" x="370" y="340">助手: 1. ...</text><text class="mono" x="370" y="366">工具: call(...)</text>
  <path class="arrow" d="M552 325 H630"/>
  <rect class="box3" x="630" y="286" width="160" height="78" rx="8"/><text class="label" x="668" y="316">监督训练</text><text class="text" x="656" y="340">学习目标输出</text>
  <path class="arrow" d="M790 325 H868"/>
  <rect class="box4" x="868" y="286" width="150" height="78" rx="8"/><text class="label" x="906" y="316">助手模型</text><text class="text" x="896" y="340">会按指令回答</text>
  <rect class="soft" x="124" y="458" width="824" height="46" rx="8"/><text class="text" x="146" y="486">关键不只是样本数量,而是任务覆盖、答案质量、格式一致性、边界案例和安全示范。</text>
  <rect class="soft" x="76" y="604" width="968" height="42" rx="8"/><text class="text" x="100" y="630">读图方式:SFT 不注入所有知识,它主要塑造模型如何响应人类任务。</text>
</svg>
