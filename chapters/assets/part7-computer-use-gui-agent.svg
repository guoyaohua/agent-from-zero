<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Computer Use 与 GUI Agent</title><desc id="desc">展示 GUI Agent 从屏幕观察、界面理解、动作计划、鼠标键盘执行到反馈校验的闭环。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12.5px system-ui;fill:#435066}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">GUI Agent: 在像素世界里做可靠动作</text><text class="sub" x="56" y="86">Computer Use 的难点不是会点击,而是理解界面状态、控制副作用并验证动作结果。</text><rect class="panel" x="152" y="154" width="816" height="360" rx="8"/><rect class="a" x="204" y="248" width="140" height="68" rx="8"/><text class="head" x="242" y="276">Observe</text><text class="text" x="232" y="298">截图/DOM/状态</text><rect class="b" x="392" y="248" width="140" height="68" rx="8"/><text class="head" x="430" y="276">Interpret</text><text class="text" x="420" y="298">控件和意图</text><rect class="c" x="580" y="248" width="140" height="68" rx="8"/><text class="head" x="626" y="276">Act</text><text class="text" x="606" y="298">点击/输入/快捷键</text><rect class="d" x="768" y="248" width="140" height="68" rx="8"/><text class="head" x="810" y="276">Verify</text><text class="text" x="796" y="298">结果和副作用</text><path class="arrow" d="M344 282 H392"/><path class="arrow" d="M532 282 H580"/><path class="arrow" d="M720 282 H768"/><path class="arrow" d="M838 316 C838 420 274 420 274 316"/><text class="text" x="244" y="438">可靠 GUI Agent 需要视觉/结构观察、动作前确认、动作后校验和可回滚策略。</text></svg>

