<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Loop Engineering 控制循环</title><desc id="desc">展示生产 Agent Loop 从构建上下文、模型决策、验证动作、执行工具、更新状态到评估停止的完整循环。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.n1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n3{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.a{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="660"/><text class="t" x="56" y="58">Loop Engineering: 设计任务如何随时间收敛</text><text class="s" x="56" y="86">Loop 的重点不是 while,而是每一轮如何带来新信息、降低不确定性并控制风险。</text><rect class="n1" x="456" y="126" width="208" height="70" rx="10"/><text class="h" x="506" y="156">Build Context</text><text class="x" x="500" y="180">当前工作视图</text><rect class="n2" x="760" y="216" width="208" height="70" rx="10"/><text class="h" x="818" y="246">Decide</text><text class="x" x="810" y="270">模型提出动作</text><rect class="n2" x="760" y="396" width="208" height="70" rx="10"/><text class="h" x="808" y="426">Validate</text><text class="x" x="800" y="450">schema/权限/预算</text><rect class="n3" x="456" y="490" width="208" height="70" rx="10"/><text class="h" x="516" y="520">Execute</text><text class="x" x="504" y="544">工具或交付动作</text><rect class="n1" x="152" y="396" width="208" height="70" rx="10"/><text class="h" x="218" y="426">Update</text><text class="x" x="204" y="450">写回状态和 trace</text><rect class="n4" x="152" y="216" width="208" height="70" rx="10"/><text class="h" x="218" y="246">Evaluate</text><text class="x" x="194" y="270">继续/停止/重规划</text><path class="a" d="M664 160C724 168 780 190 832 216M864 286V396M760 431C710 466 668 486 620 490M456 525C390 500 324 474 256 466M256 396V286M360 250C420 208 454 190 500 196"/><rect class="node" x="400" y="310" width="320" height="86" rx="10"/><text class="h" x="468" y="342">Progress Invariant</text><text class="x" x="430" y="370">每轮要么获得新证据,要么缩小问题,</text><text class="x" x="430" y="392">要么完成交付,否则改变策略或停止。</text></svg>
