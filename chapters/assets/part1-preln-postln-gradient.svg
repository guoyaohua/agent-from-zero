<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Pre-LN 与 Post-LN 的梯度路径差异</title>
  <desc id="desc">对比 Post-LN 把 LayerNorm 放在残差相加之后,Pre-LN 把 LayerNorm 放在子层之前,说明 Pre-LN 中残差主干更直接,深层训练更稳定。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .pre { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .post { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .ln { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .block { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .main { fill: none; stroke: #172033; stroke-width: 5; stroke-linecap: round; }
      .grad { fill: none; stroke: #2d7d80; stroke-width: 3; stroke-dasharray: 7 6; marker-end: url(#greenArrow); }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d7d80" /></marker>
  </defs>
  <rect class="bg" width="1120" height="560" />
  <text class="title" x="48" y="48">Pre-LN 更稳的直觉: 残差主干更少被归一化层阻断</text>
  <text class="sub" x="48" y="74">LayerNorm 放在子层前还是相加后,会改变深层网络中信息和梯度穿行的路径。</text>
  <rect class="panel" x="48" y="104" width="1024" height="340" rx="8" />

  <rect class="post" x="90" y="148" width="438" height="210" rx="8" />
  <text class="label" x="250" y="178">Post-LN</text>
  <path class="main" d="M132 266 H474" />
  <rect class="block" x="220" y="198" width="108" height="54" rx="7"/><text class="label" x="248" y="232">子层</text>
  <path class="arrow" d="M180 266 C198 220 214 224 220 224" />
  <path class="arrow" d="M328 224 C348 224 354 252 368 266" />
  <rect class="ln" x="386" y="238" width="72" height="56" rx="7"/><text class="label" x="407" y="272">LN</text>
  <path class="grad" d="M474 318 C390 338 264 338 132 318" />
  <text class="small" x="128" y="332">梯度回流常要穿过每层末尾 LN</text>

  <rect class="pre" x="592" y="148" width="438" height="210" rx="8" />
  <text class="label" x="754" y="178">Pre-LN</text>
  <path class="main" d="M634 266 H976" />
  <rect class="ln" x="698" y="198" width="72" height="54" rx="7"/><text class="label" x="719" y="232">LN</text>
  <rect class="block" x="804" y="198" width="108" height="54" rx="7"/><text class="label" x="832" y="232">子层</text>
  <path class="arrow" d="M686 266 C696 232 698 228 698 224" />
  <path class="arrow" d="M770 225 H804" />
  <path class="arrow" d="M912 224 C930 224 938 252 952 266" />
  <path class="grad" d="M976 318 C880 330 728 330 634 318" />
  <text class="small" x="630" y="332">主干路径更直接,深层堆叠更容易训练</text>

  <rect class="panel" x="106" y="376" width="908" height="54" rx="8" />
  <text class="text" x="132" y="400">关键不是 LN 好坏,而是 LN 放置位置如何影响 residual stream 的尺度、</text>
  <text class="text" x="132" y="418">梯度和层间信息保真。</text>
  <rect class="panel" x="72" y="470" width="976" height="42" rx="8" />
  <text class="text" x="98" y="496">读图方式: Pre-LN 让子层在规范化输入上工作,同时让残差主干保留更直接的跨层通道。</text>
</svg>
