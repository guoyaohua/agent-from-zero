<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Norm 与激活在大模型中的规模效应</title>
  <desc id="desc">展示 RMSNorm、Pre-Norm 和 SwiGLU 如何通过稳定残差流、控制激活尺度和提高 FFN 表达效率影响大模型训练与推理。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.lane{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.norm{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}.ffn{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.risk{fill:#f7d9df;stroke:#b13c52;stroke-width:1.8}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">小结构在大模型里会被重复放大成系统性差异</text>
  <text class="sub" x="56" y="82">Norm 控制尺度,SwiGLU 提升特征选择,残差流负责稳定传播。</text>
  <rect class="lane" x="98" y="160" width="924" height="86" rx="8"/><text class="head" x="124" y="194">Residual stream</text><text class="text" x="124" y="222">跨层传递主信息,每层只写入增量</text>
  <rect class="norm" x="340" y="132" width="160" height="70" rx="8"/><text class="head" x="386" y="160">RMSNorm</text><text class="text" x="374" y="184">控制激活尺度</text>
  <path class="arrow" d="M500 166 H594"/>
  <rect class="ffn" x="594" y="132" width="160" height="70" rx="8"/><text class="head" x="644" y="160">SwiGLU</text><text class="text" x="626" y="184">动态筛选特征</text>
  <rect class="risk" x="220" y="304" width="190" height="72" rx="8"/><text class="head" x="258" y="334">没有尺度控制</text><text class="text" x="250" y="358">训练发散或梯度弱</text>
  <rect class="risk" x="466" y="304" width="190" height="72" rx="8"/><text class="head" x="504" y="334">FFN 表达不足</text><text class="text" x="496" y="358">特征组合效率低</text>
  <rect class="risk" x="712" y="304" width="190" height="72" rx="8"/><text class="head" x="750" y="334">部署不匹配</text><text class="text" x="742" y="358">kernel/量化收益打折</text>
  <rect x="168" y="444" width="784" height="34" rx="8" fill="#172033"/><text x="260" y="466" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">架构细节不是装饰,它决定模型能否稳定放大规模。</text>
</svg>
