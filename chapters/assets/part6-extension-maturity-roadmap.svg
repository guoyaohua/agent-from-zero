<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">研究助手扩展成熟度路线</title>
  <desc id="desc">展示个人研究助手从单用户可信闭环到团队知识系统的扩展路线和每阶段控制面要求。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.v1{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.5}.v2{fill:#e8f0ff;stroke:#5178c9;stroke-width:1.5}.v3{fill:#fff0e6;stroke:#b05c37;stroke-width:1.5}.v4{fill:#f7d9df;stroke:#b13c52;stroke-width:1.5}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="54" y="52">扩展能力时,控制面必须同步成熟</text>
  <text class="sub" x="54" y="80">每个新能力都要带着权限、trace、eval、回滚和安全样本一起上线。</text>
  <g transform="translate(74 130)">
    <rect class="v1" x="0" y="0" width="176" height="96" rx="8"/><text class="h" x="54" y="30">v1</text><text class="t" x="22" y="56">单用户可信闭环</text><text class="t" x="22" y="76">trace + eval</text><path class="arrow" d="M176 48 H218"/>
    <rect class="v2" x="238" y="0" width="176" height="96" rx="8"/><text class="h" x="292" y="30">v2</text><text class="t" x="260" y="56">检索质量增强</text><text class="t" x="260" y="76">rerank + hard negatives</text><path class="arrow" d="M414 48 H456"/>
    <rect class="v3" x="476" y="0" width="176" height="96" rx="8"/><text class="h" x="530" y="30">v3</text><text class="t" x="498" y="56">工作流和 Critic</text><text class="t" x="498" y="76">handoff + trajectory eval</text><path class="arrow" d="M652 48 H694"/>
    <rect class="v4" x="714" y="0" width="176" height="96" rx="8"/><text class="h" x="768" y="30">v4+</text><text class="t" x="736" y="56">团队和生产化</text><text class="t" x="736" y="76">权限/审计/红队</text>
  </g>
  <g transform="translate(120 286)">
    <rect class="box" x="0" y="0" width="880" height="92" rx="8"/>
    <text class="h" x="30" y="32">扩展门禁:</text>
    <text class="t" x="30" y="58">新资料源要有权限和入库评估; 新工具要有 schema、确认和回滚; 多 Agent 要有 handoff contract;</text>
    <text class="t" x="30" y="78">长时程任务要有 checkpoint、预算和取消机制; 团队版要有所有权、审计和删除传播。</text>
  </g>
  <rect x="174" y="432" width="772" height="42" rx="8" fill="#172033"/><text x="238" y="458" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff">扩展不是把能力堆上去,而是让能力增长和可解释半径一起增长。</text>
</svg>
