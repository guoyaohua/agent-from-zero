<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">长时程自主任务</title><desc id="desc">展示长时程 Agent 的目标分解、任务队列、持久状态、检查点、恢复和人工监督。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12.5px system-ui;fill:#435066}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1120" height="470"/><text class="title" x="56" y="58">长时程 Agent: 难点是持续正确,不是一次聪明</text><text class="sub" x="56" y="86">任务越长,越需要持久状态、检查点、预算、恢复、监督和目标漂移控制。</text>
  <g transform="translate(0,-93)"><rect class="a" x="112" y="232" width="150" height="70" rx="8"/><text class="head" x="156" y="260">Goal</text><text class="text" x="140" y="284">长期目标</text><rect class="b" x="326" y="232" width="150" height="70" rx="8"/><text class="head" x="364" y="260">Queue</text><text class="text" x="350" y="284">子任务队列</text><rect class="c" x="540" y="232" width="150" height="70" rx="8"/><text class="head" x="574" y="260">Checkpoint</text><text class="text" x="568" y="284">状态和证据</text><rect class="d" x="754" y="232" width="150" height="70" rx="8"/><text class="head" x="802" y="260">Review</text><text class="text" x="782" y="284">人工/评估门</text><path class="arrow" d="M262 267 H326"/><path class="arrow" d="M476 267 H540"/><path class="arrow" d="M690 267 H754"/><rect class="panel" x="188" y="424" width="744" height="100" rx="8"/><text class="head" x="224" y="462">关键控制</text><text class="text" x="224" y="492">目标漂移检测、无进展停止、预算重置、恢复策略、阶段性验收、用户可中断。</text>
  </g>
</svg>

