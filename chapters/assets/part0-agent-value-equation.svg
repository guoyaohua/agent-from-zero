<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">Agent 价值方程</title><desc id="desc">展示 Agent 的价值来自执行缺口收益减去成本、延迟、失控风险和评估复杂度等工程代价。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.m{font:700 16px system-ui;fill:#172033}.gain{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.cost{fill:#ffe8e2;stroke:#c5533f;stroke-width:2}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="580"/><text class="t" x="56" y="58">Agent 值不值得做,看收益是否覆盖工程代价</text><text class="s" x="56" y="86">Agent 的价值不是自动化本身,而是跨越执行缺口后带来的可验证收益。</text><rect class="gain" x="92" y="150" width="380" height="220" rx="12"/><text class="h" x="220" y="184">执行缺口收益</text><text class="x" x="128" y="224">用户少做操作</text><text class="x" x="128" y="256">能访问外部和私有状态</text><text class="x" x="128" y="288">能根据中间反馈修正</text><text class="x" x="128" y="320">能产出可验证结果</text><text class="m" x="508" y="266">-</text><rect class="cost" x="648" y="150" width="380" height="220" rx="12"/><text class="h" x="792" y="184">工程代价</text><text class="x" x="684" y="224">模型和工具调用成本</text><text class="x" x="684" y="256">多轮延迟和等待体验</text><text class="x" x="684" y="288">权限、副作用和失控风险</text><text class="x" x="684" y="320">轨迹评估和复现复杂度</text><rect class="box" x="260" y="430" width="600" height="54" rx="10"/><text class="h" x="318" y="462">采用条件: 路径需要探索、观察能改善结果、动作可控、结果可验证、失败可恢复。</text></svg>
