<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Embedding 索引版本治理</title>
  <desc id="desc">展示 embedding 模型、输入格式、切块版本、距离度量和索引参数共同组成索引身份,并通过双索引评估、灰度和回滚完成升级。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #364256; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #b13c52; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#redArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b13c52" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">Embedding 升级是换坐标系,必须版本化、评估、灰度</text>
  <text class="sub" x="48" y="78">模型、输入格式、切块、归一化、距离度量和索引参数共同决定同一个向量空间。</text>

  <rect class="panel" x="48" y="112" width="1024" height="388" rx="8" />

  <rect class="blue" x="84" y="148" width="236" height="148" rx="8" />
  <text class="label" x="126" y="180">Index Manifest</text>
  <text class="small" x="112" y="210">embedding model/version</text>
  <text class="small" x="112" y="234">query/passage format</text>
  <text class="small" x="112" y="258">chunking + metric + params</text>
  <path class="arrow" d="M320 222 H380" />

  <rect class="green" x="380" y="142" width="178" height="70" rx="8" />
  <text class="label" x="428" y="172">旧索引 A</text>
  <text class="small" x="418" y="194">current traffic</text>
  <rect class="orange" x="380" y="246" width="178" height="70" rx="8" />
  <text class="label" x="428" y="276">新索引 B</text>
  <text class="small" x="410" y="298">parallel build</text>
  <path class="arrow" d="M558 177 H632" />
  <path class="arrow" d="M558 281 H632" />

  <rect class="gray" x="632" y="182" width="176" height="94" rx="8" />
  <text class="label" x="680" y="214">离线评估</text>
  <text class="small" x="662" y="240">recall / MRR / nDCG</text>
  <text class="small" x="662" y="262">latency / cost / diff</text>
  <path class="arrow" d="M808 230 H872" />

  <rect class="green" x="872" y="182" width="140" height="94" rx="8" />
  <text class="label" x="914" y="214">灰度</text>
  <text class="small" x="902" y="240">small traffic</text>
  <text class="small" x="902" y="262">trace compare</text>

  <rect class="red" x="84" y="360" width="286" height="74" rx="8" />
  <text class="label" x="124" y="390">禁止混用坐标系</text>
  <text class="small" x="112" y="414">query vector B 不能查 index A</text>
  <path class="dash" d="M430 316 C360 360 320 388 370 397" />

  <rect class="gray" x="448" y="360" width="222" height="74" rx="8" />
  <text class="label" x="500" y="390">回滚窗口</text>
  <text class="small" x="484" y="414">保留旧索引和旧 query path</text>

  <rect class="gray" x="730" y="360" width="282" height="74" rx="8" />
  <text class="label" x="792" y="390">上线后监控</text>
  <text class="small" x="764" y="414">query diff, zero-hit, citation failures</text>
  <path class="arrow" d="M942 276 V360" />

  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式: embedding 不是一个可随手替换的函数,而是一套会改变召回行为的数据坐标系。</text>
</svg>
