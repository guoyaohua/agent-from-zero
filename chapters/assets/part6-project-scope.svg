<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">个人研究助手项目范围</title>
  <desc id="desc">展示个人研究助手从问题输入、资料检索、阅读、证据整理、回答生成、引用校验和笔记沉淀的项目范围。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">个人研究助手: 从资料到可信回答的最小闭环</text><text class="sub" x="56" y="86">项目目标不是做万能助手,而是完成研究问答、证据整理、引用和笔记沉淀。</text>
  <rect class="blue" x="84" y="238" width="130" height="66" rx="8"/><text class="head" x="118" y="266">Question</text><text class="small" x="112" y="288">研究问题</text>
  <rect class="green" x="268" y="238" width="130" height="66" rx="8"/><text class="head" x="304" y="266">Search</text><text class="small" x="296" y="288">资料检索</text>
  <rect class="orange" x="452" y="238" width="130" height="66" rx="8"/><text class="head" x="492" y="266">Read</text><text class="small" x="480" y="288">提取证据</text>
  <rect class="purple" x="636" y="238" width="130" height="66" rx="8"/><text class="head" x="672" y="266">Answer</text><text class="small" x="662" y="288">引用回答</text>
  <rect class="green" x="820" y="238" width="130" height="66" rx="8"/><text class="head" x="856" y="266">Notes</text><text class="small" x="850" y="288">沉淀记忆</text>
  <path class="arrow" d="M214 271 H268"/><path class="arrow" d="M398 271 H452"/><path class="arrow" d="M582 271 H636"/><path class="arrow" d="M766 271 H820"/>
  <rect class="panel" x="136" y="404" width="848" height="126" rx="8"/><text class="head" x="174" y="440">Out of Scope for v1</text><text class="text" x="174" y="472">自动购买论文、自动发邮件联系作者、长时程无人值守研究、跨账号数据聚合、高风险外部写操作。</text><text class="text" x="174" y="500">先做可信研究闭环,再逐步扩展。</text>
</svg>

