<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Context Pack 评估</title>
  <desc id="desc">展示 context pack 应作为可测试产物,通过快照、静态检查、ablation、context diff 和任务指标来评估上下文工程质量。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">Context pack 是接口产物,应该能快照、检查、对比和回归</text>
  <text class="sub" x="48" y="78">不要只看 prompt 文字是否顺眼,要评估它是否完整、相关、分层、可追溯且成本可控。</text>

  <rect class="panel" x="48" y="112" width="1024" height="388" rx="8" />
  <rect class="blue" x="84" y="182" width="180" height="86" rx="8" />
  <text class="label" x="128" y="214">Context Pack</text>
  <text class="small" x="116" y="238">rules/state/tools/evidence</text>
  <path class="arrow" d="M264 225 H324" />

  <rect class="green" x="324" y="144" width="180" height="70" rx="8" />
  <text class="label" x="374" y="176">快照</text>
  <text class="small" x="356" y="198">人工 review 可见</text>
  <rect class="green" x="324" y="240" width="180" height="70" rx="8" />
  <text class="label" x="366" y="272">静态检查</text>
  <text class="small" x="354" y="294">来源/权限/token</text>

  <path class="arrow" d="M504 178 H566" />
  <path class="arrow" d="M504 275 H566" />

  <rect class="orange" x="566" y="144" width="190" height="70" rx="8" />
  <text class="label" x="612" y="176">Ablation</text>
  <text class="small" x="596" y="198">去掉记忆/证据/工具比较</text>
  <rect class="orange" x="566" y="240" width="190" height="70" rx="8" />
  <text class="label" x="616" y="272">Context Diff</text>
  <text class="small" x="596" y="294">版本变化可解释</text>
  <path class="arrow" d="M756 178 H824" />
  <path class="arrow" d="M756 275 H824" />

  <rect class="red" x="824" y="182" width="180" height="86" rx="8" />
  <text class="label" x="868" y="214">任务指标</text>
  <text class="small" x="854" y="238">成功率/幻觉/误用/成本</text>

  <rect class="gray" x="144" y="368" width="836" height="58" rx="8" />
  <text class="label" x="176" y="402">失败定位</text>
  <text class="text" x="276" y="402">缺信息、噪声多、证据无来源、工具过多、输出契约位置错误,都应能被测试发现。</text>

  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式: 上下文工程成熟后,每次模型调用前的输入都能像 API payload 一样被检查和比较。</text>
</svg>
