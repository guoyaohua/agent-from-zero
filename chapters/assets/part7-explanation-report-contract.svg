<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent 解释报告契约</title>
  <desc id="desc">展示一次 Agent 解释报告应包含 context、proposal、policy、execution、state、review 六段,并标注证据、责任和隐私级别。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.card{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.policy{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">好的解释报告是结构化证据,不是模型事后写理由</text>
  <text class="sub" x="56" y="82">不同角色看到不同深度,但每段都要能回到 trace。</text>
  <g transform="translate(86 132)">
    <rect class="card" x="0" y="0" width="300" height="86" rx="8"/><text class="head" x="24" y="28">1. Context</text><text class="text" x="24" y="54">prompt version、evidence ids、memory refs</text>
    <rect class="card" x="324" y="0" width="300" height="86" rx="8"/><text class="head" x="348" y="28">2. Proposal</text><text class="text" x="348" y="54">structured action、args、source mapping</text>
    <rect class="policy" x="648" y="0" width="300" height="86" rx="8"/><text class="head" x="672" y="28">3. Policy</text><text class="text" x="672" y="54">permission、risk、confirmation、decision</text>
    <rect class="card" x="0" y="112" width="300" height="86" rx="8"/><text class="head" x="24" y="140">4. Execution</text><text class="text" x="24" y="166">tool result、error、artifact ref</text>
    <rect class="card" x="324" y="112" width="300" height="86" rx="8"/><text class="head" x="348" y="140">5. State</text><text class="text" x="348" y="166">state diff、plan update、stop reason</text>
    <rect class="ok" x="648" y="112" width="300" height="86" rx="8"/><text class="head" x="672" y="140">6. Review</text><text class="text" x="672" y="166">eval finding、owner、next action</text>
  </g>
  <rect x="166" y="420" width="788" height="38" rx="8" fill="#172033"/><text x="248" y="444" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">解释若不能指向可修复的 span、策略或状态,就只是漂亮叙述。</text>
</svg>
