<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">五大工作流模式地图</title>
  <desc id="desc">展示 Prompt Chaining、Routing、Parallelization、Orchestrator-Workers 和 Evaluator-Optimizer 的形状与用途。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.node{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8;rx:7}.node2{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.8;rx:7}.node3{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8;rx:7}.node4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:1.8;rx:7}.node5{fill:#f7d9df;stroke:#b13c52;stroke-width:1.8;rx:7}.arrow{fill:none;stroke:#94a3b8;stroke-width:1.9;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="660"/><text class="title" x="56" y="58">五大工作流模式: 用结构收束模型不确定性</text><text class="sub" x="56" y="86">工作流不是 Agent 的反面,而是把模型能力放进可测试、可审计、可恢复的形状里。</text>
  <rect class="panel" x="60" y="126" width="320" height="160" rx="8"/><text class="head" x="90" y="162">1. Prompt Chaining</text><rect class="node" x="92" y="196" width="52" height="32"/><rect class="node" x="178" y="196" width="52" height="32"/><rect class="node" x="264" y="196" width="52" height="32"/><path class="arrow" d="M144 212 H178"/><path class="arrow" d="M230 212 H264"/><text class="text" x="90" y="258">线性拆解: 提取 -> 整理 -> 生成</text>
  <rect class="panel" x="400" y="126" width="320" height="160" rx="8"/><text class="head" x="430" y="162">2. Routing</text><rect class="node2" x="438" y="196" width="72" height="34"/><rect class="node2" x="578" y="170" width="72" height="30"/><rect class="node2" x="578" y="214" width="72" height="30"/><path class="arrow" d="M510 213 L578 185"/><path class="arrow" d="M510 213 L578 229"/><text class="text" x="430" y="258">先分流,再进入专门路径</text>
  <rect class="panel" x="740" y="126" width="320" height="160" rx="8"/><text class="head" x="770" y="162">3. Parallelization</text><rect class="node3" x="778" y="196" width="62" height="32"/><rect class="node3" x="878" y="160" width="62" height="30"/><rect class="node3" x="878" y="204" width="62" height="30"/><rect class="node3" x="978" y="196" width="62" height="32"/><path class="arrow" d="M840 212 L878 175"/><path class="arrow" d="M840 212 H878"/><path class="arrow" d="M940 175 L978 212"/><path class="arrow" d="M940 219 H978"/><text class="text" x="770" y="258">独立子任务并行,再合并</text>
  <rect class="panel" x="208" y="344" width="320" height="178" rx="8"/><text class="head" x="238" y="380">4. Orchestrator-Workers</text><rect class="node4" x="332" y="404" width="78" height="34"/><rect class="node4" x="248" y="464" width="62" height="30"/><rect class="node4" x="340" y="464" width="62" height="30"/><rect class="node4" x="432" y="464" width="62" height="30"/><path class="arrow" d="M371 438 L279 464"/><path class="arrow" d="M371 438 V464"/><path class="arrow" d="M371 438 L463 464"/><text class="text" x="238" y="506">动态拆分任务,汇总 worker 结果</text>
  <rect class="panel" x="594" y="344" width="320" height="178" rx="8"/><text class="head" x="624" y="380">5. Evaluator-Optimizer</text><rect class="node5" x="632" y="424" width="76" height="34"/><rect class="node5" x="762" y="424" width="76" height="34"/><path class="arrow" d="M708 441 H762"/><path class="arrow" d="M800 458 C800 500 670 500 670 458"/><text class="text" x="624" y="506">生成 -> 评估 -> 修改,直到达标或停止</text>
  <text class="text" x="310" y="590">可以组合: Routing 选路径,Parallelization 做子任务,Evaluator-Optimizer 做验证闭环。</text>
</svg>
