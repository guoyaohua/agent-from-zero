<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">上下文 Diff 回归</title>
  <desc id="desc">展示上下文工程如何通过 context diff、任务结果和错误归因进行版本回归。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 26px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.sub{font:400 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}.v1{fill:#dbeafe;stroke:#2563eb}.v2{fill:#dcfce7;stroke:#16a34a}.diff{fill:#fef3c7;stroke:#d97706}.bad{fill:#fee2e2;stroke:#dc2626}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.3}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="48" y="48">上下文工程要看 diff,否则很难解释为什么变好或变差</text>
  <text class="sub" x="48" y="74">同一任务在两个 context builder 版本下的差异,应能映射到结果变化。</text>

  <rect class="v1" x="70" y="122" width="230" height="96" rx="8"/>
  <text class="h" x="118" y="154">Context v1</text><text class="t" x="98" y="180">旧记忆多 / 证据少</text><text class="t" x="98" y="198">工具 schema 全量</text>
  <rect class="v2" x="70" y="298" width="230" height="96" rx="8"/>
  <text class="h" x="118" y="330">Context v2</text><text class="t" x="98" y="356">记忆裁剪 / 证据编号</text><text class="t" x="98" y="374">工具 schema 按需</text>
  <rect class="diff" x="392" y="190" width="270" height="126" rx="10"/>
  <text class="h" x="430" y="222">Context diff</text>
  <text class="t" x="430" y="250">+ added S2 policy evidence</text>
  <text class="t" x="430" y="274">- removed stale memory M4</text>
  <text class="t" x="430" y="298">~ moved output contract later</text>
  <rect class="box" x="750" y="122" width="280" height="96" rx="8"/>
  <text class="h" x="790" y="154">Task result</text><text class="t" x="790" y="180">success / hallucination / cost</text><text class="t" x="790" y="198">tool misuse / citation accuracy</text>
  <rect class="bad" x="750" y="298" width="280" height="96" rx="8"/>
  <text class="h" x="790" y="330">Regression label</text><text class="t" x="790" y="356">missing_constraint / noise</text><text class="t" x="790" y="374">wrong_priority / unsafe_source</text>
  <path class="arrow" d="M300 170 C342 190 350 210 392 230"/>
  <path class="arrow" d="M300 346 C342 322 350 296 392 276"/>
  <path class="arrow" d="M662 238 H750"/>
  <path class="arrow" d="M662 286 H750"/>
  <rect class="box" x="70" y="446" width="960" height="48" rx="8"/>
  <text class="h" x="100" y="476">回归规则:</text><text class="t" x="178" y="476">每次 context builder 改动,都要保存 context snapshot、diff、输出、指标和错误归因。</text>
</svg>
