<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Context Pack 构建流水线</title><desc id="desc">展示 Agent 每轮调用前如何收集、过滤、压缩、排序、标注和预留上下文,构造模型可用的工作包。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15px system-ui;fill:#172033}.x{font:400 12.2px system-ui;fill:#435066}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">Prompt 之前,先构造 Context Pack</text><text class="s" x="56" y="86">上下文质量来自材料选择、压缩、排序和可信标注,不是来自某句神奇提示词。</text><rect class="p" x="74" y="170" width="140" height="78" rx="9"/><text class="h" x="126" y="200">收集</text><text class="x" x="104" y="224">用户/状态/工具</text><rect class="g" x="244" y="170" width="140" height="78" rx="9"/><text class="h" x="296" y="200">过滤</text><text class="x" x="274" y="224">相关/新鲜/可信</text><rect class="o" x="414" y="170" width="140" height="78" rx="9"/><text class="h" x="466" y="200">压缩</text><text class="x" x="444" y="224">摘要/字段/引用</text><rect class="v" x="584" y="170" width="140" height="78" rx="9"/><text class="h" x="636" y="200">排序</text><text class="x" x="614" y="224">目标/证据/观察</text><rect class="p" x="754" y="170" width="140" height="78" rx="9"/><text class="h" x="806" y="200">标注</text><text class="x" x="780" y="224">来源/时间/权限</text><rect class="g" x="924" y="170" width="140" height="78" rx="9"/><text class="h" x="976" y="200">预留</text><text class="x" x="954" y="224">输出 token 空间</text><path class="a" d="M214 209H244M384 209H414M554 209H584M724 209H754M894 209H924"/><rect class="node" x="188" y="340" width="744" height="96" rx="12"/><text class="h" x="486" y="372">Context Pack</text><text class="x" x="230" y="404">goal + constraints + state summary + evidence pack + tool observations + available actions + output contract</text><rect class="node" x="250" y="500" width="620" height="42" rx="8"/><text class="x" x="284" y="526">判断标准: 每段内容都应该能改变本轮决策;不能改变的内容应摘要、外存或延迟读取。</text></svg>
