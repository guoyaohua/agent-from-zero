<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">多头注意力的信息路由</title>
  <desc id="desc">展示多个注意力头在不同子空间中读取上下文,再通过输出投影写回 residual stream,并提示注意力权重不是完整解释。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">多头注意力不是投票,而是多条并行信息路由</text>
  <text class="sub" x="48" y="78">每个 head 在自己的 Q/K/V 子空间中读取上下文,再由输出投影混合写回 residual stream。</text>
  <rect class="panel" x="48" y="112" width="1024" height="388" rx="8" />
  <rect class="blue" x="88" y="250" width="150" height="76" rx="8" />
  <text class="label" x="128" y="280">输入表示</text>
  <text class="small" x="122" y="304">residual stream</text>
  <path class="arrow" d="M238 288 H306" />
  <rect class="green" x="306" y="148" width="170" height="64" rx="8" />
  <text class="label" x="358" y="176">Head 1</text>
  <text class="small" x="344" y="198">局部/邻近线索</text>
  <rect class="orange" x="306" y="238" width="170" height="64" rx="8" />
  <text class="label" x="358" y="266">Head 2</text>
  <text class="small" x="342" y="288">指代/实体线索</text>
  <rect class="red" x="306" y="328" width="170" height="64" rx="8" />
  <text class="label" x="358" y="356">Head h</text>
  <text class="small" x="342" y="378">格式/结构线索</text>
  <path class="arrow" d="M476 180 C548 210 566 250 612 288" />
  <path class="arrow" d="M476 270 H612" />
  <path class="arrow" d="M476 360 C548 330 566 312 612 288" />
  <rect class="gray" x="612" y="238" width="160" height="100" rx="8" />
  <text class="label" x="656" y="272">Concat</text>
  <text class="small" x="646" y="298">拼接所有 head</text>
  <path class="arrow" d="M772 288 H838" />
  <rect class="blue" x="838" y="238" width="150" height="100" rx="8" />
  <text class="label" x="884" y="272">W_O</text>
  <text class="small" x="868" y="298">混合并写回</text>
  <path class="arrow" d="M913 338 V398 H162 V326" />
  <rect class="gray" x="142" y="414" width="836" height="50" rx="8" />
  <text class="text" x="174" y="445">注意力权重只是读取分布;最终影响还经过 V、W_O、残差、FFN 和后续层。</text>
  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式: head 提供多视角读取能力,真正的表示更新发生在多层 residual stream 中。</text>
</svg>
