<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">长时程 Agent 检查点动画</title><desc id="desc">动画展示长时程 Agent 在计划、执行、检查点、评审门和恢复之间推进,强调任务不能只靠长上下文维持。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.cp{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.gate{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.risk{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:3;stroke-linecap:round}.dot{fill:#172033}</style></defs><rect class="bg" width="1120" height="530"/><text class="t" x="56" y="58">长时程任务需要检查点,不是更长的上下文</text><text class="s" x="56" y="86">黑点表示任务状态在阶段之间移动;每个检查点都应可恢复、可审计、可回滚。</text>
  <g transform="translate(0,-113)"><rect class="cp" x="90" y="250" width="148" height="70" rx="10"/><text class="h" x="142" y="280">Plan</text><text class="x" x="120" y="304">目标和完成标准</text><rect class="cp" x="286" y="250" width="148" height="70" rx="10"/><text class="h" x="334" y="280">Work</text><text class="x" x="316" y="304">执行子任务</text><rect class="gate" x="482" y="250" width="148" height="70" rx="10"/><text class="h" x="522" y="280">Checkpoint</text><text class="x" x="512" y="304">产物和证据</text><rect class="gate" x="678" y="250" width="148" height="70" rx="10"/><text class="h" x="716" y="280">Review</text><text class="x" x="710" y="304">自动/人工验收</text><rect class="ok" x="874" y="250" width="148" height="70" rx="10"/><text class="h" x="926" y="280">Next</text><text class="x" x="904" y="304">继续或交付</text><rect class="risk" x="482" y="430" width="148" height="70" rx="10"/><text class="h" x="524" y="460">Rollback</text><text class="x" x="512" y="484">回到可信状态</text><path class="line" d="M238 285H286M434 285H482M630 285H678M826 285H874M752 320C735 390 650 430 630 465M482 465C360 450 300 370 360 320"/><circle class="dot" r="9"><animateMotion dur="6s" repeatCount="indefinite" path="M164 285H360H556H752H948M752 320C735 390 650 430 556 465C360 450 300 370 360 320"/></circle><text class="x" x="118" y="570">没有检查点,长任务就无法解释“当前状态从哪里来”;没有评审门,长任务就会把早期错误一路放大。</text>
  </g>
</svg>
