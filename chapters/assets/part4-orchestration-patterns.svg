<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 编排模式</title>
  <desc id="desc">展示顺序流水线、中心调度、黑板协作、市场式竞标和层级管理等多 Agent 编排模式。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.node{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.node2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.node3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.node4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="700"/><text class="title" x="56" y="58">编排模式: 谁决定下一步,谁拥有全局状态</text><text class="sub" x="56" y="86">多 Agent 架构的关键不是角色数量,而是控制流、状态归属和失败恢复方式。</text>
  <rect class="panel" x="70" y="130" width="300" height="202" rx="8"/><text class="head" x="104" y="164">Pipeline</text><rect class="node" x="104" y="208" width="64" height="44" rx="8"/><text class="text" x="119" y="235">A</text><rect class="node" x="194" y="208" width="64" height="44" rx="8"/><text class="text" x="209" y="235">B</text><rect class="node" x="284" y="208" width="64" height="44" rx="8"/><text class="text" x="299" y="235">C</text><path class="arrow" d="M168 230 H194"/><path class="arrow" d="M258 230 H284"/><text class="text" x="104" y="294">适合固定阶段和明确交付物</text>
  <rect class="panel" x="410" y="130" width="300" height="202" rx="8"/><text class="head" x="444" y="164">Hub-and-spoke</text><rect class="node3" x="526" y="206" width="70" height="52" rx="8"/><text class="text" x="543" y="236">Hub</text><rect class="node" x="450" y="242" width="58" height="40" rx="8"/><text class="text" x="470" y="267">A</text><rect class="node2" x="616" y="242" width="58" height="40" rx="8"/><text class="text" x="636" y="267">B</text><path class="arrow" d="M526 238 L508 252"/><path class="arrow" d="M596 238 L616 252"/><text class="text" x="444" y="294">适合中心调度和全局约束</text>
  <rect class="panel" x="750" y="130" width="300" height="202" rx="8"/><text class="head" x="784" y="164">Blackboard</text><rect class="node4" x="824" y="210" width="154" height="54" rx="8"/><text class="text" x="868" y="242">Shared State</text><rect class="node" x="788" y="276" width="58" height="36" rx="8"/><text class="text" x="808" y="299">A</text><rect class="node2" x="874" y="276" width="58" height="36" rx="8"/><text class="text" x="894" y="299">B</text><rect class="node3" x="960" y="276" width="58" height="36" rx="8"/><text class="text" x="980" y="299">C</text><text class="text" x="784" y="294">适合多人贡献和状态聚合</text>
  <rect class="panel" x="230" y="388" width="300" height="202" rx="8"/><text class="head" x="264" y="422">Manager-worker</text><rect class="node3" x="346" y="454" width="70" height="48" rx="8"/><text class="text" x="358" y="484">Manager</text><rect class="node" x="274" y="530" width="62" height="38" rx="8"/><text class="text" x="294" y="555">W1</text><rect class="node" x="350" y="530" width="62" height="38" rx="8"/><text class="text" x="370" y="555">W2</text><rect class="node" x="426" y="530" width="62" height="38" rx="8"/><text class="text" x="446" y="555">W3</text><path class="arrow" d="M381 502 L305 530"/><path class="arrow" d="M381 502 V530"/><path class="arrow" d="M381 502 L457 530"/><text class="text" x="264" y="620">适合拆任务、并行执行、汇总</text>
  <rect class="panel" x="590" y="388" width="300" height="202" rx="8"/><text class="head" x="624" y="422">Debate / Committee</text><rect class="node" x="628" y="476" width="68" height="44" rx="8"/><text class="text" x="649" y="503">A</text><rect class="node2" x="706" y="446" width="68" height="44" rx="8"/><text class="text" x="727" y="473">B</text><rect class="node3" x="784" y="476" width="68" height="44" rx="8"/><text class="text" x="805" y="503">C</text><rect class="node4" x="706" y="542" width="68" height="44" rx="8"/><text class="text" x="724" y="569">Judge</text><path class="arrow" d="M662 520 L706 552"/><path class="arrow" d="M740 490 V542"/><path class="arrow" d="M818 520 L774 552"/><text class="text" x="624" y="620">适合评审、方案比较和质量门</text>
</svg>

