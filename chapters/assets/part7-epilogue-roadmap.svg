<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">从 0 到 1 之后</title><desc id="desc">展示读者从掌握基础、搭建项目、生产化、深入研究到持续学习的路线。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12.5px system-ui;fill:#435066}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1120" height="400"/><text class="title" x="56" y="58">从 0 到 1 之后: 继续把系统做真实</text><text class="sub" x="56" y="86">学习 Agent 的终点不是知道概念,而是能在真实约束里做出可靠系统。</text>
  <g transform="translate(0,-129)"><rect class="n" x="112" y="268" width="170" height="70" rx="8"/><text class="head" x="152" y="296">Understand</text><text class="text" x="142" y="320">原理和边界</text><rect class="n2" x="344" y="268" width="170" height="70" rx="8"/><text class="head" x="390" y="296">Build</text><text class="text" x="374" y="320">最小闭环</text><rect class="n3" x="576" y="268" width="170" height="70" rx="8"/><text class="head" x="622" y="296">Evaluate</text><text class="text" x="606" y="320">trace 和回归</text><rect class="n4" x="808" y="268" width="170" height="70" rx="8"/><text class="head" x="856" y="296">Operate</text><text class="text" x="838" y="320">安全和生产化</text><path class="arrow" d="M282 303 H344"/><path class="arrow" d="M514 303 H576"/><path class="arrow" d="M746 303 H808"/><text class="text" x="230" y="470">真正的能力来自循环:做一个小系统,观察失败,修正边界,扩展评估,再做下一版。</text>
  </g>
</svg>

