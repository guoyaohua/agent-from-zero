<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">读者路径</title>
  <desc id="desc">展示从零主线、工程落地和原理深潜三条阅读路径如何穿过本书内容。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 18px system-ui;fill:#172033}.text{font:400 13px system-ui;fill:#435066}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="480"/><text class="title" x="56" y="58">三条阅读路径</text><text class="sub" x="56" y="86">不同背景的读者可以用不同顺序穿过同一张 Agent 知识地图。</text>
  <g transform="translate(0,-49)">
  <rect class="a" x="98" y="178" width="260" height="96" rx="8"/><text class="head" x="174" y="216">从零主线</text><text class="text" x="132" y="244">概念直觉 -> 最小项目</text>
  <rect class="b" x="430" y="178" width="260" height="96" rx="8"/><text class="head" x="506" y="216">工程落地</text><text class="text" x="464" y="244">工具/RAG -> 评估/安全</text>
  <rect class="c" x="762" y="178" width="260" height="96" rx="8"/><text class="head" x="838" y="216">原理深潜</text><text class="text" x="796" y="244">Transformer -> 推理优化</text>
  <rect class="panel" x="156" y="390" width="808" height="96" rx="8"/><text class="head" x="480" y="426">共同终点</text><text class="text" x="248" y="456">能判断、能设计、能实现一个可观测、可评估、可控风险的 Agent 系统。</text>
  <path class="arrow" d="M228 274 V390"/><path class="arrow" d="M560 274 V390"/><path class="arrow" d="M892 274 V390"/>
  </g>
</svg>

