<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">Prompt 到 Loop 的动态数据流</title><desc id="desc">动画展示 Prompt、Context、Harness 和 Loop 如何在一轮 Agent 执行中传递信息。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.n{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.p1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.p2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.p3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.p4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.line{fill:none;stroke:#8a98aa;stroke-width:3;stroke-linecap:round}.dot{fill:#172033}</style></defs><rect class="bg" width="1120" height="450"/><text class="t" x="56" y="58">一轮 Agent 不是一次模型调用,而是信息在四层之间流动</text><text class="s" x="56" y="86">黑点表示当前轮的决策信号: 先组织输入,再受控执行,最后写回状态进入下一轮。</text>
  <g transform="translate(0,-123)"><rect class="p1" x="80" y="250" width="190" height="110" rx="10"/><text class="h" x="140" y="290">Prompt</text><text class="x" x="110" y="322">任务表达</text><rect class="p2" x="330" y="250" width="190" height="110" rx="10"/><text class="h" x="390" y="290">Context</text><text class="x" x="360" y="322">事实与状态</text><rect class="p3" x="580" y="250" width="190" height="110" rx="10"/><text class="h" x="642" y="290">Harness</text><text class="x" x="610" y="322">校验与执行</text><rect class="p4" x="830" y="250" width="190" height="110" rx="10"/><text class="h" x="892" y="290">Loop</text><text class="x" x="860" y="322">更新与继续</text><path class="line" d="M270 305H330M520 305H580M770 305H830"/><path class="line" d="M925 360C900 472 234 472 175 360"/><circle class="dot" r="9"><animateMotion dur="5.6s" repeatCount="indefinite" path="M175 305H425H675H925C900 472 234 472 175 360V305"/></circle><rect class="n" x="190" y="470" width="740" height="64" rx="8"/><text class="h" x="220" y="502">动画含义</text><text class="x" x="320" y="502">一次执行后,Observation 会进入状态;下一轮 Context 不是旧 Prompt 的复制,而是更新后的工作视图。</text>
  </g>
</svg>
