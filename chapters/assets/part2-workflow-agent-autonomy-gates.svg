<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Workflow 到 Agent 自主性门禁</title>
  <desc id="desc">展示从固定工作流逐步提高 Agent 自主性时需要补齐的评估、权限、状态和回滚门禁。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.5}.blue{fill:#e8f0ff;stroke:#5178c9;stroke-width:1.5}.warn{fill:#fff0e6;stroke:#b05c37;stroke-width:1.5}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:1.5}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="54" y="52">提高自主性前,先补门禁</text>
  <text class="sub" x="54" y="80">从 Workflow 到 Agent 不是一步跳跃,而是逐级开放计划、工具、状态和副作用。</text>
  <g transform="translate(78 138)">
    <rect class="ok" x="0" y="0" width="154" height="90" rx="8"/><text class="h" x="52" y="30">L1</text><text class="t" x="24" y="56">固定流程</text><path class="arrow" d="M154 45 H198"/>
    <rect class="blue" x="218" y="0" width="154" height="90" rx="8"/><text class="h" x="270" y="30">L2</text><text class="t" x="238" y="56">可路由分支</text><path class="arrow" d="M372 45 H416"/>
    <rect class="warn" x="436" y="0" width="154" height="90" rx="8"/><text class="h" x="488" y="30">L3</text><text class="t" x="456" y="56">阶段内自治</text><path class="arrow" d="M590 45 H634"/>
    <rect class="bad" x="654" y="0" width="154" height="90" rx="8"/><text class="h" x="706" y="30">L4</text><text class="t" x="674" y="56">条件自治</text><path class="arrow" d="M808 45 H852"/>
    <rect class="box" x="872" y="0" width="154" height="90" rx="8"/><text class="h" x="924" y="30">L5</text><text class="t" x="892" y="56">长期自治</text>
  </g>
  <g transform="translate(136 300)">
    <rect class="box" x="0" y="0" width="848" height="82" rx="8"/>
    <text class="h" x="32" y="30">每升一级必须补:</text>
    <text class="t" x="32" y="56">固定 eval、trace、状态对象、预算、权限、确认、回滚、无进展停止、事故响应和 owner。</text>
  </g>
  <rect x="202" y="436" width="716" height="38" rx="8" fill="#172033"/><text x="268" y="460" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff">自主性是权力,不是长度;权力越大,门禁越要清楚。</text>
</svg>
