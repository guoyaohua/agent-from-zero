<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Guardrails 护栏管线</title>
  <desc id="desc">展示 Agent 护栏在输入、上下文、工具调用、模型输出和后处理阶段的检查与拦截。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">Guardrails: 把规则放在正确的阶段</text><text class="sub" x="56" y="86">输入、上下文、工具、输出和执行后校验需要不同护栏,不能只靠一个输出过滤器。</text>
  <rect class="blue" x="78" y="236" width="122" height="64" rx="8"/><text class="head" x="116" y="264">Input</text><text class="small" x="104" y="286">意图/敏感信息</text>
  <rect class="green" x="250" y="236" width="122" height="64" rx="8"/><text class="head" x="282" y="264">Context</text><text class="small" x="278" y="286">来源/权限</text>
  <rect class="orange" x="422" y="236" width="122" height="64" rx="8"/><text class="head" x="458" y="264">Model</text><text class="small" x="446" y="286">格式/策略</text>
  <rect class="red" x="594" y="236" width="122" height="64" rx="8"/><text class="head" x="632" y="264">Tool</text><text class="small" x="620" y="286">权限/确认</text>
  <rect class="green" x="766" y="236" width="122" height="64" rx="8"/><text class="head" x="800" y="264">Output</text><text class="small" x="792" y="286">安全/引用</text>
  <rect class="blue" x="938" y="236" width="104" height="64" rx="8"/><text class="head" x="970" y="264">Audit</text><text class="small" x="964" y="286">记录/告警</text>
  <path class="arrow" d="M200 268 H250"/><path class="arrow" d="M372 268 H422"/><path class="arrow" d="M544 268 H594"/><path class="arrow" d="M716 268 H766"/><path class="arrow" d="M888 268 H938"/>
  <rect class="panel" x="132" y="408" width="856" height="118" rx="8"/><text class="head" x="168" y="444">护栏不是只拒绝</text><text class="text" x="168" y="476">它也可以重写、脱敏、要求澄清、降级到只读、请求确认、返回安全替代方案。</text><text class="text" x="168" y="504">关键是可解释、可记录、可测试,并知道自己保护的是哪类风险。</text>
</svg>

