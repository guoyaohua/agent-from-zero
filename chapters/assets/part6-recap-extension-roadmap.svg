<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">个人研究助手扩展路线</title>
  <desc id="desc">展示个人研究助手从单 Agent 到多资料源、多 Agent、自动评估、团队知识库和长期研究任务的扩展路线。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.node{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.node2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.node3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.node4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="380"/><text class="title" x="56" y="58">扩展路线: 先把闭环做稳,再扩大能力面</text><text class="sub" x="56" y="86">研究助手可以逐步扩展资料源、多 Agent、评估、团队知识库和长时程任务。</text>
  <g transform="translate(0,-121)">
  <rect class="node" x="94" y="260" width="160" height="70" rx="8"/><text class="head" x="144" y="288">v1</text><text class="text" x="128" y="312">单 Agent 研究闭环</text>
  <rect class="node2" x="302" y="260" width="160" height="70" rx="8"/><text class="head" x="352" y="288">v2</text><text class="text" x="330" y="312">多资料源 RAG</text>
  <rect class="node3" x="510" y="260" width="160" height="70" rx="8"/><text class="head" x="560" y="288">v3</text><text class="text" x="536" y="312">研究/评审分工</text>
  <rect class="node4" x="718" y="260" width="160" height="70" rx="8"/><text class="head" x="768" y="288">v4</text><text class="text" x="748" y="312">自动评估回归</text>
  <rect class="node2" x="926" y="260" width="120" height="70" rx="8"/><text class="head" x="956" y="288">v5</text><text class="text" x="946" y="312">团队知识库</text>
  <path class="arrow" d="M254 295 H302"/><path class="arrow" d="M462 295 H510"/><path class="arrow" d="M670 295 H718"/><path class="arrow" d="M878 295 H926"/>
  <text class="text" x="126" y="450">每一步扩展前都要问: 评估是否覆盖? trace 是否可复盘? 权限是否收窄? 成本是否可控?</text>

  </g>
</svg>

