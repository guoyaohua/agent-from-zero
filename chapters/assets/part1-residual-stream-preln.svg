<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Residual Stream 与 Pre-LN</title>
  <desc id="desc">展示 Pre-LN Transformer 中 residual stream 作为信息主干,Attention 和 FFN 通过归一化输入向主干写入增量。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .main { fill: none; stroke: #172033; stroke-width: 5; stroke-linecap: round; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">Residual stream 是主干,Attention 和 FFN 只写入增量</text>
  <text class="sub" x="48" y="78">Pre-LN 让子层处理归一化后的表示,同时保留一条更干净的残差通路。</text>
  <rect class="panel" x="48" y="112" width="1024" height="388" rx="8" />
  <path class="main" d="M112 306 H1008" />
  <text class="label" x="112" y="286">Residual Stream</text>
  <rect class="blue" x="214" y="160" width="130" height="58" rx="8" />
  <text class="label" x="258" y="194">LN</text>
  <path class="arrow" d="M280 306 V218" />
  <rect class="green" x="384" y="150" width="160" height="78" rx="8" />
  <text class="label" x="424" y="184">Attention</text>
  <text class="small" x="414" y="206">跨 token 写入</text>
  <path class="arrow" d="M344 189 H384" />
  <path class="arrow" d="M464 228 V306" />
  <rect class="blue" x="590" y="386" width="130" height="58" rx="8" />
  <text class="label" x="634" y="420">LN</text>
  <path class="arrow" d="M656 306 V386" />
  <rect class="orange" x="760" y="376" width="160" height="78" rx="8" />
  <text class="label" x="818" y="410">FFN</text>
  <text class="small" x="792" y="432">逐 token 加工</text>
  <path class="arrow" d="M720 415 H760" />
  <path class="arrow" d="M840 376 V306" />
  <rect class="gray" x="154" y="432" width="812" height="50" rx="8" />
  <text class="text" x="184" y="463">深层稳定性的关键:主干不断保留和积累信息,子层学习“该写入什么增量”。</text>
  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式: Pre-LN 的残差主干让梯度和信息更容易穿过很多层,降低深层训练难度。</text>
</svg>
