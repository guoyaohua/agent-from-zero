<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">四层调试阶梯</title><desc id="desc">展示 Agent 失败时从上下文、动作、执行、状态到下一轮策略的逐步排查路径。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.8}.ctx{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.har{fill:#fff0e6;stroke:#b05c37;stroke-width:1.6}.loop{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.6}.prompt{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.6}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}.tag{fill:#172033}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="560"/><text class="t" x="56" y="58">不要先改 Prompt: 先沿责任链定位失败</text><text class="s" x="56" y="86">一次失败要看模型看见了什么、提出了什么、系统执行了什么、状态写入了什么、下一轮是否改变。</text><rect class="bad" x="64" y="146" width="210" height="258" rx="10"/><text class="h" x="100" y="178">失败现象</text><text class="x" x="92" y="214">研究助手输出流畅</text><text class="x" x="92" y="238">但引用不存在,</text><text class="x" x="92" y="262">还重复搜索同一关键词。</text><line x1="92" y1="292" x2="246" y2="292" stroke="#d79b91"/><text class="x" x="92" y="324">直觉修法:</text><text class="x" x="92" y="348">“请不要编造,</text><text class="x" x="92" y="372">请认真一点。”</text><rect class="box" x="334" y="120" width="690" height="340" rx="10"/><rect class="ctx" x="370" y="152" width="184" height="72" rx="8"/><text class="h" x="404" y="181">1. 看 Context</text><text class="x" x="392" y="205">证据是否存在且可信?</text><rect class="prompt" x="604" y="152" width="184" height="72" rx="8"/><text class="h" x="640" y="181">2. 看 Action</text><text class="x" x="628" y="205">意图和参数是否合理?</text><rect class="har" x="838" y="152" width="150" height="72" rx="8"/><text class="h" x="868" y="181">3. 看 Harness</text><text class="x" x="858" y="205">是否拦截非法?</text><rect class="har" x="488" y="306" width="184" height="72" rx="8"/><text class="h" x="526" y="335">4. 看 State</text><text class="x" x="510" y="359">失败是否写成事实?</text><rect class="loop" x="722" y="306" width="184" height="72" rx="8"/><text class="h" x="762" y="335">5. 看 Loop</text><text class="x" x="746" y="359">下一轮是否改变策略?</text><path class="a" d="M274 276C310 234 334 198 370 188M554 188H604M788 188H838M914 224C886 272 832 306 814 306M722 342H672"/><rect class="tag" x="382" y="424" width="210" height="28" rx="6"/><text class="m" x="412" y="443">优先修证据和校验</text><rect class="tag" x="660" y="424" width="230" height="28" rx="6"/><text class="m" x="692" y="443">再修进展检测和停止</text><rect class="box" x="130" y="472" width="860" height="42" rx="8"/><text class="x" x="158" y="498">结论: Prompt 能改善表达,但不能补证据、不能授权执行、不能保证状态真实、也不能让循环自动收敛。</text></svg>
