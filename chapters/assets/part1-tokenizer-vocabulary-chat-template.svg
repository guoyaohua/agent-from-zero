<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="680" viewBox="0 0 1220 680" role="img" aria-labelledby="title desc"><title id="title">Tokenizer、词表与 Chat Template</title><desc id="desc">展示文本如何经过规范化、切分、词表映射、Chat Template 和特殊 token 进入模型,以及它对 RAG、工具调用和安全的影响。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.e{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#arrow)}.warn{fill:#172033}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1220" height="680"/><text class="title" x="54" y="58">Tokenizer 是模型入口层,不是无关预处理</text><text class="sub" x="54" y="86">文本先变成 token ID,再进入 embedding;Chat Template 决定多轮消息和工具边界如何被模型看见。</text><g transform="translate(58,130)"><rect class="a" x="0" y="0" width="170" height="92" rx="8"/><text class="h" x="34" y="30">Raw Text</text><text class="t" x="20" y="56">中文 / English / JSON</text><text class="s" x="20" y="76">空格、换行、Unicode</text><path class="line" d="M170 46H220"/><rect class="b" x="220" y="0" width="170" height="92" rx="8"/><text class="h" x="250" y="30">Normalize</text><text class="t" x="242" y="56">清理控制字符</text><text class="s" x="242" y="76">保留来源与 trust</text><path class="line" d="M390 46H440"/><rect class="c" x="440" y="0" width="170" height="92" rx="8"/><text class="h" x="485" y="30">Tokenize</text><text class="t" x="466" y="56">BPE / Unigram</text><text class="s" x="466" y="76">子词、字节、特殊符</text><path class="line" d="M610 46H660"/><rect class="d" x="660" y="0" width="170" height="92" rx="8"/><text class="h" x="704" y="30">Vocab IDs</text><text class="t" x="684" y="56">[15836, 18932...]</text><text class="s" x="684" y="76">必须匹配模型版本</text><path class="line" d="M830 46H880"/><rect class="e" x="880" y="0" width="170" height="92" rx="8"/><text class="h" x="918" y="30">Embedding</text><text class="t" x="910" y="56">ID 查表成向量</text><text class="s" x="910" y="76">进入 Transformer</text></g><g transform="translate(72,272)"><rect class="box" x="0" y="0" width="310" height="160" rx="8"/><text class="h" x="24" y="30">Chat Template</text><text class="t" x="24" y="58">messages 并不会原样进入模型</text><text class="t" x="24" y="84">system/user/assistant/tool 会被模板包装</text><text class="t" x="24" y="110">换模型时要锁定 tokenizer + template</text><text class="s" x="24" y="138">错误模板会破坏角色边界和工具格式</text><rect class="box" x="350" y="0" width="310" height="160" rx="8"/><text class="h" x="374" y="30">Token Budget</text><text class="t" x="374" y="58">正文、历史、schema、证据、输出都占 token</text><text class="t" x="374" y="84">RAG chunk 应记录 token_len</text><text class="t" x="374" y="110">JSON 和表格成本常被低估</text><text class="s" x="374" y="138">不要用页数或字数估算上下文</text><rect class="box" x="700" y="0" width="310" height="160" rx="8"/><text class="h" x="724" y="30">Special Tokens</text><text class="t" x="724" y="58">BOS/EOS、role、tool、image/audio</text><text class="t" x="724" y="84">有些模型区分 reasoning 与 answer</text><text class="t" x="724" y="110">用户内容不得伪造边界 token</text><text class="s" x="724" y="138">安全边界仍由 runtime 执行</text></g><g transform="translate(84,500)"><rect class="a" x="0" y="0" width="210" height="74" rx="8"/><text class="h" x="24" y="30">RAG</text><text class="t" x="24" y="54">chunk 长度、证据预算</text><rect class="b" x="246" y="0" width="210" height="74" rx="8"/><text class="h" x="270" y="30">Tools</text><text class="t" x="270" y="54">schema 成本、参数 token</text><rect class="c" x="492" y="0" width="210" height="74" rx="8"/><text class="h" x="516" y="30">Structured Output</text><text class="t" x="516" y="54">枚举、括号、字段边界</text><rect class="d" x="738" y="0" width="210" height="74" rx="8"/><text class="h" x="762" y="30">Security</text><text class="t" x="762" y="54">Unicode、注入、边界混淆</text></g><rect class="warn" x="202" y="606" width="816" height="42" rx="8"/><text x="236" y="632" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">迁移模型时同时验证 tokenizer、chat template、特殊 token、工具格式和 token 预算。</text></svg>
