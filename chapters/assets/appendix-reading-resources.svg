<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620" role="img" aria-labelledby="title desc"><title id="title">延伸阅读路线</title><desc id="desc">展示延伸阅读如何从资料选择进入实验、评估、复盘和回流,并覆盖模型、RAG、Agent、协议、安全和反馈学习方向。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.n5{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.gray{fill:#eef3f8;stroke:#cbd5e1;stroke-width:1.2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}.loop{fill:none;stroke:#b05c37;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1220" height="620"/><text class="title" x="56" y="58">延伸阅读不是收藏资料,而是制造可验证改进</text><text class="sub" x="56" y="86">每读一个方向,都要落成一个实验、一个评估样本、一个失败复盘或一个系统设计约束。</text>
  <rect class="panel" x="56" y="124" width="1108" height="226" rx="10"/>
  <rect class="n" x="96" y="176" width="156" height="76" rx="8"/><text class="h" x="138" y="204">Read</text><text class="t" x="122" y="226">论文 / 文档 / model card</text><text class="s" x="122" y="244">先看前提和边界</text>
  <rect class="n2" x="316" y="176" width="156" height="76" rx="8"/><text class="h" x="356" y="204">Build</text><text class="t" x="342" y="226">小实验 / 原型</text><text class="s" x="342" y="244">只改一个变量</text>
  <rect class="n3" x="536" y="176" width="156" height="76" rx="8"/><text class="h" x="578" y="204">Evaluate</text><text class="t" x="562" y="226">样本 / trace / 指标</text><text class="s" x="562" y="244">baseline vs candidate</text>
  <rect class="n4" x="756" y="176" width="156" height="76" rx="8"/><text class="h" x="798" y="204">Diagnose</text><text class="t" x="782" y="226">失败归因</text><text class="s" x="782" y="244">模型/上下文/工具/Loop</text>
  <rect class="n5" x="976" y="176" width="138" height="76" rx="8"/><text class="h" x="1016" y="204">Adopt</text><text class="t" x="1002" y="226">策略 / 回归</text><text class="s" x="1002" y="244">进入工程规范</text>
  <path class="arrow" d="M252 214H316"/><path class="arrow" d="M472 214H536"/><path class="arrow" d="M692 214H756"/><path class="arrow" d="M912 214H976"/>
  <path class="loop" d="M1045 252C1020 318 214 318 174 252"/>
  <text class="s" x="492" y="320">线上失败和新资料会回到下一轮阅读与实验</text>
  <rect class="panel" x="56" y="386" width="1108" height="164" rx="10"/>
  <text class="h" x="86" y="418">阅读锚点与对应实验</text>
  <rect class="gray" x="86" y="442" width="238" height="72" rx="8"/><text class="h" x="110" y="466">模型与推理优化</text><text class="t" x="110" y="488">MoE / KV / Flash / TTC</text><text class="s" x="110" y="506">测 p95 延迟、吞吐、成本和质量</text>
  <rect class="gray" x="348" y="442" width="238" height="72" rx="8"/><text class="h" x="372" y="466">RAG 与知识</text><text class="t" x="372" y="488">Hybrid / Rerank / GraphRAG</text><text class="s" x="372" y="506">测 recall、引用准确和拒答质量</text>
  <rect class="gray" x="610" y="442" width="238" height="72" rx="8"/><text class="h" x="634" y="466">Agent 与协议</text><text class="t" x="634" y="488">Harness / Loop / MCP / A2A</text><text class="s" x="634" y="506">测工具成功率和恢复能力</text>
  <rect class="gray" x="872" y="442" width="238" height="72" rx="8"/><text class="h" x="896" y="466">安全与反馈学习</text><text class="t" x="896" y="488">Injection / Eval / Agentic RL</text><text class="s" x="896" y="506">测攻击覆盖、奖励投机和轨迹隐私</text>
</svg>
