<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Agent 采用风险账本</title><desc id="desc">列出引入 Agent 前需要管理的成本、时间、权限、质量、循环和审计风险,以及对应的最低控制面。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.risk{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.6}.ctrl{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.tag{fill:#172033}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">引入 Agent 前,先写清楚风险账本</text><text class="s" x="56" y="86">每一种自动化收益,都要有对应的控制面来限制成本、权限、循环和审计风险。</text><rect class="box" x="70" y="126" width="980" height="430" rx="12"/><rect class="tag" x="102" y="152" width="190" height="30" rx="6"/><text class="m" x="164" y="172">风险</text><rect class="tag" x="332" y="152" width="300" height="30" rx="6"/><text class="m" x="428" y="172">典型问题</text><rect class="tag" x="672" y="152" width="330" height="30" rx="6"/><text class="m" x="772" y="172">最低控制面</text><rect class="risk" x="102" y="204" width="190" height="44" rx="7"/><text class="h" x="154" y="232">成本风险</text><text class="x" x="352" y="232">多轮调用不可控</text><text class="x" x="694" y="232">最大轮数、token 预算、模型路由</text><rect class="risk" x="102" y="264" width="190" height="44" rx="7"/><text class="h" x="154" y="292">时间风险</text><text class="x" x="352" y="292">用户等待过长</text><text class="x" x="694" y="292">流式反馈、异步任务、超时降级</text><rect class="risk" x="102" y="324" width="190" height="44" rx="7"/><text class="h" x="154" y="352">权限风险</text><text class="x" x="352" y="352">读写不该碰的数据</text><text class="x" x="694" y="352">最小权限、租户隔离、确认门</text><rect class="risk" x="102" y="384" width="190" height="44" rx="7"/><text class="h" x="154" y="412">质量风险</text><text class="x" x="352" y="412">结果合理但不可验证</text><text class="x" x="694" y="412">测试、引用校验、评估样本</text><rect class="risk" x="102" y="444" width="190" height="44" rx="7"/><text class="h" x="154" y="472">循环风险</text><text class="x" x="352" y="472">重复搜索和重复调用</text><text class="x" x="694" y="472">无进展检测、停止条件、重规划</text><rect class="risk" x="102" y="504" width="190" height="44" rx="7"/><text class="h" x="154" y="532">审计风险</text><text class="x" x="352" y="532">出错后不知道发生什么</text><text class="x" x="694" y="532">trace、action log、artifact 引用</text><path class="a" d="M292 226H332M292 286H332M292 346H332M292 406H332M292 466H332M292 526H332"/><rect class="ctrl" x="198" y="586" width="724" height="34" rx="8"/><text class="x" x="226" y="608">控制面结论: 没有预算、权限、验证、停止和审计的 Agent,不是智能更强,只是风险更难看见。</text></svg>
