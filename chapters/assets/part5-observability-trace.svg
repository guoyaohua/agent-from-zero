<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent 可观测性 Trace</title>
  <desc id="desc">展示 Agent 从用户请求、上下文构建、模型调用、工具调用、状态更新到最终输出的 trace 链路。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="600"/><text class="title" x="56" y="58">可观测性: 让 Agent 的每一步都能复盘</text><text class="sub" x="56" y="86">不要只看最终答案,要记录上下文、模型、工具、状态、成本、延迟和安全决策。</text>
  <g transform="translate(0,-81)">
  <rect class="blue" x="68" y="220" width="130" height="64" rx="8"/><text class="head" x="106" y="248">User</text><text class="small" x="93" y="270">目标和约束</text>
  <rect class="green" x="244" y="220" width="150" height="64" rx="8"/><text class="head" x="274" y="248">Context Pack</text><text class="small" x="270" y="270">状态/证据/工具</text>
  <rect class="orange" x="440" y="220" width="130" height="64" rx="8"/><text class="head" x="480" y="248">Model</text><text class="small" x="474" y="270">推理和调用</text>
  <rect class="purple" x="616" y="220" width="130" height="64" rx="8"/><text class="head" x="662" y="248">Tool</text><text class="small" x="648" y="270">外部观察</text>
  <rect class="green" x="792" y="220" width="130" height="64" rx="8"/><text class="head" x="831" y="248">State</text><text class="small" x="822" y="270">更新任务视图</text>
  <rect class="blue" x="968" y="220" width="102" height="64" rx="8"/><text class="head" x="992" y="248">Output</text><text class="small" x="990" y="270">答案/动作</text>
  <path class="arrow" d="M198 252 H244"/><path class="arrow" d="M394 252 H440"/><path class="arrow" d="M570 252 H616"/><path class="arrow" d="M746 252 H792"/><path class="arrow" d="M922 252 H968"/>
  <rect class="panel" x="96" y="384" width="928" height="152" rx="8"/><text class="head" x="132" y="422">Trace Store</text><text class="text" x="132" y="454">span_id、parent_id、inputs、outputs、token、latency、cost、tool args、arg sources、errors、policy decisions、artifacts</text><text class="text" x="132" y="486">调试问题时先定位是哪一层坏了: 上下文、模型、工具、状态、权限、评估还是用户目标。</text>
  <path class="arrow" d="M133 284 V384"/><path class="arrow" d="M319 284 V384"/><path class="arrow" d="M505 284 V384"/><path class="arrow" d="M681 284 V384"/><path class="arrow" d="M857 284 V384"/><path class="arrow" d="M1019 284 V384"/>
  <rect class="red" x="362" y="572" width="396" height="58" rx="8"/><text class="head" x="476" y="606">No Trace = No Debugging</text>

  </g>
</svg>

