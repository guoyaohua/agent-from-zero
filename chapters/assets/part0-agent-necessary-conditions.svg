<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">AI Agent 的必要条件判定器</title><desc id="desc">展示目标、可观察状态、可执行动作和反馈循环四个必要条件,用于判断一个系统是否真正是 AI Agent。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.8}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.8}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.8}.tag{fill:#172033}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="600"/><text class="t" x="56" y="58">判断一个系统是不是 Agent,先看四个必要条件</text><text class="s" x="56" y="86">工具调用不是充分条件;目标、状态、动作和反馈必须共同形成受控循环。</text><rect class="p" x="88" y="156" width="210" height="96" rx="10"/><text class="h" x="158" y="188">Goal</text><text class="x" x="118" y="216">要推进到什么状态?</text><text class="x" x="118" y="238">成功标准是什么?</text><rect class="g" x="332" y="156" width="210" height="96" rx="10"/><text class="h" x="382" y="188">Observable State</text><text class="x" x="362" y="216">当前知道什么?</text><text class="x" x="362" y="238">进度和事实在哪里?</text><rect class="o" x="576" y="156" width="210" height="96" rx="10"/><text class="h" x="632" y="188">Action Space</text><text class="x" x="606" y="216">能调用哪些工具?</text><text class="x" x="606" y="238">动作如何被校验?</text><rect class="v" x="820" y="156" width="210" height="96" rx="10"/><text class="h" x="872" y="188">Feedback Loop</text><text class="x" x="850" y="216">结果是否更新状态?</text><text class="x" x="850" y="238">下一步是否会改变?</text><path class="a" d="M298 204H332M542 204H576M786 204H820"/><rect class="box" x="132" y="330" width="856" height="112" rx="12"/><text class="h" x="174" y="364">缺失时的退化</text><text class="x" x="174" y="396">无目标: 聊天或内容生成</text><text class="x" x="384" y="396">无状态: 一次性问答</text><text class="x" x="594" y="396">无动作: 建议生成器</text><text class="x" x="804" y="396">无反馈: 静态流程</text><rect class="bad" x="230" y="482" width="660" height="46" rx="8"/><text class="x" x="264" y="510">关键判断: 工具结果如果不会影响下一步,它只是工具增强;只有反馈改变状态和决策,才是 Agent 循环。</text></svg>
