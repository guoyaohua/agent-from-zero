<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">训练、Prefill 与 Decode 数据流</title>
  <desc id="desc">对比 Transformer 训练并行计算、推理 prefill 处理完整 prompt、decode 阶段逐 token 生成和读取 KV Cache 的不同瓶颈。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="640" />
  <text class="title" x="48" y="52">训练、Prefill、Decode 是三种不同数据流</text>
  <text class="sub" x="48" y="78">同一个 Transformer,在训练和推理阶段的并行度、缓存和瓶颈完全不同。</text>
  <rect class="panel" x="48" y="112" width="1024" height="418" rx="8" />
  <rect class="blue" x="88" y="160" width="260" height="106" rx="8" />
  <text class="label" x="174" y="192">训练</text>
  <text class="small" x="118" y="220">完整序列并行预测多个位置</text>
  <text class="small" x="118" y="244">causal mask 防止看未来</text>
  <rect class="green" x="430" y="160" width="260" height="106" rx="8" />
  <text class="label" x="524" y="192">Prefill</text>
  <text class="small" x="460" y="220">一次处理完整 prompt</text>
  <text class="small" x="460" y="244">生成初始 KV Cache</text>
  <rect class="orange" x="772" y="160" width="260" height="106" rx="8" />
  <text class="label" x="868" y="192">Decode</text>
  <text class="small" x="802" y="220">每步生成新 token</text>
  <text class="small" x="802" y="244">读取并追加 KV Cache</text>
  <path class="arrow" d="M348 213 H430" />
  <path class="arrow" d="M690 213 H772" />
  <rect class="red" x="120" y="354" width="228" height="86" rx="8" />
  <text class="label" x="158" y="386">训练瓶颈</text>
  <text class="small" x="150" y="412">激活显存、反向传播、长序列 IO</text>
  <rect class="red" x="444" y="354" width="228" height="86" rx="8" />
  <text class="label" x="482" y="386">Prefill 瓶颈</text>
  <text class="small" x="474" y="412">首 token 延迟、长 prompt attention</text>
  <rect class="red" x="768" y="354" width="228" height="86" rx="8" />
  <text class="label" x="806" y="386">Decode 瓶颈</text>
  <text class="small" x="798" y="412">自回归串行、KV 读取、调度</text>
  <rect class="panel" x="72" y="558" width="976" height="42" rx="8" />
  <text class="text" x="98" y="584">读图方式: FlashAttention、KV Cache、连续批处理分别命中不同阶段,不要把所有推理慢都归为一个原因。</text>
</svg>
