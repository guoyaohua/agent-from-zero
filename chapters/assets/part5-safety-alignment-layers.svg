<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">安全与对齐分层</title>
  <desc id="desc">展示 Agent 安全从模型行为、系统指令、工具权限、数据边界、用户确认和审计组成的分层防线。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.layer1{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.layer2{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.layer3{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.layer4{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.layer5{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}</style></defs>
  <rect class="bg" width="1120" height="700"/><text class="title" x="56" y="58">安全与对齐: 不靠单点防线</text><text class="sub" x="56" y="86">Agent 安全需要模型、上下文、工具、数据、确认、监控和组织流程共同工作。</text>
  <rect class="layer1" x="170" y="154" width="780" height="62" rx="8"/><text class="head" x="462" y="192">User Intent &amp; Policy</text>
  <rect class="layer2" x="210" y="236" width="700" height="62" rx="8"/><text class="head" x="462" y="274">System Instructions</text>
  <rect class="layer3" x="250" y="318" width="620" height="62" rx="8"/><text class="head" x="460" y="356">Context Isolation</text>
  <rect class="layer4" x="290" y="400" width="540" height="62" rx="8"/><text class="head" x="468" y="438">Tool Permissions</text>
  <rect class="layer5" x="330" y="482" width="460" height="62" rx="8"/><text class="head" x="470" y="520">Human Confirmation</text>
  <rect class="panel" x="210" y="584" width="700" height="70" rx="8"/><text class="head" x="470" y="616">Audit &amp; Incident Response</text><text class="text" x="308" y="642">trace、策略决策、用户确认、异常检测、回滚和复盘。</text>
</svg>
