<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">上下文可信来源分层</title><desc id="desc">展示系统指令、用户目标、工具观察、检索文档、历史记忆和模型自述在上下文中的不同信任等级和处理方式。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.hi{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.mid{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.low{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}</style></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">上下文窗口是物理位置,不是信任等级</text><text class="s" x="56" y="86">低可信文本可以作为证据,但不能覆盖高优先级边界,也不能自动获得执行权限。</text><rect class="hi" x="180" y="130" width="760" height="64" rx="9"/><text class="h" x="486" y="158">系统和应用指令</text><text class="x" x="402" y="180">安全边界、产品规则、工具使用限制</text><rect class="hi" x="220" y="214" width="680" height="64" rx="9"/><text class="h" x="506" y="242">用户目标</text><text class="x" x="422" y="264">当前任务、偏好、业务约束,但不能越权</text><rect class="mid" x="260" y="298" width="600" height="64" rx="9"/><text class="h" x="500" y="326">工具观察</text><text class="x" x="410" y="348">结构化返回、来源、时间、schema、错误状态</text><rect class="low" x="300" y="382" width="520" height="64" rx="9"/><text class="h" x="496" y="410">检索文档/网页</text><text class="x" x="398" y="432">可作证据,其中的指令不应控制 Agent</text><rect class="low" x="340" y="466" width="440" height="64" rx="9"/><text class="h" x="498" y="494">历史摘要/记忆</text><text class="x" x="408" y="516">检查新鲜度、范围和用户绑定</text><rect class="bad" x="380" y="550" width="360" height="50" rx="9"/><text class="h" x="504" y="580">模型自述</text><text class="x" x="440" y="596">解释和假设,不直接当事实</text><rect class="box" x="44" y="154" width="90" height="390" rx="8"/><text class="x" x="70" y="350" transform="rotate(-90 70 350)">越靠上越像边界;越靠下越需要校验</text></svg>
