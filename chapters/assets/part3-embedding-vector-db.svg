<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">Embedding 与向量数据库</title>
  <desc id="desc">展示查询和文档经过 embedding 模型成为向量,再由向量数据库结合元数据过滤和 ANN 搜索返回候选。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}.q{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.doc{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.emb{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.db{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.warn{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="590"/><text class="title" x="56" y="58">Embedding + Vector DB: 候选生成,不是事实裁判</text><text class="sub" x="56" y="86">向量库负责高效找相似候选,质量还取决于模型、切块、元数据、索引参数、混合检索和重排。</text>
  <g transform="translate(0,-23)">
  <rect class="q" x="86" y="162" width="190" height="66" rx="8"/><text class="head" x="148" y="190">Query</text><text class="text" x="116" y="212">用户问题或改写查询</text>
  <rect class="doc" x="86" y="380" width="190" height="66" rx="8"/><text class="head" x="124" y="408">Document chunks</text><text class="text" x="116" y="430">带来源和元数据的片段</text>
  <rect class="emb" x="378" y="258" width="200" height="86" rx="8"/><text class="head" x="414" y="292">Embedding Model</text><text class="mono" x="420" y="320">text -> vector</text>
  <path class="arrow" d="M276 195 C340 195 340 284 378 284"/><path class="arrow" d="M276 413 C340 413 340 320 378 320"/>
  <rect class="db" x="694" y="170" width="272" height="250" rx="8"/><text class="head" x="768" y="206">Vector Database</text><text class="text" x="732" y="242">ANN search: top-k similar vectors</text><text class="text" x="732" y="270">metadata filter: scope/version/permission</text><text class="text" x="732" y="298">distance metric: cosine/dot/L2</text><text class="text" x="732" y="326">index params affect recall</text><text class="text" x="732" y="354">returns candidates, not final truth</text>
  <path class="arrow" d="M578 301 H694"/>
  <rect class="warn" x="694" y="474" width="272" height="82" rx="8"/><text class="head" x="754" y="508">常见误判</text><text class="text" x="732" y="534">相似 ≠ 正确,top-k 还需重排和证据校验</text>
  <text class="mono" x="132" y="560">query vector and document vectors must come from the same embedding space/version</text>

  </g>
</svg>
