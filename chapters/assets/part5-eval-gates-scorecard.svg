<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Baseline 与 Candidate 的上线门禁记分卡</title>
  <desc id="desc">展示评估应按 smoke、safety、golden、cost 和关键标签比较 baseline 与 candidate,而不是只看总平均分。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1}.pass{fill:#e7f1ee}.warn{fill:#fff0e6}.fail{fill:#f7d9df}.gate{fill:#ece7f3;stroke:#7c5aa6;stroke-width:1.8}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">上线不是看平均分,而是看关键门禁有没有退化</text>
  <text class="sub" x="56" y="82">Baseline/Candidate 比较要分层、分标签、分红线。</text>
  <text class="head" x="116" y="136">评估层</text><text class="head" x="344" y="136">Baseline</text><text class="head" x="510" y="136">Candidate</text><text class="head" x="688" y="136">门禁</text><text class="head" x="866" y="136">动作</text>
  <g transform="translate(90 158)">
    <rect class="cell" x="0" y="0" width="200" height="44"/><text class="text" x="28" y="28">Smoke</text><rect class="cell pass" x="230" y="0" width="130" height="44"/><text class="text" x="276" y="28">100%</text><rect class="cell pass" x="400" y="0" width="130" height="44"/><text class="text" x="446" y="28">100%</text><rect class="cell" x="570" y="0" width="150" height="44"/><text class="text" x="602" y="28">必须全过</text><rect class="cell pass" x="750" y="0" width="160" height="44"/><text class="text" x="808" y="28">继续</text>
    <rect class="cell" x="0" y="58" width="200" height="44"/><text class="text" x="28" y="86">Safety</text><rect class="cell pass" x="230" y="58" width="130" height="44"/><text class="text" x="276" y="86">100%</text><rect class="cell fail" x="400" y="58" width="130" height="44"/><text class="text" x="446" y="86">98%</text><rect class="cell" x="570" y="58" width="150" height="44"/><text class="text" x="602" y="86">硬阻塞</text><rect class="cell fail" x="750" y="58" width="160" height="44"/><text class="text" x="796" y="86">禁止上线</text>
    <rect class="cell" x="0" y="116" width="200" height="44"/><text class="text" x="28" y="144">Golden by tag</text><rect class="cell pass" x="230" y="116" width="130" height="44"/><text class="text" x="266" y="144">89.2%</text><rect class="cell warn" x="400" y="116" width="130" height="44"/><text class="text" x="436" y="144">88.5%</text><rect class="cell" x="570" y="116" width="150" height="44"/><text class="text" x="590" y="144">关键 tag 不退化</text><rect class="cell warn" x="750" y="116" width="160" height="44"/><text class="text" x="790" y="144">人工复核</text>
    <rect class="cell" x="0" y="174" width="200" height="44"/><text class="text" x="28" y="202">P95 latency</text><rect class="cell pass" x="230" y="174" width="130" height="44"/><text class="text" x="270" y="202">8.4s</text><rect class="cell warn" x="400" y="174" width="130" height="44"/><text class="text" x="440" y="202">9.8s</text><rect class="cell" x="570" y="174" width="150" height="44"/><text class="text" x="596" y="202">+15% 内</text><rect class="cell warn" x="750" y="174" width="160" height="44"/><text class="text" x="800" y="202">看取舍</text>
  </g>
  <rect class="gate" x="198" y="426" width="724" height="40" rx="8"/><text class="head" x="250" y="451">硬门禁失败直接阻塞;软门禁进入人工取舍;平均分不能稀释安全退化。</text>
</svg>
