<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">GUI Agent 分层运行时</title><desc id="desc">展示 GUI Agent 从多模态观察、界面语义解析、动作策略、执行器到校验回写的分层运行时。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.b1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.b3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.b4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.b5{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.p{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">GUI Agent 不能从截图直接跳到点击</text><text class="s" x="56" y="86">可靠路径是把界面观察转成控件语义,再由策略门决定动作是否允许执行。</text><rect class="b1" x="70" y="180" width="180" height="96" rx="10"/><text class="h" x="118" y="216">Observation</text><text class="x" x="100" y="246">截图 / DOM / OCR</text><rect class="b2" x="295" y="180" width="180" height="96" rx="10"/><text class="h" x="348" y="216">UI Model</text><text class="x" x="325" y="246">控件、区域、状态</text><rect class="b3" x="520" y="180" width="180" height="96" rx="10"/><text class="h" x="576" y="216">Policy</text><text class="x" x="550" y="246">风险、权限、确认</text><rect class="b4" x="745" y="180" width="180" height="96" rx="10"/><text class="h" x="800" y="216">Action</text><text class="x" x="775" y="246">点击、输入、快捷键</text><rect class="b5" x="520" y="382" width="180" height="96" rx="10"/><text class="h" x="574" y="418">Verify</text><text class="x" x="550" y="448">截图校验 / 状态回写</text><path class="a" d="M250 228H295M475 228H520M700 228H745M835 276C810 346 720 382 700 430M520 430C420 430 330 352 385 276"/><rect class="p" x="130" y="540" width="860" height="46" rx="8"/><text class="h" x="160" y="569">工程要点</text><text class="x" x="250" y="569">越靠近真实点击,越需要确定性校验;稳定 GUI 流程应逐步沉淀成语义工具。</text></svg>
