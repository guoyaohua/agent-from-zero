<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 拆分账本</title>
  <desc id="desc">展示决定是否拆出一个 Agent 时,需要同时检查中间产物、上下文减负、工具隔离、评估方式和协调成本。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.txt{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.good{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:1.6}.warn{fill:#fff0e6;stroke:#b05c37;stroke-width:1.6}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="54" y="52">拆出一个 Agent 前,先写拆分账本</text>
  <text class="sub" x="54" y="80">角色不是按名字拆,而是按可交付、可隔离、可评估的边界拆。</text>
  <rect class="box" x="58" y="132" width="190" height="96" rx="8"/><text class="head" x="94" y="162">候选子任务</text><text class="txt" x="84" y="192">例如:检索证据</text><text class="small" x="84" y="214">不是“研究员”这个名字</text>
  <path class="arrow" d="M248 180 H294"/>
  <rect class="good" x="306" y="118" width="166" height="76" rx="8"/><text class="head" x="346" y="148">中间产物</text><text class="txt" x="332" y="174">schema 可消费</text>
  <rect class="good" x="496" y="118" width="166" height="76" rx="8"/><text class="head" x="536" y="148">上下文减负</text><text class="txt" x="522" y="174">少看无关材料</text>
  <rect class="good" x="686" y="118" width="166" height="76" rx="8"/><text class="head" x="726" y="148">工具隔离</text><text class="txt" x="712" y="174">权限更窄</text>
  <rect class="good" x="306" y="232" width="166" height="76" rx="8"/><text class="head" x="346" y="262">评估清晰</text><text class="txt" x="332" y="288">指标可单测</text>
  <rect class="warn" x="496" y="232" width="166" height="76" rx="8"/><text class="head" x="536" y="262">交接成本</text><text class="txt" x="522" y="288">摘要失真/等待</text>
  <rect class="warn" x="686" y="232" width="166" height="76" rx="8"/><text class="head" x="726" y="262">状态成本</text><text class="txt" x="712" y="288">同步/冲突</text>
  <path class="arrow" d="M852 214 H906"/>
  <rect class="box" x="918" y="152" width="150" height="124" rx="8"/><text class="head" x="958" y="182">决策</text><text class="txt" x="950" y="212">收益明显:拆</text><text class="txt" x="950" y="238">收益模糊:不拆</text><text class="txt" x="950" y="264">只换名字:删</text>
  <rect class="bad" x="154" y="370" width="812" height="62" rx="8"/><text class="head" x="224" y="398">反模式</text><text class="txt" x="322" y="398">两个 Agent 看同样上下文、用同样工具、输出同样文本,只是把一次调用拆成两次。</text>
  <text class="small" x="338" y="424">拆分账本应进入架构评审: why split, output schema, tool boundary, eval metric, rollback path。</text>
</svg>
