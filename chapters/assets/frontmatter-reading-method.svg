<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">阅读方法</title>
  <desc id="desc">展示阅读每章时从问题、机制、失败、评估四个角度建立工程判断。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 18px system-ui;fill:#172033}.text{font:400 13px system-ui;fill:#435066}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="280"/><text class="title" x="56" y="58">每章读完问四个问题</text><text class="sub" x="56" y="86">把知识从名词变成工程判断,关键是理解问题、前提、失败和修正。</text>
  <g transform="translate(0,-105)">
  <rect class="a" x="122" y="240" width="170" height="78" rx="8"/><text class="head" x="166" y="272">问题</text><text class="text" x="152" y="294">解决什么</text>
  <rect class="b" x="352" y="240" width="170" height="78" rx="8"/><text class="head" x="396" y="272">机制</text><text class="text" x="382" y="294">依赖什么</text>
  <rect class="c" x="582" y="240" width="170" height="78" rx="8"/><text class="head" x="626" y="272">失败</text><text class="text" x="612" y="294">会怎样坏</text>
  <rect class="d" x="812" y="240" width="170" height="78" rx="8"/><text class="head" x="856" y="272">评估</text><text class="text" x="842" y="294">如何修正</text>
  <path class="arrow" d="M292 279 H352"/><path class="arrow" d="M522 279 H582"/><path class="arrow" d="M752 279 H812"/>
  </g>
</svg>

