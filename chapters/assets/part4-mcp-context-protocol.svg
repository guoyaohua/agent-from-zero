<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">MCP 模型上下文协议</title>
  <desc id="desc">展示 MCP 中 Host、Client、Server 之间的关系,以及工具、资源、提示模板和权限边界。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}.dash{fill:none;stroke:#b13c52;stroke-width:2;stroke-dasharray:6 5}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">MCP: 给模型接入外部上下文和能力的标准接口</text><text class="sub" x="56" y="86">MCP 关注 Host 如何通过 Client 连接 Server,把工具、资源和提示能力以统一方式暴露给模型应用。</text>
  <rect class="blue" x="86" y="210" width="226" height="156" rx="8"/><text class="head" x="150" y="248">Host</text><text class="text" x="126" y="280">IDE / 桌面应用 / Agent 平台</text><text class="text" x="126" y="306">拥有用户界面和模型会话</text><text class="text" x="126" y="332">负责权限和用户确认</text>
  <rect class="orange" x="448" y="226" width="226" height="124" rx="8"/><text class="head" x="510" y="264">MCP Client</text><text class="text" x="488" y="296">协议连接和能力发现</text><text class="text" x="488" y="322">为每个 Server 维护会话</text>
  <rect class="green" x="810" y="170" width="226" height="236" rx="8"/><text class="head" x="870" y="208">MCP Server</text><text class="text" x="850" y="240">Tools: 可调用动作</text><text class="text" x="850" y="268">Resources: 可读取上下文</text><text class="text" x="850" y="296">Prompts: 可复用模板</text><text class="text" x="850" y="324">Sampling/Roots 等能力视实现而定</text><text class="small" x="850" y="360">Server 通常封装文件、数据库、API 或领域系统</text>
  <path class="arrow" d="M312 288 H448"/><path class="arrow" d="M674 288 H810"/>
  <rect class="panel" x="124" y="476" width="872" height="92" rx="8"/><text class="head" x="160" y="512">安全边界</text><text class="text" x="160" y="542">模型看到能力描述,但工具执行、资源访问、敏感数据注入和高风险动作确认应由 Host/runtime 控制。</text><path class="dash" d="M810 424 C690 620 418 620 312 424"/>
  <text class="small" x="156" y="614">MCP 不是 Agent 框架本身,而是把外部能力接入模型应用的协议层。</text>
</svg>

