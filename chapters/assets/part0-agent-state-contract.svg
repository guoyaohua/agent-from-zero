<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Agent 状态契约</title><desc id="desc">展示 Agent 状态应区分目标约束、已验证事实、假设计划、动作观察和外部产物,而不是只保存聊天记录。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.4px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.core{fill:#fff;stroke:#172033;stroke-width:1.6}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}.tag{fill:#172033}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">Agent 状态是一份任务账本,不是聊天记录的别名</text><text class="s" x="56" y="86">系统要把事实、假设、动作、观察和产物分开保存,才能判断进展、恢复和审计。</text><rect class="core" x="430" y="220" width="260" height="132" rx="14"/><text class="h" x="504" y="256">Task State</text><text class="x" x="464" y="286">由 runtime 维护</text><text class="x" x="464" y="310">进入 Context 前压缩成工作视图</text><rect class="p" x="90" y="142" width="250" height="92" rx="10"/><text class="h" x="142" y="174">目标和约束</text><text class="x" x="120" y="202">goal、success criteria、limits</text><rect class="g" x="780" y="142" width="250" height="92" rx="10"/><text class="h" x="838" y="174">已验证事实</text><text class="x" x="810" y="202">observations、sources、confidence</text><rect class="o" x="90" y="382" width="250" height="92" rx="10"/><text class="h" x="142" y="414">假设和计划</text><text class="x" x="120" y="442">hypotheses、plan_version、ruled_out</text><rect class="v" x="780" y="382" width="250" height="92" rx="10"/><text class="h" x="838" y="414">动作和产物</text><text class="x" x="810" y="442">actions、artifacts、trace refs</text><path class="a" d="M340 188C410 205 430 230 430 260M780 188C710 205 690 230 690 260M340 428C410 410 430 370 456 352M780 428C710 410 690 370 664 352"/><rect class="box" x="188" y="520" width="744" height="44" rx="8"/><text class="x" x="224" y="547">状态更新规则: 模型可以提出假设,但只有工具、校验或用户确认支持的内容才能进入 verified facts 或 done。</text></svg>
