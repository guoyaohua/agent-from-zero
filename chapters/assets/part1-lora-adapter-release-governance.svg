<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 适配器发布治理</title>
  <desc id="desc">展示 LoRA 适配器从训练数据、超参数、基础模型组合、评估门禁到发布回滚的治理流程。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.b{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.c{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.d{fill:#f7d9df;stroke:#b13c52;stroke-width:1.7}.bar{fill:#172033}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">LoRA 降低训练成本,不降低版本治理成本</text>
  <text class="sub" x="56" y="82">每个 base + adapter 组合都应视为独立模型候选。</text>
  <g transform="translate(78 128)">
    <rect class="box a" x="0" y="0" width="170" height="78" rx="8"/><text class="head" x="36" y="30">Data version</text><text class="small" x="26" y="56">样本桶 + 清洗规则</text>
    <path class="arrow" d="M170 39 H212"/>
    <rect class="box b" x="212" y="0" width="170" height="78" rx="8"/><text class="head" x="250" y="30">Adapter config</text><text class="small" x="240" y="56">rank / alpha / target</text>
    <path class="arrow" d="M382 39 H424"/>
    <rect class="box a" x="424" y="0" width="170" height="78" rx="8"/><text class="head" x="468" y="30">Base model</text><text class="small" x="452" y="56">tokenizer / instruct / safety</text>
    <path class="arrow" d="M594 39 H636"/>
    <rect class="box c" x="636" y="0" width="170" height="78" rx="8"/><text class="head" x="680" y="30">Eval gates</text><text class="small" x="664" y="56">目标 + 回归 + 安全</text>
    <path class="arrow" d="M806 39 H848"/>
    <rect class="box d" x="848" y="0" width="170" height="78" rx="8"/><text class="head" x="894" y="30">Release</text><text class="small" x="876" y="56">灰度 / 回滚 / A/B</text>
  </g>
  <g transform="translate(110 260)">
    <rect class="box" x="0" y="0" width="275" height="86" rx="8"/><text class="head" x="28" y="30">组合不可默认迁移</text><text class="small" x="28" y="58">base:v1 + adapter:v3 通过</text><text class="small" x="28" y="76">不代表 base:v2 + adapter:v3 通过</text>
    <rect class="box" x="320" y="0" width="275" height="86" rx="8"/><text class="head" x="348" y="30">合并与动态加载</text><text class="small" x="348" y="58">合并适合固定任务</text><text class="small" x="348" y="76">动态加载适合多租户</text>
    <rect class="box" x="640" y="0" width="275" height="86" rx="8"/><text class="head" x="668" y="30">评估轨迹而非话术</text><text class="small" x="668" y="58">tool choice / recovery</text><text class="small" x="668" y="76">confirmation / no overuse</text>
  </g>
  <rect class="bar" x="166" y="442" width="788" height="36" rx="8"/>
  <text x="288" y="465" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">LoRA 的工程价值来自可插拔,工程风险也来自组合爆炸和评估遗漏。</text>
</svg>
