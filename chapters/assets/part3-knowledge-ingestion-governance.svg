<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="680" viewBox="0 0 1220 680" role="img" aria-labelledby="title desc"><title id="title">知识入库、数据治理与 RAG 生命周期</title><desc id="desc">展示企业 RAG 的资料从数据源、权限快照、解析切块、元数据、索引发布到更新删除和评估监控的完整治理链路。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.e{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#arrow)}.dark{fill:#172033}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1220" height="680"/><text class="title" x="54" y="58">RAG 的上限由知识入库和数据治理决定</text><text class="sub" x="54" y="86">不是把文档丢进向量库,而是管理来源、权限、版本、解析、索引、删除传播和评估回归。</text><g transform="translate(50,130)"><rect class="a" x="0" y="0" width="155" height="92" rx="8"/><text class="h" x="38" y="30">Sources</text><text class="t" x="20" y="56">政策 / Wiki / 工单</text><text class="s" x="20" y="76">外部网页需标 trust</text><path class="line" d="M155 46H198"/><rect class="b" x="198" y="0" width="155" height="92" rx="8"/><text class="h" x="222" y="30">ACL Snapshot</text><text class="t" x="222" y="56">用户、租户、scope</text><text class="s" x="222" y="76">权限版本化</text><path class="line" d="M353 46H396"/><rect class="c" x="396" y="0" width="155" height="92" rx="8"/><text class="h" x="432" y="30">Parse</text><text class="t" x="418" y="56">标题、表格、页码</text><text class="s" x="418" y="76">保留结构</text><path class="line" d="M551 46H594"/><rect class="d" x="594" y="0" width="155" height="92" rx="8"/><text class="h" x="632" y="30">Chunk</text><text class="t" x="616" y="56">语义完整</text><text class="s" x="616" y="76">记录 token_len</text><path class="line" d="M749 46H792"/><rect class="e" x="792" y="0" width="155" height="92" rx="8"/><text class="h" x="824" y="30">Metadata</text><text class="t" x="814" y="56">来源/版本/生效日</text><text class="s" x="814" y="76">parser/chunker 版本</text><path class="line" d="M947 46H990"/><rect class="a" x="990" y="0" width="155" height="92" rx="8"/><text class="h" x="1030" y="30">Index</text><text class="t" x="1012" y="56">embedding + BM25</text><text class="s" x="1012" y="76">发布可回滚</text></g><g transform="translate(70,284)"><rect class="box" x="0" y="0" width="256" height="154" rx="8"/><text class="h" x="24" y="30">治理字段</text><text class="t" x="24" y="58">source_id / source_uri</text><text class="t" x="24" y="82">version / effective_at</text><text class="t" x="24" y="106">acl_hash / trust_level</text><text class="t" x="24" y="130">embedding_model / index_version</text><rect class="box" x="296" y="0" width="256" height="154" rx="8"/><text class="h" x="320" y="30">更新删除</text><text class="t" x="320" y="58">旧 chunk tombstone</text><text class="t" x="320" y="82">重建 embedding</text><text class="t" x="320" y="106">缓存和摘要失效</text><text class="t" x="320" y="130">记忆与图谱边删除传播</text><rect class="box" x="592" y="0" width="256" height="154" rx="8"/><text class="h" x="616" y="30">发布门禁</text><text class="t" x="616" y="58">解析保真测试</text><text class="t" x="616" y="82">检索 recall@k</text><text class="t" x="616" y="106">权限过滤测试</text><text class="t" x="616" y="130">引用回源和旧版冲突</text><rect class="box" x="888" y="0" width="256" height="154" rx="8"/><text class="h" x="912" y="30">线上监控</text><text class="t" x="912" y="58">过期文档比例</text><text class="t" x="912" y="82">无来源 chunk 比例</text><text class="t" x="912" y="106">旧版本引用</text><text class="t" x="912" y="130">高失败 query 聚类</text></g><g transform="translate(170,500)"><rect class="b" x="0" y="0" width="210" height="74" rx="8"/><text class="h" x="24" y="30">Coverage</text><text class="t" x="24" y="54">正确资料是否入库</text><rect class="c" x="262" y="0" width="210" height="74" rx="8"/><text class="h" x="286" y="30">Retrieval</text><text class="t" x="286" y="54">正确 chunk 是否被召回</text><rect class="d" x="524" y="0" width="210" height="74" rx="8"/><text class="h" x="548" y="30">Governance</text><text class="t" x="548" y="54">权限、版本、删除传播</text><rect class="e" x="786" y="0" width="210" height="74" rx="8"/><text class="h" x="810" y="30">Faithfulness</text><text class="t" x="810" y="54">答案是否忠于证据</text></g><rect class="dark" x="192" y="610" width="836" height="38" rx="8"/><text x="236" y="634" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">知识库不是文件夹,而是一条可审计、可回滚、可删除传播的数据产品流水线。</text></svg>
