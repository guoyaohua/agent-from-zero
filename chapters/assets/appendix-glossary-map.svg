<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620" role="img" aria-labelledby="title desc"><title id="title">术语分类地图</title><desc id="desc">展示 Agent 术语如何按模型层、上下文层、运行时层、循环层、工程层和互操作层分类,并标注常见混淆边界。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.n5{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.gray{fill:#eef3f8;stroke:#cbd5e1;stroke-width:1.2}.line{fill:none;stroke:#94a3b8;stroke-width:1.8;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 6;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1220" height="620"/><text class="title" x="56" y="58">术语先分层,再讨论取舍</text><text class="sub" x="56" y="86">同一个词经常被误用到不同层。先判断它解决模型、上下文、运行时、循环、工程还是互操作问题。</text>
  <rect class="panel" x="56" y="124" width="1108" height="250" rx="10"/>
  <rect class="n" x="84" y="166" width="170" height="96" rx="8"/><text class="h" x="132" y="194">模型层</text><text class="t" x="108" y="218">Attention / MoE</text><text class="t" x="108" y="240">KV Cache / Flash</text><text class="s" x="108" y="258">能力与计算成本</text>
  <rect class="n3" x="284" y="166" width="170" height="96" rx="8"/><text class="h" x="330" y="194">上下文层</text><text class="t" x="308" y="218">Prompt / Context</text><text class="t" x="308" y="240">Evidence / Memory</text><text class="s" x="308" y="258">模型这一轮看见什么</text>
  <rect class="n4" x="484" y="166" width="170" height="96" rx="8"/><text class="h" x="530" y="194">运行时层</text><text class="t" x="508" y="218">Harness / Tool</text><text class="t" x="508" y="240">Policy / Trace</text><text class="s" x="508" y="258">动作如何被控制</text>
  <rect class="n2" x="684" y="166" width="170" height="96" rx="8"/><text class="h" x="732" y="194">循环层</text><text class="t" x="708" y="218">Agent Loop</text><text class="t" x="708" y="240">Planning / Budget</text><text class="s" x="708" y="258">多轮如何收敛</text>
  <rect class="n5" x="884" y="166" width="230" height="96" rx="8"/><text class="h" x="956" y="194">工程层</text><text class="t" x="912" y="218">Eval / Observability / Safety</text><text class="t" x="912" y="240">Cost / Guardrails / Injection</text><text class="s" x="912" y="258">上线后如何治理</text>
  <path class="line" d="M254 214H284"/><path class="line" d="M454 214H484"/><path class="line" d="M654 214H684"/><path class="line" d="M854 214H884"/>
  <rect class="gray" x="84" y="302" width="230" height="42" rx="8"/><text class="t" x="108" y="328">Test-time Compute: 预算资源</text>
  <rect class="gray" x="348" y="302" width="230" height="42" rx="8"/><text class="t" x="382" y="328">Agentic RAG: 证据缺口循环</text>
  <rect class="gray" x="612" y="302" width="230" height="42" rx="8"/><text class="t" x="650" y="328">MCP / A2A: 互操作边界</text>
  <rect class="gray" x="876" y="302" width="230" height="42" rx="8"/><text class="t" x="922" y="328">Agentic RL: 环境反馈</text>
  <path class="dash" d="M198 302V262"/><path class="dash" d="M463 302C440 274 420 262 394 262"/><path class="dash" d="M727 302C710 278 660 264 604 262"/><path class="dash" d="M991 302C910 280 814 264 770 262"/>
  <rect class="panel" x="56" y="410" width="1108" height="152" rx="10"/>
  <text class="h" x="84" y="442">易混边界</text>
  <rect class="n3" x="84" y="466" width="202" height="54" rx="8"/><text class="h" x="108" y="488">Prompt ≠ Context</text><text class="s" x="108" y="508">任务表达 vs 全部工作材料</text>
  <rect class="n4" x="314" y="466" width="202" height="54" rx="8"/><text class="h" x="338" y="488">Tool Call ≠ Harness</text><text class="s" x="338" y="508">动作表达 vs 执行控制</text>
  <rect class="n" x="544" y="466" width="202" height="54" rx="8"/><text class="h" x="568" y="488">MoE Router ≠ Model Router</text><text class="s" x="568" y="508">专家选择 vs 系统路由</text>
  <rect class="n3" x="774" y="466" width="202" height="54" rx="8"/><text class="h" x="798" y="488">RAG ≠ Memory</text><text class="s" x="798" y="508">外部证据 vs 经验状态</text>
  <rect class="n2" x="1004" y="466" width="132" height="54" rx="8"/><text class="h" x="1024" y="488">Loop ≠ while</text><text class="s" x="1024" y="508">状态、预算、停止</text>
</svg>
