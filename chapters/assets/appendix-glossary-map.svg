<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc"><title id="title">术语分类地图</title><desc id="desc">展示 Agent 术语如何按模型、工具、检索、记忆、评估和安全分类。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 17px system-ui;fill:#172033}.text{font:400 12px system-ui;fill:#435066}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}</style></defs><rect class="bg" width="1120" height="280"/><text class="title" x="56" y="58">术语不是孤岛,而是系统层次</text><text class="sub" x="56" y="86">遇到陌生词时,先判断它属于模型、工具、知识、状态、评估还是安全。</text>
  <g transform="translate(0,-53)"><rect class="n" x="110" y="190" width="180" height="74" rx="8"/><text class="head" x="166" y="220">Model</text><text class="text" x="142" y="244">Attention / SFT / KV</text><rect class="n2" x="340" y="190" width="180" height="74" rx="8"/><text class="head" x="398" y="220">Agent</text><text class="text" x="372" y="244">Loop / Tool / State</text><rect class="n3" x="570" y="190" width="180" height="74" rx="8"/><text class="head" x="636" y="220">RAG</text><text class="text" x="600" y="244">Chunk / Embedding</text><rect class="n4" x="800" y="190" width="180" height="74" rx="8"/><text class="head" x="858" y="220">Safety</text><text class="text" x="830" y="244">Guardrails / Injection</text>
  </g>
</svg>

