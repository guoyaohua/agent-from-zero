<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Agent 标准化边界</title><desc id="desc">展示 Agent 生态中最值得标准化的工具、资源、消息、Trace、评估和策略边界,并强调本地策略不能被协议替代。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.std{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.local{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.p{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">标准化应从稳定边界开始,不是统一所有内部实现</text><text class="s" x="56" y="86">协议负责互操作,本地策略负责风险、权限和组织差异。</text><rect class="std" x="90" y="168" width="210" height="86" rx="10"/><text class="h" x="150" y="202">Tools</text><text class="x" x="120" y="230">schema / error / risk</text><rect class="std" x="350" y="168" width="210" height="86" rx="10"/><text class="h" x="404" y="202">Resources</text><text class="x" x="380" y="230">URI / metadata / trust</text><rect class="std" x="610" y="168" width="210" height="86" rx="10"/><text class="h" x="672" y="202">Messages</text><text class="x" x="640" y="230">handoff / evidence / state</text><rect class="std" x="870" y="168" width="210" height="86" rx="10"/><text class="h" x="934" y="202">Trace</text><text class="x" x="900" y="230">event / span / artifact</text><rect class="std" x="220" y="356" width="210" height="86" rx="10"/><text class="h" x="284" y="390">Eval</text><text class="x" x="250" y="418">sample / rubric / score</text><rect class="local" x="482" y="356" width="210" height="86" rx="10"/><text class="h" x="548" y="390">Policy</text><text class="x" x="512" y="418">permission / approval / DLP</text><rect class="local" x="744" y="356" width="210" height="86" rx="10"/><text class="h" x="800" y="390">Local Rules</text><text class="x" x="774" y="418">tenant / law / workflow</text><path class="a" d="M195 254v102M455 254C430 310 370 334 325 356M715 254C690 310 630 334 587 356M975 254C948 320 900 344 849 356"/><rect class="p" x="130" y="520" width="860" height="54" rx="8"/><text class="h" x="160" y="553">判断</text><text class="x" x="224" y="553">能跨系统复用的边界适合标准化;涉及责任、合规和副作用的规则必须留给本地控制面。</text></svg>
