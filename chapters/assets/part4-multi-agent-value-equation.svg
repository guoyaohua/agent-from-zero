<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 价值公式</title>
  <desc id="desc">展示多 Agent 的收益来自上下文减负、工具隔离、并行和评估清晰度,同时要扣除协调成本。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.small{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.good{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.8}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:1.8}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}.op{font:700 30px system-ui;fill:#596579}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">多 Agent 值不值得,看收益是否超过协调成本</text>
  <text class="sub" x="56" y="82">它不是“更多模型更聪明”,而是把复杂度拆到更可控的位置。</text>
  <rect class="good" x="58" y="146" width="190" height="118" rx="8"/><text class="head" x="98" y="180">上下文减负</text><text class="text" x="92" y="214">每个角色只看</text><text class="text" x="92" y="238">当前必要材料</text>
  <text class="op" x="268" y="218">+</text>
  <rect class="good" x="306" y="146" width="190" height="118" rx="8"/><text class="head" x="346" y="180">工具隔离</text><text class="text" x="340" y="214">按职责缩小</text><text class="text" x="340" y="238">权限和工具面</text>
  <text class="op" x="516" y="218">+</text>
  <rect class="good" x="554" y="146" width="190" height="118" rx="8"/><text class="head" x="604" y="180">并行探索</text><text class="text" x="588" y="214">独立分支并发</text><text class="text" x="588" y="238">降低等待时间</text>
  <text class="op" x="764" y="218">+</text>
  <rect class="good" x="802" y="146" width="190" height="118" rx="8"/><text class="head" x="842" y="180">评估清晰</text><text class="text" x="836" y="214">中间产物能</text><text class="text" x="836" y="238">独立检查</text>
  <path class="arrow" d="M496 326 H624"/>
  <rect class="bad" x="662" y="292" width="280" height="106" rx="8"/><text class="head" x="746" y="326">协调成本</text><text class="text" x="704" y="360">通信、合并、冲突、状态一致性</text>
  <rect class="box" x="178" y="416" width="764" height="42" rx="8"/><text class="head" x="228" y="442">判断句</text><text class="text" x="326" y="442">如果没有明确中间产物和评估标准,多 Agent 多半只是更贵的聊天链。</text>
</svg>
