<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc"><title id="title">解释与因果证据层次</title><desc id="desc">展示模型自述、系统 trace、反事实测试和机制分析在可解释性中的证据强度差异。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.weak{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.mid{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.good{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.deep{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="410"/><text class="t" x="56" y="58">模型说出的理由,不等于真正因果原因</text><text class="s" x="56" y="86">越接近因果解释,越需要可观察证据、反事实干预或机制级分析。</text>
  <g transform="translate(0,-105)"><rect class="weak" x="90" y="238" width="210" height="110" rx="10"/><text class="h" x="150" y="272">Self-report</text><text class="x" x="120" y="302">模型自述理由</text><text class="x" x="120" y="326">容易事后合理化</text><rect class="mid" x="340" y="238" width="210" height="110" rx="10"/><text class="h" x="405" y="272">Trace</text><text class="x" x="370" y="302">证据、工具、状态</text><text class="x" x="370" y="326">解释系统过程</text><rect class="good" x="590" y="238" width="210" height="110" rx="10"/><text class="h" x="645" y="272">Counterfactual</text><text class="x" x="620" y="302">替换证据/工具结果</text><text class="x" x="620" y="326">观察输出是否变化</text><rect class="deep" x="840" y="238" width="210" height="110" rx="10"/><text class="h" x="900" y="272">Mechanism</text><text class="x" x="870" y="302">特征、circuit、因果路径</text><text class="x" x="870" y="326">研究难度最高</text><path class="a" d="M300 293H340M550 293H590M800 293H840"/><text class="x" x="150" y="456">工程实践中,至少要做到 Trace 级解释;高风险系统应加入反事实测试;机制解释是更长期的研究支撑。</text>
  </g>
</svg>
