<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">激活函数如何把线性边界弯起来</title>
  <desc id="desc">对比没有激活函数时多层线性网络仍等价于一条直线边界,加入非线性后可以组合出分段和弯曲边界。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .dotA { fill: #355c9a; }
      .dotB { fill: #b13c52; }
      .line { fill: none; stroke: #172033; stroke-width: 3; }
      .curve { fill: none; stroke: #2d7d80; stroke-width: 4; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="560" />
  <text class="title" x="48" y="48">没有非线性,多层矩阵最终仍像一层矩阵</text>
  <text class="sub" x="48" y="74">激活函数让网络能把多个简单分界组合起来,表达更复杂的输入模式。</text>
  <rect class="panel" x="48" y="104" width="1024" height="340" rx="8" />

  <rect class="blue" x="116" y="146" width="390" height="240" rx="8" />
  <text class="label" x="222" y="176">只有线性层</text>
  <line class="line" x1="178" y1="340" x2="454" y2="196" />
  <circle class="dotA" cx="200" cy="220" r="7" /><circle class="dotA" cx="250" cy="250" r="7" /><circle class="dotA" cx="300" cy="210" r="7" />
  <circle class="dotB" cx="360" cy="330" r="7" /><circle class="dotB" cx="410" cy="300" r="7" /><circle class="dotB" cx="430" cy="250" r="7" />
  <text class="small" x="184" y="366">边界只能是一条线或一个超平面</text>

  <rect class="green" x="614" y="146" width="390" height="240" rx="8" />
  <text class="label" x="706" y="176">加入激活函数</text>
  <path class="curve" d="M666 330 C710 294 694 238 752 232 C814 226 822 296 868 272 C906 252 930 220 962 206" />
  <circle class="dotA" cx="690" cy="220" r="7" /><circle class="dotA" cx="742" cy="268" r="7" /><circle class="dotA" cx="836" cy="218" r="7" />
  <circle class="dotB" cx="714" cy="334" r="7" /><circle class="dotB" cx="810" cy="326" r="7" /><circle class="dotB" cx="922" cy="300" r="7" />
  <text class="small" x="666" y="366">多个弯折组合出复杂边界</text>

  <rect class="panel" x="192" y="404" width="736" height="28" rx="8" />
  <text class="text" x="220" y="424">激活函数不是装饰,它决定多层网络是否真的比一层线性模型更强。</text>
  <rect class="panel" x="72" y="470" width="976" height="42" rx="8" />
  <text class="text" x="98" y="496">读图方式: 线性层负责变换坐标,非线性负责折叠空间,多层网络负责反复重表示。</text>
</svg>
