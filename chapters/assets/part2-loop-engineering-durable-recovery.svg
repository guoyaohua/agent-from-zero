<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Loop 持久执行与恢复协议</title><desc id="desc">展示长时程 Agent 在 checkpoint、resume、reconcile、decide 和 compact 五步中恢复任务,避免重复副作用和过期状态。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.node{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}.tag{fill:#172033}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">持久 Loop 恢复时先对账,再让模型继续</text><text class="s" x="56" y="86">中断后不能直接生成新动作,必须确认 pending action 和外部世界状态。</text><rect class="p" x="70" y="168" width="172" height="82" rx="10"/><text class="h" x="112" y="198">checkpoint</text><text class="x" x="96" y="222">state_id、预算</text><text class="x" x="96" y="242">计划版本、风险</text><rect class="g" x="292" y="168" width="172" height="82" rx="10"/><text class="h" x="346" y="198">resume</text><text class="x" x="318" y="222">加载 last turn</text><text class="x" x="318" y="242">和 pending action</text><rect class="o" x="514" y="168" width="172" height="82" rx="10"/><text class="h" x="558" y="198">reconcile</text><text class="x" x="538" y="222">对账工具结果</text><text class="x" x="538" y="242">artifact/外部 ID</text><rect class="v" x="736" y="168" width="172" height="82" rx="10"/><text class="h" x="790" y="198">decide</text><text class="x" x="762" y="222">继续/重试/回滚</text><text class="x" x="762" y="242">询问/中止</text><rect class="p" x="958" y="168" width="112" height="82" rx="10"/><text class="h" x="984" y="198">compact</text><text class="x" x="980" y="222">重建工作</text><text class="x" x="990" y="242">上下文</text><path class="a" d="M242 209H292M464 209H514M686 209H736M908 209H958"/><rect class="node" x="210" y="332" width="700" height="104" rx="12"/><text class="h" x="250" y="364">副作用动作生命周期</text><rect class="tag" x="252" y="388" width="130" height="30" rx="6"/><text class="m" x="288" y="408">pending</text><rect class="tag" x="496" y="388" width="130" height="30" rx="6"/><text class="m" x="526" y="408">committed</text><rect class="tag" x="740" y="388" width="130" height="30" rx="6"/><text class="m" x="774" y="408">observed</text><path class="a" d="M382 403H496M626 403H740"/><text class="x" x="252" y="464">恢复原则: 如果存在 pending action,先确认它是否已提交或需要回滚,再进入下一轮模型决策。</text><rect class="bad" x="270" y="504" width="580" height="44" rx="8"/><text class="x" x="306" y="531">危险反例: 只加载旧 checkpoint,忽略外部系统,导致重复发邮件、重复建工单或覆盖用户改动。</text></svg>
