<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">API Wrapper 到 Harness 的差异</title><desc id="desc">对比简单 API wrapper 与完整 Agent Harness 在结构、权限、执行和反馈上的差异。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.4px system-ui;fill:#435066}.m{font:700 12.5px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.wrap{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.har{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.bad{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.6}.tag{fill:#172033}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">Wrapper 让工具能被调用,Harness 决定调用能否成为系统事件</text><text class="s" x="56" y="86">差别不在代码多少,而在是否有权限、风险、执行和反馈治理。</text><rect class="wrap" x="74" y="142" width="420" height="344" rx="12"/><text class="h" x="222" y="178">API Wrapper</text><rect class="bad" x="112" y="216" width="344" height="54" rx="8"/><text class="x" x="140" y="248">解析 JSON 参数,然后直接调用函数</text><rect class="bad" x="112" y="286" width="344" height="54" rx="8"/><text class="x" x="140" y="318">默认工具可用,默认用户可执行</text><rect class="bad" x="112" y="356" width="344" height="54" rx="8"/><text class="x" x="140" y="388">失败返回字符串,下一轮让模型猜</text><rect class="tag" x="148" y="438" width="272" height="28" rx="6"/><text class="m" x="192" y="457">适合低风险 Demo 和原型</text><rect class="har" x="626" y="142" width="420" height="344" rx="12"/><text class="h" x="754" y="178">Agent Harness</text><rect class="ok" x="664" y="206" width="344" height="44" rx="8"/><text class="x" x="692" y="233">schema + 来源 + 业务规则校验</text><rect class="ok" x="664" y="264" width="344" height="44" rx="8"/><text class="x" x="692" y="291">用户、租户、资源、风险联合授权</text><rect class="ok" x="664" y="322" width="344" height="44" rx="8"/><text class="x" x="692" y="349">sandbox、timeout、幂等、preview/confirm</text><rect class="ok" x="664" y="380" width="344" height="44" rx="8"/><text class="x" x="692" y="407">结构化 Observation、trace、artifact ref</text><rect class="tag" x="690" y="446" width="292" height="28" rx="6"/><text class="m" x="732" y="465">适合生产工具和副作用动作</text><path class="a" d="M494 314H626"/><rect class="box" x="210" y="522" width="700" height="42" rx="8"/><text class="x" x="246" y="548">迁移信号: 只要工具能读敏感数据、写状态或触发外部副作用,就必须从 wrapper 升级到 Harness。</text></svg>
