<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">RAG 证据链路</title>
  <desc id="desc">展示 RAG 从离线索引到在线检索、重排、证据包、答案生成和引用校验的完整链路。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.node{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.node2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.node3{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.node4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}.arrow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="660"/><text class="title" x="56" y="58">RAG: 从知识源到可引用答案的证据链</text><text class="sub" x="56" y="86">可靠 RAG 不只是向量搜索,而是清洗、切块、召回、重排、证据组织、生成和引用校验。</text>
  <rect class="panel" x="58" y="136" width="1004" height="174" rx="8"/><text class="head" x="90" y="172">离线索引</text><rect class="node" x="100" y="206" width="118" height="46"/><text class="text" x="132" y="234">文档收集</text><rect class="node" x="258" y="206" width="118" height="46"/><text class="text" x="296" y="234">清洗</text><rect class="node" x="416" y="206" width="118" height="46"/><text class="text" x="454" y="234">切块</text><rect class="node" x="574" y="206" width="118" height="46"/><text class="text" x="604" y="234">Embedding</text><rect class="node" x="732" y="206" width="118" height="46"/><text class="text" x="762" y="234">建索引</text><rect class="node" x="890" y="206" width="118" height="46"/><text class="text" x="922" y="234">元数据</text><path class="arrow" d="M218 229 H258"/><path class="arrow" d="M376 229 H416"/><path class="arrow" d="M534 229 H574"/><path class="arrow" d="M692 229 H732"/><path class="arrow" d="M850 229 H890"/>
  <rect class="panel" x="58" y="360" width="1004" height="190" rx="8"/><text class="head" x="90" y="396">在线检索与生成</text><rect class="node2" x="98" y="430" width="110" height="46"/><text class="text" x="126" y="458">用户问题</text><rect class="node2" x="238" y="430" width="110" height="46"/><text class="text" x="270" y="458">查询改写</text><rect class="node2" x="378" y="430" width="110" height="46"/><text class="text" x="414" y="458">召回</text><rect class="node3" x="518" y="430" width="110" height="46"/><text class="text" x="554" y="458">重排</text><rect class="node3" x="658" y="430" width="110" height="46"/><text class="text" x="694" y="458">证据包</text><rect class="node4" x="798" y="430" width="110" height="46"/><text class="text" x="834" y="458">生成</text><rect class="bad" x="938" y="430" width="96" height="46"/><text class="text" x="956" y="458">引用校验</text><path class="arrow" d="M208 453 H238"/><path class="arrow" d="M348 453 H378"/><path class="arrow" d="M488 453 H518"/><path class="arrow" d="M628 453 H658"/><path class="arrow" d="M768 453 H798"/><path class="arrow" d="M908 453 H938"/>
  <text class="text" x="94" y="586">诊断顺序: 知识是否存在 -> 切块是否正确 -> 是否召回 -> 是否排前 -> 证据是否完整 -> 答案是否忠于证据。</text>
</svg>
