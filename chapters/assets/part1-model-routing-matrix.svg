<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">模型路由与组合矩阵</title>
  <desc id="desc">展示 Agent 系统如何根据任务难度、数据敏感度、模态、延迟和可验证性选择不同模型角色。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .router { fill: #172033; stroke: #172033; stroke-width: 2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label2 { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .muted { fill: #e5e7eb; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8b98aa; stroke-width: 1.7; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">模型选型不是榜单题,而是路由题</text>
  <text class="sub" x="48" y="78">生产 Agent 通常先判断任务信号,再把请求送到最合适的模型角色,并用评估回流持续修正路由。</text>
  <rect class="panel" x="48" y="112" width="1024" height="396" rx="8" />
  <text class="label" x="82" y="150">任务信号</text>
  <rect class="gray" x="72" y="174" width="154" height="42" rx="7" /><text class="label" x="94" y="200">难度</text><text class="small" x="140" y="200">简单/复杂</text>
  <rect class="gray" x="72" y="228" width="154" height="42" rx="7" /><text class="label" x="94" y="254">敏感度</text><text class="small" x="158" y="254">可出域?</text>
  <rect class="gray" x="72" y="282" width="154" height="42" rx="7" /><text class="label" x="94" y="308">模态</text><text class="small" x="140" y="308">文本/图像</text>
  <rect class="gray" x="72" y="336" width="154" height="42" rx="7" /><text class="label" x="94" y="362">延迟</text><text class="small" x="140" y="362">交互/离线</text>
  <rect class="gray" x="72" y="390" width="154" height="42" rx="7" /><text class="label" x="94" y="416">证据</text><text class="small" x="140" y="416">能否验证</text>
  <path class="arrow" d="M226 306 H344" />
  <rect class="router" x="344" y="206" width="188" height="196" rx="12" />
  <text class="label2" x="386" y="248">模型路由器</text>
  <text class="small muted" x="374" y="282">策略 + 预算 + 权限</text>
  <text class="small muted" x="374" y="310">评估集阈值</text>
  <text class="small muted" x="374" y="338">失败回流</text>
  <text class="small muted" x="374" y="366">版本锁定</text>
  <path class="arrow" d="M532 236 H610" /><path class="arrow" d="M532 290 H610" /><path class="arrow" d="M532 344 H610" /><path class="arrow" d="M532 398 H610" />
  <text class="label" x="626" y="150">模型角色</text>
  <rect class="green" x="610" y="174" width="182" height="58" rx="8" />
  <text class="label" x="634" y="198">小模型/分类器</text><text class="text" x="634" y="218">路由、风控、意图识别</text>
  <rect class="blue" x="818" y="174" width="182" height="58" rx="8" />
  <text class="label" x="842" y="198">私有开源模型</text><text class="text" x="842" y="218">敏感数据、低成本吞吐</text>
  <rect class="orange" x="610" y="254" width="182" height="58" rx="8" />
  <text class="label" x="634" y="278">强通用模型</text><text class="text" x="634" y="298">复杂生成、工具调用</text>
  <rect class="red" x="818" y="254" width="182" height="58" rx="8" />
  <text class="label" x="842" y="278">推理型模型</text><text class="text" x="842" y="298">代码、数学、多步规划</text>
  <rect class="blue" x="610" y="334" width="182" height="58" rx="8" />
  <text class="label" x="634" y="358">多模态模型</text><text class="text" x="634" y="378">截图、PDF、图表、音频</text>
  <rect class="green" x="818" y="334" width="182" height="58" rx="8" />
  <text class="label" x="842" y="358">Embedding/Rerank</text><text class="text" x="842" y="378">召回、精排、记忆检索</text>
  <rect class="gray" x="610" y="424" width="390" height="48" rx="8" />
  <text class="label" x="636" y="449">统一输出契约</text><text class="text" x="746" y="449">格式、引用、置信度、工具轨迹、成本</text>
  <path class="dash" d="M805 472 C720 548 442 548 430 404" />
  <text class="small" x="486" y="548">线上 trace 与人工评审回流到路由策略</text>
  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式:先切任务,再选模型;模型名会过时,但路由信号和输出契约会长期有效。</text>
</svg>
