<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">通信协议与消息传递</title>
  <desc id="desc">展示多 Agent 消息从意图、内容、证据、状态、权限到响应契约的结构化协议。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="680"/><text class="title" x="56" y="58">多 Agent 通信: 传递的是状态和契约,不只是聊天</text><text class="sub" x="56" y="86">消息需要让接收方知道任务、依据、权限、期望输出和失败处理方式。</text>
  <rect class="blue" x="92" y="250" width="170" height="72" rx="8"/><text class="head" x="137" y="280">Sender</text><text class="text" x="124" y="304">拥有局部状态</text>
  <rect class="panel" x="348" y="138" width="424" height="380" rx="8"/><text class="head" x="392" y="176">Message Envelope</text><text class="mono" x="392" y="216">type: request | result | critique</text><text class="mono" x="392" y="248">goal: what receiver should achieve</text><text class="mono" x="392" y="280">context: minimal state summary</text><text class="mono" x="392" y="312">evidence: source ids and artifacts</text><text class="mono" x="392" y="344">constraints: permissions and budget</text><text class="mono" x="392" y="376">output_contract: schema + criteria</text><text class="mono" x="392" y="408">correlation_id: trace linkage</text><text class="mono" x="392" y="440">deadline: timeout / escalation</text>
  <rect class="green" x="858" y="250" width="170" height="72" rx="8"/><text class="head" x="898" y="280">Receiver</text><text class="text" x="888" y="304">返回结构化产物</text><path class="arrow" d="M262 286 H348"/><path class="arrow" d="M772 286 H858"/>
  <rect class="orange" x="120" y="438" width="224" height="78" rx="8"/><text class="head" x="176" y="468">Protocol Guard</text><text class="text" x="150" y="492">schema、权限、大小、TTL</text>
  <rect class="purple" x="776" y="438" width="224" height="78" rx="8"/><text class="head" x="842" y="468">Trace Store</text><text class="text" x="806" y="492">消息链路、版本、证据回源</text>
  <text class="text" x="92" y="600">协议越清晰,Agent 越少依赖“读懂上一段自由文本”。这直接影响可复盘性和错误恢复。</text>
</svg>

