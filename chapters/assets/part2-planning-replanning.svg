<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Planning 与动态重规划</title>
  <desc id="desc">展示 Planner、Executor、Observation、Progress Check 和 Replan 的关系。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}.plan{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.exec{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.obs{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.check{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="660"/><text class="title" x="56" y="58">Planning: 计划给方向,观察让计划更新</text><text class="sub" x="56" y="86">好计划不是固定脚本,而是状态对象:有子目标、依赖、完成标准和重规划触发条件。</text>
  <rect class="plan" x="92" y="190" width="190" height="72" rx="8"/><text class="head" x="150" y="220">Planner</text><text class="text" x="128" y="244">拆子任务和依赖</text>
  <path class="arrow" d="M282 226 H378"/>
  <rect class="exec" x="378" y="190" width="190" height="72" rx="8"/><text class="head" x="438" y="220">Executor</text><text class="text" x="420" y="244">执行当前一步</text>
  <path class="arrow" d="M568 226 H664"/>
  <rect class="obs" x="664" y="190" width="190" height="72" rx="8"/><text class="head" x="718" y="220">Observation</text><text class="text" x="708" y="244">工具结果和反馈</text>
  <path class="arrow" d="M759 262 V342"/>
  <rect class="check" x="624" y="342" width="270" height="82" rx="8"/><text class="head" x="692" y="376">Progress Check</text><text class="text" x="660" y="400">目标一致? 证据充分? 预算足够?</text>
  <path class="arrow" d="M624 383 H474 V262"/><text class="mono" x="486" y="356">continue</text>
  <path class="arrow" d="M759 424 C759 530 186 530 186 262"/><text class="mono" x="414" y="548">replan when blocked / new constraint / no progress</text>
  <rect class="panel" x="92" y="474" width="310" height="90" rx="8"/><text class="head" x="124" y="510">计划对象</text><text class="mono" x="124" y="540">step, status, dependency, done_when</text>
  <rect class="bad" x="792" y="474" width="260" height="90" rx="8"/><text class="head" x="836" y="510">不要硬走旧计划</text><text class="text" x="824" y="540">观察推翻假设时必须重规划。</text>
</svg>
