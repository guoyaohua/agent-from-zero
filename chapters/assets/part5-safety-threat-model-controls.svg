<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="title desc">
  <title id="title">威胁模型到控制映射</title>
  <desc id="desc">展示 Agent 安全从资产、攻击路径、风险分级到运行时控制和事故响应的映射。</desc>
  <rect width="860" height="370" fill="#f8fafc"/>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">安全设计从资产和攻击面开始</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#1f2937">
    <rect x="34" y="72" width="150" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="66" y="104" font-weight="700">Assets</text><text x="54" y="130">PII / docs / tools</text>
    <rect x="220" y="72" width="150" height="80" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="252" y="104" font-weight="700">Attack paths</text><text x="238" y="130">injection / exfil</text>
    <rect x="406" y="72" width="150" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="438" y="104" font-weight="700">Risk score</text><text x="430" y="130">data x action</text>
    <rect x="592" y="72" width="230" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="638" y="104" font-weight="700">Runtime controls</text><text x="612" y="130">policy / confirm / audit / sandbox</text>
    <path d="M184 112 H220 M370 112 H406 M556 112 H592" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="210" width="720" height="100" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="100" y="242" font-weight="700">Control bundle:</text><text x="230" y="242">最小权限</text><text x="340" y="242">数据最小化</text><text x="470" y="242">工具前策略</text><text x="610" y="242">确认卡片</text>
    <text x="100" y="272">事故响应:</text><text x="190" y="272">冻结工具</text><text x="290" y="272">查 trace</text><text x="385" y="272">回滚策略</text><text x="500" y="272">清理记忆/缓存</text><text x="660" y="272">加入 eval</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
</svg>
