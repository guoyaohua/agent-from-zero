<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">工作流模式适配账本</title>
  <desc id="desc">展示五类工作流模式如何根据不确定性位置、验证方式、并行性和风险选择。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.h{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.cell{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.c1{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.5}.c2{fill:#e8f0ff;stroke:#5178c9;stroke-width:1.5}.c3{fill:#fff0e6;stroke:#b05c37;stroke-width:1.5}.c4{fill:#f7d9df;stroke:#b13c52;stroke-width:1.5}</style></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="54" y="52">选择工作流模式,先定位不确定性在哪里</text>
  <text class="sub" x="54" y="80">不同模式是在不同位置局部化不确定性,不是五个流行模板。</text>
  <g transform="translate(76 124)">
    <rect class="cell" x="0" y="0" width="968" height="282" rx="8"/>
    <g class="h"><text x="22" y="38">模式</text><text x="204" y="38">不确定性位置</text><text x="470" y="38">验证方式</text><text x="720" y="38">适合场景</text></g>
    <rect class="c1" x="0" y="58" width="968" height="42"/><text class="h" x="22" y="84">Chaining</text><text class="t" x="204" y="84">每步输出质量</text><text class="t" x="470" y="84">阶段 schema/gate</text><text class="t" x="720" y="84">摘要、抽取、改写</text>
    <rect class="c2" x="0" y="106" width="968" height="42"/><text class="h" x="22" y="132">Routing</text><text class="t" x="204" y="132">任务类型判断</text><text class="t" x="470" y="132">路由置信和 fallback</text><text class="t" x="720" y="132">多意图入口</text>
    <rect class="c3" x="0" y="154" width="968" height="42"/><text class="h" x="22" y="180">Parallel</text><text class="t" x="204" y="180">信息来源分散</text><text class="t" x="470" y="180">合并和冲突检测</text><text class="t" x="720" y="180">多文档、多检查</text>
    <rect class="c4" x="0" y="202" width="968" height="42"/><text class="h" x="22" y="228">Orchestrator</text><text class="t" x="204" y="228">子任务动态变化</text><text class="t" x="470" y="228">状态和 handoff</text><text class="t" x="720" y="228">调研、排错、代码任务</text>
    <rect class="c1" x="0" y="250" width="968" height="42"/><text class="h" x="22" y="276">Eval-Opt</text><text class="t" x="204" y="276">质量需迭代</text><text class="t" x="470" y="276">rubric/test/Judge</text><text class="t" x="720" y="276">写作、代码、报告</text>
  </g>
  <rect x="190" y="438" width="740" height="38" rx="8" fill="#172033"/><text x="256" y="462" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#fff">模式选择错了,不是模型不够强,而是不确定性被放错了位置。</text>
</svg>
