<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="680" viewBox="0 0 1220 680" role="img" aria-labelledby="title desc"><title id="title">发布、运行治理与变更管理</title><desc id="desc">展示 Agent 系统从 release bundle、离线门禁、灰度发布、线上观测、按层回滚到事故复盘的生产治理闭环。</desc><defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.h{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.4}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.e{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#arrow)}.dark{fill:#172033}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1220" height="680"/><text class="title" x="54" y="58">Agent 上线后,真正难的是治理变化</text><text class="sub" x="54" y="86">模型、Prompt、工具、RAG、策略、记忆和评估都会改变行为;发布必须可评估、可灰度、可回滚。</text><g transform="translate(58,132)"><rect class="a" x="0" y="0" width="170" height="92" rx="8"/><text class="h" x="30" y="30">Release Bundle</text><text class="t" x="22" y="56">模型/prompt/tool</text><text class="s" x="22" y="76">索引、策略、eval</text><path class="line" d="M170 46H220"/><rect class="b" x="220" y="0" width="170" height="92" rx="8"/><text class="h" x="262" y="30">Gates</text><text class="t" x="244" y="56">回归 / 安全 / 成本</text><text class="s" x="244" y="76">回滚演练</text><path class="line" d="M390 46H440"/><rect class="c" x="440" y="0" width="170" height="92" rx="8"/><text class="h" x="486" y="30">Canary</text><text class="t" x="464" y="56">用户/任务/权限灰度</text><text class="s" x="464" y="76">先只读再写入</text><path class="line" d="M610 46H660"/><rect class="d" x="660" y="0" width="170" height="92" rx="8"/><text class="h" x="710" y="30">Observe</text><text class="t" x="684" y="56">质量/安全/成本/延迟</text><text class="s" x="684" y="76">按版本切片</text><path class="line" d="M830 46H880"/><rect class="e" x="880" y="0" width="170" height="92" rx="8"/><text class="h" x="928" y="30">Rollback</text><text class="t" x="904" y="56">按层回滚</text><text class="s" x="904" y="76">模型、索引、策略</text></g><g transform="translate(72,284)"><rect class="box" x="0" y="0" width="250" height="170" rx="8"/><text class="h" x="24" y="30">变更面</text><text class="t" x="24" y="58">模型版本 / Prompt</text><text class="t" x="24" y="82">工具 schema / Harness policy</text><text class="t" x="24" y="106">RAG index / reranker</text><text class="t" x="24" y="130">Memory policy / eval rubric</text><text class="s" x="24" y="154">只记录代码 commit 不够</text><rect class="box" x="292" y="0" width="250" height="170" rx="8"/><text class="h" x="316" y="30">发布前门禁</text><text class="t" x="316" y="58">离线回归</text><text class="t" x="316" y="82">格式契约</text><text class="t" x="316" y="106">注入和越权样本</text><text class="t" x="316" y="130">p95/p99 和成本</text><text class="s" x="316" y="154">人工抽检高风险任务</text><rect class="box" x="584" y="0" width="250" height="170" rx="8"/><text class="h" x="608" y="30">线上指标</text><text class="t" x="608" y="58">引用支持率 / 采纳率</text><text class="t" x="608" y="82">policy block rate</text><text class="t" x="608" y="106">parse/schema/tool error</text><text class="t" x="608" y="130">token 成本和队列等待</text><text class="s" x="608" y="154">按 release bundle 切片</text><rect class="box" x="876" y="0" width="250" height="170" rx="8"/><text class="h" x="900" y="30">事故复盘</text><text class="t" x="900" y="58">当时看到什么证据</text><text class="t" x="900" y="82">提出了什么动作</text><text class="t" x="900" y="106">哪条策略放行</text><text class="t" x="900" y="130">补哪个回归样本</text><text class="s" x="900" y="154">目标是修控制面</text></g><g transform="translate(148,512)"><rect class="a" x="0" y="0" width="180" height="74" rx="8"/><text class="h" x="24" y="30">Model</text><text class="t" x="24" y="54">能力和风格变化</text><rect class="b" x="214" y="0" width="180" height="74" rx="8"/><text class="h" x="238" y="30">Context</text><text class="t" x="238" y="54">证据和记忆变化</text><rect class="c" x="428" y="0" width="180" height="74" rx="8"/><text class="h" x="452" y="30">Tool</text><text class="t" x="452" y="54">schema 和副作用</text><rect class="d" x="642" y="0" width="180" height="74" rx="8"/><text class="h" x="666" y="30">Policy</text><text class="t" x="666" y="54">权限和确认</text><rect class="e" x="856" y="0" width="180" height="74" rx="8"/><text class="h" x="880" y="30">Eval</text><text class="t" x="880" y="54">上线门槛变化</text></g><rect class="dark" x="214" y="612" width="792" height="38" rx="8"/><text x="260" y="636" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">每次上线都要知道:变了什么、影响谁、如何观测、如何按层回滚。</text></svg>
