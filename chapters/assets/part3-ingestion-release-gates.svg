<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-labelledby="title desc">
  <title id="title">RAG 入库发布门禁</title>
  <desc id="desc">展示企业知识从发现、解析、元数据、索引、评估、灰度到删除传播的发布治理流程。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.h{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#172033}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#arrow)}.barbg{fill:#e5e7eb}.bar{fill:#355c9a}.warn{fill:#b13c52}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1220" height="760"/>
  <text class="title" x="52" y="56">知识入库也要像代码一样发布</text>
  <text class="sub" x="52" y="84">解析、权限、删除传播和回归评估不过关,索引就不应进入线上 RAG。</text>

  <rect class="panel" x="48" y="116" width="1124" height="318" rx="10"/>
  <rect class="blue" x="78" y="172" width="138" height="72" rx="8"/><text class="h" x="114" y="200">Discover</text><text class="s" x="102" y="224">来源发现</text>
  <rect class="orange" x="254" y="172" width="138" height="72" rx="8"/><text class="h" x="292" y="200">Parse</text><text class="s" x="280" y="224">结构保真</text>
  <rect class="green" x="430" y="172" width="138" height="72" rx="8"/><text class="h" x="462" y="200">Metadata</text><text class="s" x="456" y="224">版本/ACL</text>
  <rect class="purple" x="606" y="172" width="138" height="72" rx="8"/><text class="h" x="648" y="200">Index</text><text class="s" x="630" y="224">向量 + BM25</text>
  <rect class="red" x="782" y="172" width="138" height="72" rx="8"/><text class="h" x="828" y="200">Eval</text><text class="s" x="810" y="224">检索/权限/删除</text>
  <rect class="blue" x="958" y="172" width="138" height="72" rx="8"/><text class="h" x="1002" y="200">Release</text><text class="s" x="986" y="224">灰度 + 回滚</text>
  <path class="line" d="M216 208H254"/><path class="line" d="M392 208H430"/><path class="line" d="M568 208H606"/><path class="line" d="M744 208H782"/><path class="line" d="M920 208H958"/>

  <rect class="panel" x="78" y="290" width="1018" height="96" rx="8"/>
  <text class="h" x="104" y="318">发布记录</text>
  <text class="mono" x="104" y="344">source_snapshot | parser_version | chunker_version | embedding_model | acl_snapshot | eval_suite | rollback_index</text>
  <text class="s" x="104" y="366">线上答案退化时,先定位是数据、解析、切块、索引、权限、reranker 还是生成模型变化。</text>

  <rect class="panel" x="48" y="470" width="520" height="214" rx="10"/>
  <text class="h" x="78" y="502">删除传播清单</text>
  <text class="t" x="78" y="532">chunk / embedding / BM25 / reranker cache</text>
  <text class="t" x="78" y="558">evidence pack / summary / graph edge</text>
  <text class="t" x="78" y="584">trace / long-term memory reference</text>
  <rect class="barbg" x="78" y="614" width="380" height="16" rx="4"/><rect class="bar" x="78" y="614" width="292" height="16" rx="4"/>
  <text class="s" x="78" y="650">目标: 被撤回内容不能进入新的 context pack。</text>

  <rect class="panel" x="612" y="470" width="560" height="214" rx="10"/>
  <text class="h" x="642" y="502">门禁失败如何处理</text>
  <text class="t" x="642" y="532">解析失败: 修 parser 或标记不可入库</text>
  <text class="t" x="642" y="558">权限失败: 阻止发布并修 ACL trace</text>
  <text class="t" x="642" y="584">回归失败: 灰度、降权或回滚索引</text>
  <text class="t" x="642" y="610">删除失败: tombstone + 查询时强过滤</text>
  <text class="t" x="642" y="636">高风险数据源: 加人工抽检和保留期策略</text>
  <path class="dash" d="M920 470C998 438 1048 384 1027 244"/>
  <text class="s" x="944" y="448">发布后继续监控漂移</text>
</svg>
