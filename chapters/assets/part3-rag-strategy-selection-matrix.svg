<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="780" viewBox="0 0 1220 780" role="img" aria-labelledby="title desc">
  <title id="title">RAG 策略选择矩阵</title>
  <desc id="desc">按失败信号选择 Naive、Hybrid、Rerank、GraphRAG、Agentic RAG、Long-context RAG 或结构化查询。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.h{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:1.7;stroke-dasharray:6 6;marker-end:url(#arrow)}.tag{fill:#172033}.tagtext{font:700 11px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.axis{stroke:#cbd5e1;stroke-width:1.4}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1220" height="780"/>
  <text class="title" x="52" y="56">RAG 不是一种架构: 先按失败信号选策略</text>
  <text class="sub" x="52" y="84">从 Hybrid RAG 基线开始,只有当失败归因需要多轮、关系或实时结构化数据时再升级。</text>

  <rect class="panel" x="48" y="116" width="1124" height="420" rx="10"/>
  <line class="axis" x1="118" y1="468" x2="1084" y2="468"/>
  <line class="axis" x1="118" y1="468" x2="118" y2="166"/>
  <text class="s" x="944" y="496">问题复杂度 / 证据缺口</text>
  <text class="s" x="62" y="174" transform="rotate(-90 62 174)">治理复杂度 / 成本</text>

  <rect class="blue" x="152" y="382" width="140" height="62" rx="8"/>
  <text class="h" x="188" y="408">Naive</text><text class="s" x="174" y="430">简单 FAQ</text>
  <rect class="green" x="324" y="330" width="156" height="72" rx="8"/>
  <text class="h" x="364" y="358">Hybrid</text><text class="s" x="350" y="380">关键词 + 向量</text>
  <rect class="orange" x="510" y="278" width="156" height="72" rx="8"/>
  <text class="h" x="552" y="306">Rerank</text><text class="s" x="534" y="328">召回后精排</text>
  <rect class="purple" x="692" y="224" width="164" height="78" rx="8"/>
  <text class="h" x="734" y="252">GraphRAG</text><text class="s" x="716" y="274">关系、多跳、社区</text>
  <rect class="red" x="884" y="168" width="172" height="86" rx="8"/>
  <text class="h" x="926" y="198">Agentic RAG</text><text class="s" x="910" y="222">多轮缺口推进</text><text class="s" x="910" y="240">有停止条件</text>

  <path class="line" d="M292 412C308 390 314 376 324 366"/>
  <path class="line" d="M480 366C496 344 500 326 510 314"/>
  <path class="line" d="M666 314C682 292 682 274 692 263"/>
  <path class="line" d="M856 263C872 244 872 224 884 211"/>

  <rect class="panel" x="152" y="152" width="410" height="70" rx="8"/>
  <text class="h" x="176" y="180">不要把 top-k 变大当万能药</text>
  <text class="t" x="176" y="204">召回漏、排序错、证据包丢条件、答案不忠实,修法完全不同。</text>
  <path class="dash" d="M562 188C674 162 806 172 884 198"/>

  <rect class="panel" x="48" y="568" width="1124" height="146" rx="10"/>
  <text class="h" x="78" y="600">策略选择门</text>
  <rect class="tag" x="78" y="624" width="116" height="24" rx="6"/><text class="tagtext" x="96" y="640">exact terms</text><text class="t" x="210" y="640">错误码、条款号、函数名优先 BM25/Hybrid</text>
  <rect class="tag" x="78" y="660" width="116" height="24" rx="6"/><text class="tagtext" x="104" y="676">relations</text><text class="t" x="210" y="676">实体关系、多跳、社区结构再引入 GraphRAG</text>
  <rect class="tag" x="610" y="624" width="116" height="24" rx="6"/><text class="tagtext" x="630" y="640">evidence gap</text><text class="t" x="742" y="640">需要先查 A 再查 B 时,升级 Agentic RAG</text>
  <rect class="tag" x="610" y="660" width="116" height="24" rx="6"/><text class="tagtext" x="644" y="676">realtime</text><text class="t" x="742" y="676">库存、订单、权限状态必须走 SQL/API 工具</text>
  <text class="s" x="78" y="702">所有策略都必须继承 ACL、来源标注、引用校验和 RAG trace。</text>
</svg>
