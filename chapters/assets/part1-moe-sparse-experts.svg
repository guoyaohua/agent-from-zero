<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">MoE 与稀疏专家模型</title>
  <desc id="desc">展示 MoE 中 token 经过 router 选择 top-k experts,再经过容量限制、跨设备通信、专家计算、加权合并和 serving 指标观测的完整链路。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.h{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.t{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.s{font:400 11.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#172033}.blue{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.green{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.orange{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.red{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.purple{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.gray{fill:#eef3f8;stroke:#cbd5e1;stroke-width:1.2}.line{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#b05c37;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#arrow)}.thin{fill:none;stroke:#94a3b8;stroke-width:1.4}.barbg{fill:#e5e7eb}.bar1{fill:#355c9a}.bar2{fill:#2d7d80}.bar3{fill:#b05c37}.bar4{fill:#b13c52}.chip{fill:#172033}.chiptext{font:700 11px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1180" height="760"/>
  <text class="title" x="52" y="56">MoE: 大总参数,小激活路径,复杂 serving</text>
  <text class="sub" x="52" y="84">不要只看 total params。工程上还要看 activated params、router 负载、expert capacity、All-to-All 和尾延迟。</text>

  <rect class="panel" x="48" y="116" width="1084" height="500" rx="10"/>

  <rect class="blue" x="78" y="220" width="130" height="96" rx="8"/>
  <text class="h" x="116" y="250">Tokens</text>
  <text class="mono" x="100" y="276">t1 t2 t3 t4</text>
  <text class="s" x="100" y="300">hidden states</text>

  <rect class="orange" x="260" y="196" width="172" height="144" rx="8"/>
  <text class="h" x="314" y="226">Router</text>
  <text class="t" x="286" y="252">gate scores</text>
  <text class="mono" x="286" y="276">softmax(Wr h)</text>
  <rect class="chip" x="286" y="294" width="52" height="22" rx="5"/><text class="chiptext" x="299" y="309">top-k</text>
  <rect class="chip" x="346" y="294" width="58" height="22" rx="5"/><text class="chiptext" x="358" y="309">weights</text>

  <rect class="panel" x="486" y="142" width="252" height="318" rx="8"/>
  <text class="h" x="554" y="172">Expert Pool</text>
  <rect class="green" x="520" y="198" width="82" height="58" rx="8"/><text class="h" x="546" y="222">E1</text><text class="s" x="538" y="242">FFN</text>
  <rect class="green" x="622" y="198" width="82" height="58" rx="8"/><text class="h" x="648" y="222">E2</text><text class="s" x="640" y="242">FFN</text>
  <rect class="green" x="520" y="282" width="82" height="58" rx="8"/><text class="h" x="546" y="306">E3</text><text class="s" x="538" y="326">FFN</text>
  <rect class="green" x="622" y="282" width="82" height="58" rx="8"/><text class="h" x="648" y="306">E4</text><text class="s" x="640" y="326">FFN</text>
  <rect class="red" x="520" y="372" width="184" height="48" rx="8"/>
  <text class="h" x="548" y="396">Capacity / Overflow</text>
  <text class="s" x="546" y="414">热点 expert 会推高尾延迟</text>

  <rect class="purple" x="790" y="202" width="160" height="112" rx="8"/>
  <text class="h" x="824" y="234">All-to-All</text>
  <text class="t" x="816" y="260">dispatch tokens</text>
  <text class="t" x="816" y="284">restore order</text>
  <path class="thin" d="M812 290 C858 338 920 340 942 304"/>

  <rect class="blue" x="994" y="220" width="108" height="96" rx="8"/>
  <text class="h" x="1024" y="250">Merge</text>
  <text class="t" x="1018" y="276">weighted sum</text>
  <text class="s" x="1018" y="300">residual stream</text>

  <path class="line" d="M208 268 H260"/>
  <path class="line" d="M432 246 H520"/>
  <path class="line" d="M432 292 H622"/>
  <path class="line" d="M704 224 H790"/>
  <path class="line" d="M704 308 H790"/>
  <path class="line" d="M950 268 H994"/>
  <path class="dash" d="M612 420 C580 504 352 486 346 340"/>
  <text class="s" x="374" y="486">load balance signal</text>

  <rect class="panel" x="78" y="500" width="306" height="82" rx="8"/>
  <text class="h" x="100" y="528">参数口径</text>
  <text class="t" x="100" y="552">total params: 完整专家池容量</text>
  <text class="t" x="100" y="574">activated params: 单 token 实际计算</text>

  <rect class="panel" x="420" y="500" width="300" height="82" rx="8"/>
  <text class="h" x="442" y="528">Serving 关键指标</text>
  <text class="t" x="442" y="552">utilization / overflow / p95 latency</text>
  <text class="t" x="442" y="574">batching / KV cache / communication</text>

  <rect class="panel" x="756" y="500" width="346" height="82" rx="8"/>
  <text class="h" x="778" y="528">Agent 系统含义</text>
  <text class="t" x="778" y="552">内部 expert routing 不等于系统 model routing</text>
  <text class="t" x="778" y="574">RAG、工具、评估、安全仍要单独设计</text>

  <rect class="panel" x="48" y="640" width="1084" height="76" rx="10"/>
  <text class="h" x="78" y="668">负载观测例子</text>
  <text class="s" x="78" y="692">E1</text><rect class="barbg" x="104" y="681" width="140" height="14" rx="4"/><rect class="bar1" x="104" y="681" width="118" height="14" rx="4"/>
  <text class="s" x="276" y="692">E2</text><rect class="barbg" x="302" y="681" width="140" height="14" rx="4"/><rect class="bar2" x="302" y="681" width="74" height="14" rx="4"/>
  <text class="s" x="474" y="692">E3</text><rect class="barbg" x="500" y="681" width="140" height="14" rx="4"/><rect class="bar3" x="500" y="681" width="46" height="14" rx="4"/>
  <text class="s" x="672" y="692">E4</text><rect class="barbg" x="698" y="681" width="140" height="14" rx="4"/><rect class="bar4" x="698" y="681" width="134" height="14" rx="4"/>
  <text class="t" x="880" y="692">目标不是绝对均匀,而是质量、吞吐和尾延迟的平衡。</text>
</svg>
