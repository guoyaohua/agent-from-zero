<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 安全边界</title>
  <desc id="desc">展示 OpenClaw 类多渠道个人 Agent Gateway 的四层安全边界:入站身份、Gateway 认证、会话隔离、工具和沙箱策略。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:400 11.5px system-ui;fill:#647084}.z1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.z2{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.z3{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.z4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.n{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.bad{fill:#fff5f5;stroke:#c2410c;stroke-width:1.8}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}.block{fill:none;stroke:#c2410c;stroke-width:2.4;stroke-dasharray:6 5}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1120" height="600"/>
  <text class="t" x="56" y="54">多渠道个人 Agent 的安全边界</text>
  <text class="s" x="56" y="80">先确定谁能触发、看见什么、执行什么,</text>
  <text class="s" x="56" y="102">再谈模型如何回答。</text>

  <rect class="z1" x="58" y="132" width="230" height="326" rx="10"/>
  <text class="h" x="120" y="164">Inbound</text>
  <rect class="bad" x="86" y="194" width="174" height="42" rx="7"/><text class="x" x="124" y="220">unknown DM</text>
  <rect class="n" x="86" y="252" width="174" height="42" rx="7"/><text class="x" x="124" y="278">paired user</text>
  <rect class="n" x="86" y="310" width="174" height="42" rx="7"/><text class="x" x="118" y="336">group mention</text>
  <text class="m" x="92" y="402">默认把外部消息当成</text>
  <text class="m" x="92" y="422">不可信输入处理。</text>

  <rect class="z2" x="332" y="132" width="230" height="326" rx="10"/>
  <text class="h" x="382" y="164">Gateway Gate</text>
  <rect class="n" x="360" y="194" width="174" height="42" rx="7"/><text class="x" x="392" y="220">dmPolicy</text>
  <rect class="n" x="360" y="252" width="174" height="42" rx="7"/><text class="x" x="390" y="278">allowlist</text>
  <rect class="n" x="360" y="310" width="174" height="42" rx="7"/><text class="x" x="386" y="336">device auth</text>
  <text class="m" x="366" y="402">触发授权发生在模型</text>
  <text class="m" x="366" y="422">读取上下文之前。</text>

  <rect class="z3" x="606" y="132" width="230" height="326" rx="10"/>
  <text class="h" x="654" y="164">Session Scope</text>
  <rect class="n" x="634" y="194" width="174" height="42" rx="7"/><text class="x" x="664" y="220">main session</text>
  <rect class="n" x="634" y="252" width="174" height="42" rx="7"/><text class="x" x="650" y="278">per-channel-peer</text>
  <rect class="n" x="634" y="310" width="174" height="42" rx="7"/><text class="x" x="660" y="336">agent routing</text>
  <text class="m" x="640" y="402">多人入口要隔离上下文,</text>
  <text class="m" x="640" y="422">不要共享个人主会话。</text>

  <rect class="z4" x="880" y="132" width="190" height="326" rx="10"/>
  <text class="h" x="920" y="164">Tool Boundary</text>
  <rect class="n" x="908" y="194" width="134" height="42" rx="7"/><text class="x" x="940" y="220">policy</text>
  <rect class="n" x="908" y="252" width="134" height="42" rx="7"/><text class="x" x="932" y="278">sandbox</text>
  <rect class="n" x="908" y="310" width="134" height="42" rx="7"/><text class="x" x="928" y="336">confirm</text>
  <text class="m" x="912" y="402">高影响工具必须按</text>
  <text class="m" x="912" y="422">信任边界收紧。</text>

  <path class="a" d="M288 292H332M562 292H606M836 292H880"/>
  <path class="block" d="M260 215C304 212 318 192 332 170"/>
  <text class="m" x="256" y="196">未配对私信不进入 Agent</text>

  <rect class="n" x="168" y="510" width="784" height="44" rx="8"/>
  <text class="h" x="198" y="537">安全顺序</text>
  <text class="x" x="302" y="537">身份优先,范围其次,模型最后;Gateway/Harness 才是硬边界。</text>
</svg>
