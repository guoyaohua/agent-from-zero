<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">短期记忆与工作状态</title>
  <desc id="desc">展示对话历史、工具结果和计划如何被整理成结构化 Agent state,再构建为下一轮工作上下文。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}.in{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.state{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.ctx{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.ok{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="660"/><text class="title" x="56" y="58">短期记忆: 把历史整理成可决策的工作状态</text><text class="sub" x="56" y="86">原始历史要可追溯,但下一轮模型需要的是目标、约束、观察、计划和未解问题。</text>
  <rect class="panel" x="68" y="138" width="276" height="382" rx="8"/><text class="head" x="104" y="178">输入来源</text><rect class="in" x="104" y="212" width="200" height="46" rx="8"/><text class="text" x="146" y="240">对话历史</text><rect class="in" x="104" y="282" width="200" height="46" rx="8"/><text class="text" x="146" y="310">工具结果</text><rect class="in" x="104" y="352" width="200" height="46" rx="8"/><text class="text" x="146" y="380">用户约束</text><rect class="in" x="104" y="422" width="200" height="46" rx="8"/><text class="text" x="146" y="450">当前计划</text>
  <path class="arrow" d="M344 330 H432"/>
  <rect class="state" x="432" y="126" width="286" height="416" rx="8"/><text class="head" x="506" y="166">Agent State</text><text class="mono" x="470" y="210">goal</text><text class="mono" x="470" y="246">constraints</text><text class="mono" x="470" y="282">observations + artifacts</text><text class="mono" x="470" y="318">hypotheses/status</text><text class="mono" x="470" y="354">actions_taken</text><text class="mono" x="470" y="390">open_questions</text><text class="mono" x="470" y="426">current_plan</text><text class="mono" x="470" y="462">budget/status</text>
  <path class="arrow" d="M718 330 H806"/>
  <rect class="ctx" x="806" y="176" width="238" height="164" rx="8"/><text class="head" x="844" y="216">Working Context</text><text class="text" x="838" y="248">为下一轮模型调用选择</text><text class="text" x="838" y="272">最少但足够的信息</text><text class="text" x="838" y="296">并保留来源引用</text>
  <rect class="bad" x="806" y="394" width="238" height="74" rx="8"/><text class="head" x="852" y="424">常见错误</text><text class="text" x="838" y="450">把完整日志直接塞进 prompt</text>
  <rect class="ok" x="806" y="500" width="238" height="74" rx="8"/><text class="head" x="852" y="530">正确方向</text><text class="text" x="838" y="556">摘要 + 结构化字段 + 可回源</text>
</svg>
