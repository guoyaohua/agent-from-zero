<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">四层失败归因图</title><desc id="desc">把 Agent 失败症状映射到 Prompt、Context、Harness、Loop 四个修复层次。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.p{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.bad{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.b1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.b3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.b4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">不要把所有失败都归因于 Prompt</text><text class="s" x="56" y="86">同一个“答错了”,可能来自任务表达、证据供应、运行时边界或循环动力学。</text><rect class="bad" x="420" y="126" width="280" height="74" rx="10"/><text class="h" x="490" y="157">可见症状</text><text class="x" x="462" y="181">答错、乱调工具、重复、越权、漂移</text><rect class="b1" x="70" y="274" width="230" height="148" rx="10"/><text class="h" x="144" y="308">Prompt</text><text class="x" x="100" y="340">输出格式乱;目标模糊</text><text class="x" x="100" y="368">修任务表达、契约、反例</text><rect class="b2" x="325" y="274" width="230" height="148" rx="10"/><text class="h" x="397" y="308">Context</text><text class="x" x="355" y="340">引用错资料;忘记约束</text><text class="x" x="355" y="368">修检索、摘要、来源标注</text><rect class="b3" x="580" y="274" width="230" height="148" rx="10"/><text class="h" x="650" y="308">Harness</text><text class="x" x="610" y="340">工具误执行;权限绕过</text><text class="x" x="610" y="368">修 schema、策略门、sandbox</text><rect class="b4" x="835" y="274" width="230" height="148" rx="10"/><text class="h" x="906" y="308">Loop</text><text class="x" x="865" y="340">重复无进展;目标漂移</text><text class="x" x="865" y="368">修停止、重规划、进展不变量</text><path class="a" d="M500 200C410 246 278 244 190 274M540 200C506 240 474 250 440 274M584 200C620 240 654 250 695 274M628 200C730 246 880 244 950 274"/><rect class="p" x="120" y="488" width="880" height="76" rx="8"/><text class="h" x="150" y="520">诊断顺序</text><text class="x" x="150" y="546">先看 trace: 模型看到了什么、建议了什么、系统执行了什么、环境返回了什么;再定位该修哪一层。</text></svg>
