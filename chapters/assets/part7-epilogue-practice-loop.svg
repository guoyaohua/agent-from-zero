<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">从 0 到 1 之后的实践循环</title><desc id="desc">展示读者完成本书后,如何通过构建、观测、评估、修复和扩展形成持续实践循环。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.n1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:2}.n5{fill:#ffe8e8;stroke:#c54a4a;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:3;stroke-linecap:round}.dot{fill:#172033}</style></defs><rect class="bg" width="1120" height="560"/><text class="t" x="56" y="58">从 0 到 1 之后,真正的能力来自持续闭环</text><text class="s" x="56" y="86">不要追求一次做大,而是反复经历构建、观测、评估、修复、扩展。</text><rect class="n1" x="458" y="130" width="204" height="70" rx="10"/><text class="h" x="524" y="160">Build</text><text class="x" x="500" y="184">最小可用系统</text><rect class="n2" x="760" y="235" width="204" height="70" rx="10"/><text class="h" x="820" y="265">Observe</text><text class="x" x="800" y="289">trace / cost / failures</text><rect class="n3" x="642" y="450" width="204" height="70" rx="10"/><text class="h" x="704" y="480">Evaluate</text><text class="x" x="682" y="504">baseline vs candidate</text><rect class="n4" x="274" y="450" width="204" height="70" rx="10"/><text class="h" x="340" y="480">Repair</text><text class="x" x="306" y="504">Prompt/Context/Harness/Loop</text><rect class="n5" x="156" y="235" width="204" height="70" rx="10"/><text class="h" x="218" y="265">Expand</text><text class="x" x="196" y="289">新工具/记忆/权限</text><path class="line" d="M560 200C670 198 760 225 862 235M862 305C850 390 804 430 744 450M642 485H478M376 450C306 400 270 340 258 305M258 235C330 170 410 145 458 165"/><circle class="dot" r="9"><animateMotion dur="7s" repeatCount="indefinite" path="M560 165C670 198 760 225 862 270C850 390 804 430 744 485H376C306 400 270 340 258 270C330 170 410 145 560 165"/></circle></svg>
