<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">Harness 的状态、动作和观察契约</title><desc id="desc">展示 Agent Harness 通过 State、Action、Observation 三个契约连接模型决策和系统执行。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 17px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.mono{font:400 12px ui-monospace,SFMono-Regular,Consolas;fill:#334155}.b1{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b2{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.b3{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.p{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="580"/><text class="t" x="56" y="58">Harness Engineering 的三个核心契约</text><text class="s" x="56" y="86">State 告诉模型现在在哪里,Action 限定模型能提出什么,Observation 把世界反馈写回系统。</text>
  <g transform="translate(0,-29)"><rect class="b1" x="80" y="160" width="280" height="250" rx="10"/><text class="h" x="184" y="196">State</text><text class="x" x="116" y="230">目标、约束、计划</text><text class="x" x="116" y="258">已知事实和证据</text><text class="x" x="116" y="286">已执行动作</text><text class="x" x="116" y="314">预算和权限状态</text><rect class="p" x="112" y="348" width="216" height="42" rx="7"/><text class="mono" x="132" y="375">state.version = 12</text><rect class="b2" x="420" y="160" width="280" height="250" rx="10"/><text class="h" x="520" y="196">Action</text><text class="x" x="456" y="230">动作类型</text><text class="x" x="456" y="258">工具名和参数</text><text class="x" x="456" y="286">风险等级</text><text class="x" x="456" y="314">幂等性和确认要求</text><rect class="p" x="452" y="348" width="216" height="42" rx="7"/><text class="mono" x="470" y="375">type = tool_call</text><rect class="b3" x="760" y="160" width="280" height="250" rx="10"/><text class="h" x="850" y="196">Observation</text><text class="x" x="796" y="230">工具返回</text><text class="x" x="796" y="258">错误类型</text><text class="x" x="796" y="286">环境状态变化</text><text class="x" x="796" y="314">可追溯引用</text><rect class="p" x="792" y="348" width="216" height="42" rx="7"/><text class="mono" x="812" y="375">ok = false</text><path class="a" d="M360 285H420M700 285H760M900 410C830 510 280 510 220 410"/><rect class="p" x="140" y="500" width="840" height="58" rx="8"/><text class="h" x="168" y="535">为什么这叫工程契约</text><text class="x" x="356" y="535">模型可参与填写,但契约由系统验证、版本化、记录和回放。</text>
  </g>
</svg>
