<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">LLM 请求和响应契约</title><desc id="desc">展示一次 LLM API 调用的输入契约包含模型参数、消息上下文、工具格式和元数据,输出契约包含文本、JSON、工具调用、结束原因和用量。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.4px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.in{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.api{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.out{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.tag{fill:#172033}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="600"/><text class="t" x="56" y="58">一次 LLM 调用是输入契约和输出契约</text><text class="s" x="56" y="86">Agent 调试要记录模型看到什么、被允许做什么、返回了什么以及为什么被接受。</text><rect class="in" x="70" y="150" width="290" height="278" rx="12"/><text class="h" x="162" y="184">Input Contract</text><text class="x" x="104" y="224">model + parameters</text><text class="x" x="104" y="260">messages + context</text><text class="x" x="104" y="296">tools + response_format</text><text class="x" x="104" y="332">metadata + trace id</text><text class="x" x="104" y="368">budget + policy hints</text><rect class="api" x="438" y="210" width="244" height="158" rx="14"/><text class="h" x="510" y="250">LLM API</text><text class="x" x="480" y="284">生成文本、JSON</text><text class="x" x="480" y="310">或 action proposal</text><rect class="out" x="760" y="150" width="290" height="278" rx="12"/><text class="h" x="850" y="184">Output Contract</text><text class="x" x="794" y="224">content / structured JSON</text><text class="x" x="794" y="260">tool call proposal</text><text class="x" x="794" y="296">finish_reason / refusal</text><text class="x" x="794" y="332">parse_ok / validation</text><text class="x" x="794" y="368">token usage / latency</text><path class="a" d="M360 289H438M682 289H760"/><rect class="box" x="176" y="482" width="768" height="42" rx="8"/><text class="x" x="210" y="508">关键: 模型返回工具调用只是 proposal;解析、校验、授权和执行仍由系统负责。</text></svg>
