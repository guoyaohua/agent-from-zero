<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">测试时计算与推理型模型</title>
  <desc id="desc">展示推理型模型如何通过任务路由、候选生成、验证器、工具校验和预算门控使用测试时计算。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#596579}.head{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.text{font:400 12.5px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#435066}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.fast{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.deep{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.gate{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.risk{fill:#f7d9df;stroke:#b13c52;stroke-width:2}.line{fill:none;stroke:#7a8aa0;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#7a8aa0;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="56" y="58">测试时计算: 把更多预算花在真正困难的问题上</text>
  <text class="sub" x="56" y="86">推理型模型的价值不是输出更长,而是能在分解、验证、回溯和工具校验上投入可控计算。</text>

  <rect class="panel" x="54" y="122" width="1012" height="360" rx="10"/>
  <rect class="gate" x="92" y="178" width="160" height="78" rx="8"/>
  <text class="head" x="126" y="210">Task Router</text>
  <text class="text" x="116" y="235">难度 / 风险 / 证据缺口</text>

  <rect class="fast" x="330" y="132" width="190" height="76" rx="8"/>
  <text class="head" x="374" y="164">Fast Path</text>
  <text class="text" x="356" y="188">分类、抽取、简单改写</text>

  <rect class="deep" x="330" y="262" width="190" height="76" rx="8"/>
  <text class="head" x="372" y="294">Deep Path</text>
  <text class="text" x="360" y="318">复杂推理、代码、规划</text>

  <rect class="deep" x="596" y="222" width="170" height="70" rx="8"/>
  <text class="head" x="625" y="252">Candidates</text>
  <text class="text" x="625" y="275">多路径 / 草稿</text>

  <rect class="gate" x="596" y="330" width="170" height="70" rx="8"/>
  <text class="head" x="637" y="360">Verifier</text>
  <text class="text" x="622" y="383">规则 / 测试 / 证据</text>

  <rect class="risk" x="842" y="222" width="170" height="70" rx="8"/>
  <text class="head" x="884" y="252">Revise</text>
  <text class="text" x="874" y="275">修正计划或拒答</text>

  <rect class="fast" x="842" y="330" width="170" height="70" rx="8"/>
  <text class="head" x="884" y="360">Answer</text>
  <text class="text" x="866" y="383">标注已验证与风险</text>

  <path class="line" d="M252 214H330"/>
  <path class="line" d="M252 224C286 286 304 300 330 300"/>
  <path class="line" d="M520 170H842C878 170 904 188 916 222"/>
  <path class="line" d="M520 300C550 280 564 266 596 258"/>
  <path class="line" d="M766 258H842"/>
  <path class="line" d="M682 292V330"/>
  <path class="line" d="M766 365H842"/>
  <path class="dash" d="M927 330V292"/>
  <path class="dash" d="M842 257C812 256 798 276 766 365"/>

  <rect class="panel" x="92" y="504" width="928" height="70" rx="8"/>
  <text class="head" x="122" y="536">预算门控</text>
  <text class="text" x="212" y="536">低风险走快路径; 高风险才升级推理预算。每次升级都要留下 reason、cost、evidence gap 和 stop rule。</text>
  <text class="text" x="212" y="558">测试时计算的收益来自验证闭环,不是把所有问题都变成长回答。</text>
</svg>
