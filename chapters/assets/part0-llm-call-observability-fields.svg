<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">LLM 调用可观测字段</title><desc id="desc">列出 LLM 调用日志中应记录的请求标识、模型版本、提示词版本、参数、工具、响应类型、解析状态、token 用量和延迟字段。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.6}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.6}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.6}.tag{fill:#172033}</style></defs><rect class="bg" width="1120" height="640"/><text class="t" x="56" y="58">把每次模型调用记录成可复盘事件</text><text class="s" x="56" y="86">没有结构化日志,Agent 出错时只能猜;有日志,才能定位上下文、参数、工具还是解析问题。</text><rect class="box" x="70" y="128" width="980" height="414" rx="12"/><rect class="tag" x="104" y="154" width="220" height="30" rx="6"/><text class="m" x="172" y="174">字段组</text><rect class="tag" x="360" y="154" width="640" height="30" rx="6"/><text class="m" x="616" y="174">记录内容</text><rect class="p" x="104" y="206" width="220" height="52" rx="8"/><text class="h" x="164" y="238">轨迹定位</text><text class="x" x="380" y="238">request_id、task_id、turn、parent_call_id</text><rect class="p" x="104" y="274" width="220" height="52" rx="8"/><text class="h" x="164" y="306">模型与模板</text><text class="x" x="380" y="306">model、model_version、prompt_version、context_hash</text><rect class="o" x="104" y="342" width="220" height="52" rx="8"/><text class="h" x="164" y="374">参数与工具</text><text class="x" x="380" y="374">temperature、top_p、max_tokens、tools_available、tool_choice</text><rect class="v" x="104" y="410" width="220" height="52" rx="8"/><text class="h" x="164" y="442">响应与校验</text><text class="x" x="380" y="442">response_type、finish_reason、parse_ok、validation_error</text><rect class="g" x="104" y="478" width="220" height="52" rx="8"/><text class="h" x="164" y="510">成本与性能</text><text class="x" x="380" y="510">input_tokens、output_tokens、latency_ms、retry_count</text><rect class="box" x="188" y="580" width="744" height="34" rx="8"/><text class="x" x="220" y="602">敏感内容可存 hash 或引用;但必须能解释这次调用为何被接受、拒绝或重试。</text></svg>
