<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">短期记忆 reducer</title>
  <desc id="desc">展示短期记忆如何把用户消息、工具观察、错误、计划变更等事件通过 reducer 更新为可回放、可测试的 Agent state。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #364256; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2d7d80; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#greenArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d7d80" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">短期记忆是事件 reducer,不是聊天历史堆叠</text>
  <text class="sub" x="48" y="78">每个事件都以明确规则更新 state,最终形成下一轮 context pack。</text>

  <rect class="panel" x="48" y="112" width="1024" height="388" rx="8" />
  <rect class="blue" x="84" y="174" width="170" height="80" rx="8" />
  <text class="label" x="130" y="204">state_t</text>
  <text class="small" x="112" y="228">goal/plan/constraints</text>
  <path class="arrow" d="M254 214 H320" />

  <rect class="orange" x="320" y="148" width="194" height="132" rx="8" />
  <text class="label" x="382" y="180">event_t</text>
  <text class="small" x="354" y="210">user msg / tool result</text>
  <text class="small" x="354" y="234">error / plan update</text>
  <text class="small" x="354" y="258">artifact refs</text>
  <path class="arrow" d="M514 214 H586" />

  <rect class="green" x="586" y="156" width="176" height="116" rx="8" />
  <text class="label" x="640" y="188">Reducer</text>
  <text class="small" x="616" y="216">规则更新,保留来源</text>
  <text class="small" x="616" y="240">模型建议需验证</text>
  <path class="arrow" d="M762 214 H826" />

  <rect class="blue" x="826" y="174" width="170" height="80" rx="8" />
  <text class="label" x="872" y="204">state_t+1</text>
  <text class="small" x="854" y="228">可回放/可测试</text>

  <rect class="gray" x="144" y="344" width="230" height="76" rx="8" />
  <text class="label" x="184" y="374">State Replay</text>
  <text class="small" x="174" y="398">同一事件流应得到同一状态</text>
  <rect class="gray" x="444" y="344" width="230" height="76" rx="8" />
  <text class="label" x="484" y="374">Context Pack</text>
  <text class="small" x="474" y="398">从 state 中选择本轮材料</text>
  <rect class="red" x="744" y="344" width="230" height="76" rx="8" />
  <text class="label" x="784" y="374">防止状态污染</text>
  <text class="small" x="774" y="398">假设不能直接写成事实</text>
  <path class="loop" d="M911 254 C900 324 694 344 559 344" />

  <rect class="gray" x="72" y="532" width="976" height="42" rx="8" />
  <text class="text" x="98" y="558">读图方式: 调试短期记忆时,问“哪个事件让 state 变错了”,而不是只问“模型为什么忘了”。</text>
</svg>
