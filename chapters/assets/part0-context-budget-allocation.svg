<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">上下文预算分配决策</title><desc id="desc">展示规划、检索排查、生成草稿、校验修订和最终回答阶段中上下文预算应重点保留和减少的内容。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.p{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.6}.g{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.6}.o{fill:#fff0e6;stroke:#b05c37;stroke-width:1.6}.v{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.6}.tag{fill:#172033}</style></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">上下文预算要随任务阶段变化</text><text class="s" x="56" y="86">排查阶段需要细节,最终回答阶段需要结论和依据;不要把所有阶段的材料都塞在一起。</text><rect class="box" x="70" y="126" width="980" height="408" rx="12"/><rect class="tag" x="102" y="152" width="150" height="30" rx="6"/><text class="m" x="152" y="172">阶段</text><rect class="tag" x="290" y="152" width="354" height="30" rx="6"/><text class="m" x="414" y="172">重点保留</text><rect class="tag" x="682" y="152" width="322" height="30" rx="6"/><text class="m" x="792" y="172">应该减少</text><rect class="p" x="102" y="210" width="150" height="52" rx="8"/><text class="h" x="150" y="242">规划</text><text class="x" x="310" y="242">目标、约束、可用工具、粗略状态</text><text class="x" x="702" y="242">大段原始证据</text><rect class="g" x="102" y="278" width="150" height="52" rx="8"/><text class="h" x="134" y="310">检索/排查</text><text class="x" x="310" y="310">最新观察、失败信息、候选假设</text><text class="x" x="702" y="310">客套历史和无关对话</text><rect class="o" x="102" y="346" width="150" height="52" rx="8"/><text class="h" x="134" y="378">生成草稿</text><text class="x" x="310" y="378">证据包、格式、受众要求</text><text class="x" x="702" y="378">低相关工具日志</text><rect class="v" x="102" y="414" width="150" height="52" rx="8"/><text class="h" x="134" y="446">校验修订</text><text class="x" x="310" y="446">验证规则、引用、测试结果、缺口</text><text class="x" x="702" y="446">已解决的探索细节</text><rect class="p" x="102" y="482" width="150" height="52" rx="8"/><text class="h" x="134" y="514">最终回答</text><text class="x" x="310" y="514">结论、依据、限制、已执行动作</text><text class="x" x="702" y="514">内部重复推理和冗余材料</text><rect class="box" x="202" y="568" width="716" height="34" rx="8"/><text class="x" x="238" y="590">原则: 当前阶段不需要的材料,应保存引用,不要占据主上下文。</text></svg>
