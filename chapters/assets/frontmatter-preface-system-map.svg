<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">本书写作目标</title>
  <desc id="desc">展示本书如何把模型原理、Agent 机制和工程实践连接成从理解到落地的学习路径。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3}.head{font:700 18px system-ui;fill:#172033}.text{font:400 13px system-ui;fill:#435066}.a{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.b{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.c{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.d{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.1;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="470"/><text class="title" x="56" y="58">从概念热闹走向系统能力</text><text class="sub" x="56" y="86">这本书关心的不是 Agent 概念本身,而是把模型、工具、知识、评估和安全组成可用系统。</text>
  <g transform="translate(0,-79)">
  <rect class="a" x="112" y="210" width="190" height="90" rx="8"/><text class="head" x="150" y="246">模型原理</text><text class="text" x="142" y="272">能力从哪里来</text>
  <rect class="b" x="362" y="210" width="190" height="90" rx="8"/><text class="head" x="402" y="246">Agent 机制</text><text class="text" x="392" y="272">如何观察和行动</text>
  <rect class="c" x="612" y="210" width="190" height="90" rx="8"/><text class="head" x="650" y="246">工程实践</text><text class="text" x="642" y="272">如何评估和上线</text>
  <rect class="d" x="862" y="210" width="150" height="90" rx="8"/><text class="head" x="904" y="246">项目</text><text class="text" x="894" y="272">从 0 到 1</text>
  <path class="arrow" d="M302 255 H362"/><path class="arrow" d="M552 255 H612"/><path class="arrow" d="M802 255 H862"/>
  <rect class="panel" x="150" y="410" width="820" height="96" rx="8"/><text class="head" x="190" y="446">核心判断</text><text class="text" x="190" y="474">模型负责生成和判断,系统负责状态、证据、工具边界、观测、评估和安全。</text>
  </g>
</svg>

