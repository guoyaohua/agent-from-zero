<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Agent 循环与状态机</title>
  <desc id="desc">展示 Agent 在观察、决策、行动、状态更新之间循环,同时由状态机、预算、权限和停止条件约束。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.soft{fill:#eef3f8;stroke:#d8e0eb;stroke-width:1.2;rx:8}.head{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.tag{font:700 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}.loop{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.guard{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.state{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.danger{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1120" height="660"/>
  <text class="title" x="56" y="58">Agent loop: 不是 while 套模型,而是受控状态推进</text>
  <text class="sub" x="56" y="86">每一轮都要产生新观察、更新状态,并被预算、权限、风险和停止条件约束。</text>

  <rect class="panel" x="70" y="128" width="630" height="356" rx="8"/>
  <text class="head" x="102" y="170">核心循环</text>
  <rect class="loop" x="122" y="212" width="128" height="62" rx="8"/><text class="head" x="154" y="240">Observe</text><text class="text" x="147" y="260">整理事实</text>
  <rect class="loop" x="322" y="212" width="128" height="62" rx="8"/><text class="head" x="356" y="240">Decide</text><text class="text" x="350" y="260">选择动作</text>
  <rect class="loop" x="522" y="212" width="128" height="62" rx="8"/><text class="head" x="563" y="240">Act</text><text class="text" x="548" y="260">执行工具</text>
  <rect class="loop" x="322" y="354" width="128" height="62" rx="8"/><text class="head" x="354" y="382">Update</text><text class="text" x="349" y="402">写回状态</text>
  <path class="arrow" d="M250 243 H322"/><path class="arrow" d="M450 243 H522"/><path class="arrow" d="M586 274 C586 346 512 385 450 385"/><path class="arrow" d="M322 385 C246 385 186 337 186 274"/>
  <rect class="soft" x="112" y="450" width="516" height="24" rx="8"/><text class="mono" x="134" y="467">Loop invariant: 每轮要推进任务、获得新信息,或缩小问题空间</text>

  <rect class="panel" x="742" y="128" width="306" height="356" rx="8"/>
  <text class="head" x="774" y="170">运行时护栏</text>
  <rect class="guard" x="780" y="206" width="226" height="48" rx="8"/><text class="head" x="808" y="236">预算与超时</text>
  <rect class="guard" x="780" y="270" width="226" height="48" rx="8"/><text class="head" x="808" y="300">权限与确认</text>
  <rect class="guard" x="780" y="334" width="226" height="48" rx="8"/><text class="head" x="808" y="364">Schema 校验</text>
  <rect class="danger" x="780" y="398" width="226" height="48" rx="8"/><text class="head" x="808" y="428">停止与失败退出</text>

  <rect class="panel" x="70" y="520" width="978" height="92" rx="8"/>
  <rect x="102" y="546" width="102" height="26" rx="5" fill="#7c5aa6"/><text class="tag" x="121" y="564">状态机</text>
  <text class="mono" x="228" y="563">running -> waiting_tool -> running -> needs_user -> running -> done</text>
  <text class="text" x="228" y="590">模型可以建议动作,但只有 runtime 能根据状态决定是否执行。状态机让 Agent 可控、可审计、可恢复。</text>
</svg>
