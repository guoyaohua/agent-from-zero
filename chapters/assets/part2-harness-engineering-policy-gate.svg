<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Harness Policy Gate 判定模型</title><desc id="desc">展示 Harness 在执行动作前同时检查请求主体、动作、资源、上下文和环境,再给出允许、拒绝或需要确认的决策。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.4px system-ui;fill:#435066}.m{font:700 12px system-ui;fill:#fff}.in{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.gate{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.out{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.deny{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.ask{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}.tag{fill:#172033}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="620"/><text class="t" x="56" y="58">Policy Gate: 让“是否允许执行”成为 runtime 判定</text><text class="s" x="56" y="86">模型可以提出动作,但授权必须同时检查主体、动作、资源、上下文和环境。</text><rect class="in" x="80" y="132" width="190" height="62" rx="9"/><text class="h" x="138" y="158">Subject</text><text class="x" x="110" y="180">用户、角色、租户</text><rect class="in" x="80" y="216" width="190" height="62" rx="9"/><text class="h" x="144" y="242">Action</text><text class="x" x="108" y="264">工具、方法、风险</text><rect class="in" x="80" y="300" width="190" height="62" rx="9"/><text class="h" x="136" y="326">Resource</text><text class="x" x="106" y="348">文件、客户、订单</text><rect class="in" x="80" y="384" width="190" height="62" rx="9"/><text class="h" x="136" y="410">Context</text><text class="x" x="104" y="432">目标、阶段、确认</text><rect class="in" x="80" y="468" width="190" height="62" rx="9"/><text class="h" x="128" y="494">Environment</text><text class="x" x="104" y="516">dev/prod、sandbox</text><rect class="gate" x="424" y="214" width="286" height="206" rx="14"/><text class="h" x="508" y="250">Policy Gate</text><rect class="tag" x="468" y="278" width="198" height="28" rx="6"/><text class="m" x="506" y="297">ACL + risk rule</text><rect class="tag" x="468" y="320" width="198" height="28" rx="6"/><text class="m" x="502" y="339">budget + stage</text><rect class="tag" x="468" y="362" width="198" height="28" rx="6"/><text class="m" x="494" y="381">source + confirmation</text><path class="a" d="M270 163C340 170 384 214 424 248M270 247H424M270 331C340 326 378 316 424 314M270 415C340 404 378 374 424 354M270 499C350 478 398 424 462 420"/><rect class="out" x="836" y="168" width="206" height="70" rx="9"/><text class="h" x="910" y="196">Allow</text><text class="x" x="870" y="220">进入 executor 执行</text><rect class="ask" x="836" y="276" width="206" height="70" rx="9"/><text class="h" x="884" y="304">Need Confirm</text><text class="x" x="868" y="328">生成 preview 等待授权</text><rect class="deny" x="836" y="384" width="206" height="70" rx="9"/><text class="h" x="914" y="412">Deny</text><text class="x" x="864" y="436">结构化拒绝和原因</text><path class="a" d="M710 278C756 248 792 214 836 204M710 318H836M710 362C758 384 790 406 836 418"/><text class="x" x="432" y="474">关键: 规则在代码和配置中执行,不是写在 Prompt 里让模型自觉遵守。</text></svg>
