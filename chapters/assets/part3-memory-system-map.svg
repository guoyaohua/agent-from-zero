<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Agent 记忆系统地图</title>
  <desc id="desc">展示短期状态、长期记忆、外部知识源、记忆写入、检索和上下文构建之间的关系。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}.short{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.long{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.know{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.ctx{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.risk{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="660"/><text class="title" x="56" y="58">记忆系统: 不是存历史,而是管理信息生命周期</text><text class="sub" x="56" y="86">短期状态、长期记忆和外部知识源各有不同作用,最终都要经过上下文构建进入模型。</text>
  <rect class="short" x="78" y="164" width="230" height="112" rx="8"/><text class="head" x="128" y="202">短期状态</text><text class="text" x="108" y="230">目标、计划、观察</text><text class="text" x="108" y="252">当前任务内有效</text>
  <rect class="long" x="78" y="342" width="230" height="112" rx="8"/><text class="head" x="128" y="380">长期记忆</text><text class="text" x="108" y="408">偏好、约定、经验</text><text class="text" x="108" y="430">跨任务复用</text>
  <rect class="know" x="78" y="510" width="230" height="82" rx="8"/><text class="head" x="116" y="545">外部知识源</text><text class="text" x="108" y="570">文档、数据库、网页、代码</text>
  <rect class="panel" x="390" y="144" width="284" height="394" rx="8"/><text class="head" x="426" y="184">记忆操作</text><rect class="ctx" x="430" y="220" width="204" height="48" rx="8"/><text class="text" x="488" y="250">Capture 捕获</text><rect class="ctx" x="430" y="288" width="204" height="48" rx="8"/><text class="text" x="496" y="318">Write 写入</text><rect class="ctx" x="430" y="356" width="204" height="48" rx="8"/><text class="text" x="486" y="386">Retrieve 检索</text><rect class="ctx" x="430" y="424" width="204" height="48" rx="8"/><text class="text" x="506" y="454">Use 使用</text><rect class="risk" x="430" y="492" width="204" height="48" rx="8"/><text class="text" x="482" y="522">Update/Forget</text>
  <rect class="ctx" x="768" y="226" width="250" height="122" rx="8"/><text class="head" x="814" y="264">Context Builder</text><text class="text" x="804" y="294">选择、排序、压缩、标注来源</text><text class="text" x="804" y="318">只把当前需要的信息放入上下文</text>
  <rect class="panel" x="768" y="422" width="250" height="82" rx="8"/><text class="head" x="864" y="455">LLM</text><text class="text" x="804" y="482">基于当前上下文推理和行动</text>
  <path class="arrow" d="M308 220 H390"/><path class="arrow" d="M308 398 H390"/><path class="arrow" d="M308 552 H390"/><path class="arrow" d="M674 386 H768"/><path class="arrow" d="M893 348 V422"/><path class="arrow" d="M893 504 C893 604 184 620 184 454"/>
</svg>
