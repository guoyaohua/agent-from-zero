<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Harness 写操作恢复模型</title><desc id="desc">按恢复难度展示临时草稿、覆盖写、可回滚写、可补偿副作用和不可逆动作的 Harness 控制要求。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 15.5px system-ui;fill:#172033}.x{font:400 12.3px system-ui;fill:#435066}.box{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.l1{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.l2{fill:#eef5dc;stroke:#7a8f2f;stroke-width:1.7}.l3{fill:#fff0e6;stroke:#b05c37;stroke-width:1.7}.l4{fill:#f3e8f6;stroke:#7c4d9b;stroke-width:1.7}.l5{fill:#ffe8e2;stroke:#c5533f;stroke-width:1.7}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="600"/><text class="t" x="56" y="58">写操作先问恢复模型,再决定能否自动执行</text><text class="s" x="56" y="86">副作用越难恢复,Harness 越要把动作拆成 preview、confirm、commit 和补偿。</text><rect class="box" x="70" y="146" width="980" height="324" rx="12"/><rect class="l1" x="102" y="200" width="164" height="170" rx="9"/><text class="h" x="142" y="230">可忽略</text><text class="x" x="126" y="260">临时草稿</text><text class="x" x="126" y="284">缓存文件</text><text class="x" x="126" y="322">要求: TTL</text><text class="x" x="126" y="346">和清理策略</text><rect class="l2" x="286" y="200" width="164" height="170" rx="9"/><text class="h" x="326" y="230">可覆盖</text><text class="x" x="310" y="260">本地草稿</text><text class="x" x="310" y="284">配置候选</text><text class="x" x="310" y="322">要求: diff</text><text class="x" x="310" y="346">和上一版本</text><rect class="l3" x="470" y="200" width="164" height="170" rx="9"/><text class="h" x="510" y="230">可回滚</text><text class="x" x="494" y="260">数据库事务</text><text class="x" x="494" y="284">PR 修改</text><text class="x" x="494" y="322">要求: rollback</text><text class="x" x="494" y="346">token 和验证点</text><rect class="l4" x="654" y="200" width="164" height="170" rx="9"/><text class="h" x="694" y="230">可补偿</text><text class="x" x="678" y="260">已发邮件</text><text class="x" x="678" y="284">已建工单</text><text class="x" x="678" y="322">要求: 补偿动作</text><text class="x" x="678" y="346">和通知审计</text><rect class="l5" x="838" y="200" width="164" height="170" rx="9"/><text class="h" x="890" y="230">不可逆</text><text class="x" x="862" y="260">外部转账</text><text class="x" x="862" y="284">删除生产数据</text><text class="x" x="862" y="322">要求: 强确认</text><text class="x" x="862" y="346">和人工审批</text><path class="a" d="M266 285H286M450 285H470M634 285H654M818 285H838"/><text class="x" x="122" y="418">自动化程度高</text><text class="x" x="846" y="418">自动化程度低,更多交给确认路径</text><rect class="box" x="138" y="504" width="844" height="42" rx="8"/><text class="x" x="170" y="530">设计准则: 如果恢复成本无法说明,就不要把 commit 暴露为普通工具;先暴露 prepare/preview/request_approval。</text></svg>
