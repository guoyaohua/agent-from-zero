<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">全书路线图</title>
  <desc id="desc">展示本书从入门、原理、Agent 核心、能力构建、架构、工程、项目到前沿的路线。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui;fill:#172033}.sub{font:400 15px system-ui;fill:#596579}.head{font:700 15px system-ui;fill:#172033}.text{font:400 12px system-ui;fill:#435066}.n{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.n2{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.n3{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.n4{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2}.arrow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1120" height="280"/><text class="title" x="56" y="58">从 0 到 1 的学习路线</text><text class="sub" x="56" y="86">先建立直觉,再理解模型,随后构建 Agent,最后走向生产和前沿。</text>
  <g transform="translate(0,-119)">
  <rect class="n" x="84" y="260" width="112" height="62" rx="8"/><text class="head" x="116" y="286">Part 0</text><text class="text" x="110" y="306">入门直觉</text>
  <rect class="n2" x="230" y="260" width="112" height="62" rx="8"/><text class="head" x="262" y="286">Part 1</text><text class="text" x="256" y="306">模型原理</text>
  <rect class="n3" x="376" y="260" width="112" height="62" rx="8"/><text class="head" x="408" y="286">Part 2</text><text class="text" x="402" y="306">核心循环</text>
  <rect class="n4" x="522" y="260" width="112" height="62" rx="8"/><text class="head" x="554" y="286">Part 3</text><text class="text" x="548" y="306">能力构建</text>
  <rect class="n" x="668" y="260" width="112" height="62" rx="8"/><text class="head" x="700" y="286">Part 4</text><text class="text" x="694" y="306">架构进阶</text>
  <rect class="n2" x="814" y="260" width="112" height="62" rx="8"/><text class="head" x="846" y="286">Part 5</text><text class="text" x="840" y="306">工程实践</text>
  <rect class="n3" x="960" y="260" width="92" height="62" rx="8"/><text class="head" x="984" y="286">Part 6+</text><text class="text" x="982" y="306">项目前沿</text>
  <path class="arrow" d="M196 291 H230"/><path class="arrow" d="M342 291 H376"/><path class="arrow" d="M488 291 H522"/><path class="arrow" d="M634 291 H668"/><path class="arrow" d="M780 291 H814"/><path class="arrow" d="M926 291 H960"/>
  </g>
</svg>

