<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">开放问题的研究与工程分层</title><desc id="desc">展示 Agent 开放问题中哪些更偏研究突破,哪些更偏工程治理,以及二者如何通过评估和运行时连接。</desc><defs><style>.bg{fill:#f7f8fb}.t{font:700 30px system-ui;fill:#172033}.s{font:400 15px system-ui;fill:#596579}.h{font:700 16px system-ui;fill:#172033}.x{font:400 12.5px system-ui;fill:#435066}.r{fill:#dfe8f5;stroke:#355c9a;stroke-width:2}.e{fill:#fff0e6;stroke:#b05c37;stroke-width:2}.m{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2}.p{fill:#fff;stroke:#d8e0eb;stroke-width:1.2}.a{fill:none;stroke:#7a8aa0;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8aa0"/></marker></defs><rect class="bg" width="1120" height="550"/><text class="t" x="56" y="58">Agent 开放问题: 不要把工程缺口误判成研究瓶颈</text><text class="s" x="56" y="86">有些问题需要模型突破,有些今天就能通过 runtime、eval 和治理显著改善。</text>
  <g transform="translate(0,-37)"><rect class="r" x="90" y="170" width="300" height="250" rx="12"/><text class="h" x="190" y="204">Research</text><text class="x" x="124" y="238">长程推理可靠性</text><text class="x" x="124" y="266">不确定性估计</text><text class="x" x="124" y="294">内部机制可解释</text><text class="x" x="124" y="322">鲁棒工具使用</text><text class="x" x="124" y="350">跨模态 grounding</text><rect class="e" x="730" y="170" width="300" height="250" rx="12"/><text class="h" x="830" y="204">Engineering</text><text class="x" x="764" y="238">trace 和 eval</text><text class="x" x="764" y="266">权限和 sandbox</text><text class="x" x="764" y="294">记忆治理</text><text class="x" x="764" y="322">成本和延迟控制</text><text class="x" x="764" y="350">事故响应</text><rect class="m" x="440" y="250" width="240" height="94" rx="10"/><text class="h" x="518" y="284">Bridge</text><text class="x" x="470" y="312">评估集 / 轨迹 / 失败归因</text><path class="a" d="M390 296H440M680 296H730"/><rect class="p" x="160" y="500" width="800" height="54" rx="8"/><text class="h" x="190" y="533">判断</text><text class="x" x="254" y="533">如果 trace 能定位且 runtime 能阻止,优先工程治理;如果系统边界完整仍稳定失败,再归因到模型能力。</text>
  </g>
</svg>
