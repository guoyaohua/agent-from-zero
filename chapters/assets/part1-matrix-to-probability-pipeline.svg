<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">从向量表示到概率分布</title>
  <desc id="desc">展示输入向量经过矩阵投影得到 logits,再经过 Softmax 转为概率分布,说明矩阵行可以看成候选 token 或类别的打分器。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .red { fill: #f7d9df; stroke: #b13c52; stroke-width: 2; }
      .cell { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 400 11.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="560" />
  <text class="title" x="48" y="48">矩阵不是装饰: 它把隐藏向量变成每个候选的分数</text>
  <text class="sub" x="48" y="74">输出层可以看成很多个候选 token 的打分器并排工作,Softmax 再把这些分数归一成概率。</text>
  <rect class="panel" x="48" y="104" width="1024" height="340" rx="8" />

  <rect class="blue" x="92" y="174" width="160" height="120" rx="8" />
  <text class="label" x="128" y="206">隐藏向量 h</text>
  <g transform="translate(126 226)">
    <rect class="cell" x="0" y="0" width="94" height="18" rx="3" />
    <rect class="cell" x="0" y="24" width="94" height="18" rx="3" />
    <rect class="cell" x="0" y="48" width="94" height="18" rx="3" />
  </g>
  <path class="arrow" d="M252 234 H336" />

  <rect class="orange" x="336" y="150" width="210" height="168" rx="8" />
  <text class="label" x="400" y="180">矩阵 W</text>
  <text class="small" x="370" y="208">每一行: 一个候选打分器</text>
  <g transform="translate(376 228)">
    <rect class="cell" x="0" y="0" width="130" height="18" rx="3" />
    <rect class="cell" x="0" y="24" width="130" height="18" rx="3" />
    <rect class="cell" x="0" y="48" width="130" height="18" rx="3" />
  </g>
  <path class="arrow" d="M546 234 H630" />

  <rect class="green" x="630" y="174" width="160" height="120" rx="8" />
  <text class="label" x="686" y="206">logits</text>
  <text class="small" x="666" y="234">[2.4, 1.2, 0.5]</text>
  <text class="small" x="664" y="258">相对偏好,还不是概率</text>
  <path class="arrow" d="M790 234 H874" />

  <rect class="red" x="874" y="154" width="150" height="160" rx="8" />
  <text class="label" x="918" y="184">概率</text>
  <rect class="green" x="906" y="214" width="82" height="18" rx="4" />
  <rect class="orange" x="906" y="242" width="48" height="18" rx="4" />
  <rect class="blue" x="906" y="270" width="30" height="18" rx="4" />
  <text class="small" x="914" y="336">sum = 1</text>

  <rect class="panel" x="170" y="362" width="780" height="44" rx="8" />
  <text class="text" x="198" y="389">LLM 把这个过程扩大到十万级词表: 每个生成步都在为所有候选 token 打分。</text>
  <rect class="panel" x="72" y="470" width="976" height="42" rx="8" />
  <text class="text" x="98" y="496">读图方式: 向量承载上下文,矩阵生成候选分数,概率分布再决定训练损失和采样行为。</text>
</svg>
