<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">注意力变体的成本与可见范围取舍</title>
  <desc id="desc">对比全量注意力、滑窗注意力、稀疏注意力和线性注意力在连接模式、成本、全局可见性和质量风险上的差异。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596579; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 1.2; }
      .blue { fill: #dfe8f5; stroke: #355c9a; stroke-width: 2; }
      .green { fill: #e7f1ee; stroke: #2d7d80; stroke-width: 2; }
      .orange { fill: #fff0e6; stroke: #b05c37; stroke-width: 2; }
      .gray { fill: #eef3f8; stroke: #cbd5e1; stroke-width: 1.3; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .text { font: 400 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435066; }
      .cell { fill: #dfe8f5; stroke: #ffffff; stroke-width: 1; }
      .hit { fill: #355c9a; }
      .hit2 { fill: #2d7d80; }
      .hit3 { fill: #b05c37; }
      .arrow { fill: none; stroke: #8b98aa; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b98aa" /></marker>
  </defs>
  <rect class="bg" width="1120" height="620" />
  <text class="title" x="48" y="52">注意力变体都在回答同一个问题:哪些连接值得算?</text>
  <text class="sub" x="48" y="78">降低成本通常意味着改变可见范围、近似 Softmax,或把信息压缩到更小的状态里。</text>
  <rect class="panel" x="48" y="112" width="238" height="330" rx="8" />
  <text class="label" x="82" y="148">全量注意力</text>
  <g transform="translate(86 178)">
    <rect class="hit" x="0" y="0" width="128" height="128" rx="4" opacity="0.9" />
    <path d="M0 32 H128 M0 64 H128 M0 96 H128 M32 0 V128 M64 0 V128 M96 0 V128" stroke="#ffffff" stroke-width="1" />
  </g>
  <text class="text" x="82" y="336">每个 token 看所有 token</text>
  <text class="text" x="82" y="362">质量稳,成本 O(T^2)</text>
  <rect class="panel" x="312" y="112" width="238" height="330" rx="8" />
  <text class="label" x="346" y="148">滑窗注意力</text>
  <g transform="translate(350 178)">
    <rect class="cell" x="0" y="0" width="128" height="128" rx="4" />
    <path d="M0 32 H128 M0 64 H128 M0 96 H128 M32 0 V128 M64 0 V128 M96 0 V128" stroke="#ffffff" stroke-width="1" />
    <path class="hit2" d="M0 0 H36 V18 H54 V54 H90 V90 H126 V128 H94 V110 H72 V72 H36 V36 H0 Z" opacity="0.85" />
  </g>
  <text class="text" x="346" y="336">只看邻近窗口</text>
  <text class="text" x="346" y="362">成本 O(Tw),远距弱</text>
  <rect class="panel" x="576" y="112" width="238" height="330" rx="8" />
  <text class="label" x="610" y="148">稀疏注意力</text>
  <g transform="translate(614 178)">
    <rect class="cell" x="0" y="0" width="128" height="128" rx="4" />
    <path d="M0 32 H128 M0 64 H128 M0 96 H128 M32 0 V128 M64 0 V128 M96 0 V128" stroke="#ffffff" stroke-width="1" />
    <rect class="hit3" x="0" y="0" width="128" height="20" opacity="0.85" />
    <rect class="hit3" x="0" y="0" width="20" height="128" opacity="0.85" />
    <rect class="hit2" x="32" y="32" width="32" height="32" opacity="0.75" />
    <rect class="hit2" x="72" y="72" width="32" height="32" opacity="0.75" />
  </g>
  <text class="text" x="610" y="336">局部 + 全局 + 跳连</text>
  <text class="text" x="610" y="362">模式选错会漏关键关系</text>
  <rect class="panel" x="840" y="112" width="232" height="330" rx="8" />
  <text class="label" x="874" y="148">线性注意力</text>
  <rect class="blue" x="874" y="190" width="58" height="42" rx="8" /><text class="label" x="896" y="217">Q</text>
  <rect class="green" x="874" y="272" width="58" height="42" rx="8" /><text class="label" x="896" y="299">K,V</text>
  <path class="arrow" d="M932 293 H982" />
  <rect class="orange" x="982" y="252" width="54" height="84" rx="8" /><text class="label" x="996" y="298">S</text>
  <path class="arrow" d="M932 211 C970 216 980 236 986 252" />
  <text class="text" x="874" y="336">先压缩 K/V,再查询</text>
  <text class="text" x="874" y="362">近似强,需实测质量</text>
  <rect class="gray" x="72" y="482" width="976" height="60" rx="8" />
  <text class="label" x="98" y="510">工程判断</text>
  <text class="text" x="190" y="510">短文本优先全量 + FlashAttention; 超长扫描考虑滑窗/稀疏; 生产 Agent 先减少无关上下文。</text>
  <text class="text" x="190" y="532">理论复杂度不是唯一指标,还要看 GPU kernel、batching、KV Cache、评估集和错误代价。</text>
</svg>
