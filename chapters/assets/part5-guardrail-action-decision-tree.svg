<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">护栏动作决策树</title>
  <desc id="desc">展示护栏如何根据风险、确定性、可恢复性和用户信息选择放行、脱敏、澄清、确认、降级、升级或拒绝。</desc>
  <defs><style>.bg{fill:#f7f8fb}.title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.head{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.q{fill:#fff0e6;stroke:#b05c37;stroke-width:1.8}.a{fill:#e7f1ee;stroke:#2d7d80;stroke-width:1.7}.warn{fill:#dfe8f5;stroke:#355c9a;stroke-width:1.7}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:1.7}.arrow{fill:none;stroke:#8796aa;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8796aa"/></marker></defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="56" y="54">护栏动作不只有拒绝,要选择最小必要干预</text>
  <text class="sub" x="56" y="82">同一个策略命中后,根据风险和可恢复性选择不同动作。</text>
  <rect class="q" x="452" y="116" width="216" height="64" rx="8"/><text class="head" x="500" y="154">是否明确违规?</text>
  <rect class="bad" x="784" y="116" width="160" height="64" rx="8"/><text class="head" x="842" y="154">Block</text>
  <rect class="q" x="452" y="222" width="216" height="64" rx="8"/><text class="head" x="492" y="260">是否信息不足?</text>
  <rect class="warn" x="160" y="222" width="160" height="64" rx="8"/><text class="head" x="198" y="260">Clarify</text>
  <rect class="q" x="452" y="328" width="216" height="64" rx="8"/><text class="head" x="484" y="366">是否高风险可确认?</text>
  <rect class="warn" x="160" y="328" width="160" height="64" rx="8"/><text class="head" x="200" y="366">Confirm</text>
  <rect class="a" x="784" y="328" width="160" height="64" rx="8"/><text class="head" x="824" y="366">Downgrade</text>
  <rect class="a" x="784" y="222" width="160" height="64" rx="8"/><text class="head" x="836" y="260">Allow</text>
  <path class="arrow" d="M668 148 H784"/><path class="arrow" d="M560 180 V222"/><path class="arrow" d="M452 254 H320"/><path class="arrow" d="M668 254 H784"/><path class="arrow" d="M560 286 V328"/><path class="arrow" d="M452 360 H320"/><path class="arrow" d="M668 360 H784"/>
  <rect x="166" y="444" width="788" height="36" rx="8" fill="#172033"/><text x="246" y="467" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">好的护栏把危险动作降级成草稿、澄清或确认,而不是只会说“不”。</text>
</svg>
