<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">ReAct 与观察溯源</title>
  <desc id="desc">展示 ReAct 在推理、行动、观察之间循环,最终答案必须区分观察事实、模型推断和未验证假设。</desc>
  <defs>
    <style>.bg{fill:#f7f8fb}.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596579}.panel{fill:#fff;stroke:#d8e0eb;stroke-width:1.3;rx:8}.head{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#435066}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#364256}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}.thought{fill:#ece7f3;stroke:#7c5aa6;stroke-width:2;rx:8}.action{fill:#dfe8f5;stroke:#355c9a;stroke-width:2;rx:8}.obs{fill:#e7f1ee;stroke:#2d7d80;stroke-width:2;rx:8}.warn{fill:#fff0e6;stroke:#b05c37;stroke-width:2;rx:8}.bad{fill:#f7d9df;stroke:#b13c52;stroke-width:2;rx:8}.tag{font:700 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1120" height="660"/>
  <text class="title" x="56" y="58">ReAct: 用行动获取证据,用观察约束结论</text>
  <text class="sub" x="56" y="86">重点不是展示完整思维链,而是让每个行动有目的,让最终回答能追溯到工具观察。</text>

  <rect class="panel" x="70" y="128" width="980" height="212" rx="8"/>
  <rect class="thought" x="106" y="190" width="156" height="66" rx="8"/><text class="head" x="146" y="220">Reason</text><text class="text" x="132" y="242">缺什么证据?</text>
  <rect class="action" x="342" y="190" width="156" height="66" rx="8"/><text class="head" x="388" y="220">Action</text><text class="text" x="372" y="242">调用哪个工具?</text>
  <rect class="obs" x="578" y="190" width="156" height="66" rx="8"/><text class="head" x="614" y="220">Observe</text><text class="text" x="604" y="242">工具返回什么?</text>
  <rect class="thought" x="814" y="190" width="156" height="66" rx="8"/><text class="head" x="858" y="220">Revise</text><text class="text" x="838" y="242">假设如何变化?</text>
  <path class="arrow" d="M262 223 H342"/><path class="arrow" d="M498 223 H578"/><path class="arrow" d="M734 223 H814"/><path class="arrow" d="M892 256 C892 304 184 314 184 256"/>

  <rect class="panel" x="70" y="382" width="456" height="184" rx="8"/>
  <text class="head" x="102" y="422">最终回答的三类内容</text>
  <rect class="obs" x="104" y="448" width="120" height="36" rx="8"/><text class="text" x="128" y="471">已观察事实</text>
  <rect class="warn" x="244" y="448" width="120" height="36" rx="8"/><text class="text" x="272" y="471">模型推断</text>
  <rect class="bad" x="384" y="448" width="120" height="36" rx="8"/><text class="text" x="405" y="471">未验证假设</text>
  <text class="mono" x="104" y="518">结论 = 观察 #3 + 观察 #5 -> 推断根因</text>
  <text class="text" x="104" y="546">不要把“应该会通过”写成“已经通过”。</text>

  <rect class="panel" x="570" y="382" width="480" height="184" rx="8"/>
  <text class="head" x="602" y="422">行动前后协议</text>
  <text class="mono" x="604" y="458">Before: 我要验证什么? 有副作用吗?</text>
  <text class="mono" x="604" y="492">After: 工具成功了吗? 新观察改变了什么?</text>
  <text class="mono" x="604" y="526">Exit: 无新信息时换策略或停止</text>
</svg>
